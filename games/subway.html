<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subway Surf</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
.app { display: flex; flex-direction: column; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
.title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
.best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
.divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
.card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
.playfield { position: relative; border-radius: 4px; overflow: hidden; }
canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; touch-action: none; }
.overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
.overlay h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
.overlay p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
.overlay .sect { border-top: 1px solid rgba(255,255,255,0.15); }
.overlay button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
.dpad { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 8px; justify-content: center; }
.dpad button { background: transparent; border: 1px solid #a9b8be; border-radius: 10px; color: #a9b8be; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-family: inherit; }
.dpad button:active { background: rgba(180,190,140,0.35); color: #4a5a5a; }
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 3; }
.hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 10px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="title">🚇 Subway Surf</div>
<div class="best">🏆 BEST <span id="best">0000</span></div>
</div>
<div class="divider"></div>
<div class="card">
<div class="scorebar">
<span>Score <span id="score">0000</span></span>
<span>Speed <span id="speed">1</span></span>
</div>
<div class="playfield">
<canvas id="c" width="336" height="240"></canvas>
<div class="overlay" id="overlay">
<h2 id="ovTitle">Game Over</h2>
<p id="overlayMsg">Your score: 0000.</p>
<div class="sect"><button id="restart">Play Again</button></div>
</div>
</div>
</div>
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="left" data-dir="left">◀</button>
<button class="right" data-dir="right">▶</button>
<button class="down" data-dir="down">▼</button>
</div>
<div class="hint">Swipe or tap to dodge. Don't let the cop catch you!</div>
</div>
<script src="https://marvsyboi2024-pixel.github.io/apiBaileysWA/games/subway.js"></script>
</body>
</html>

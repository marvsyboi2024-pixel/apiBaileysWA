<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Surf</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:8px}
.shell{background:#f4efdc;border-radius:14px;padding:10px 10px 9px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:0 2px 7px;border-bottom:1px solid rgba(58,74,42,.4);margin-bottom:8px}
.title{font-size:14px;font-weight:bold;color:#2a3a1a}
.best{background:rgba(180,190,140,.45);color:#3a3a2a;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;letter-spacing:1px;border:1px solid rgba(120,130,80,.6)}
.card{background:#1a1f17;border-radius:10px;padding:7px 8px 8px}
.sb{display:flex;justify-content:space-between;font:11px monospace;color:#c8d400;letter-spacing:1.5px;padding:0 2px 6px;text-transform:uppercase}
.pf{position:relative}
canvas{display:block;width:100%;height:auto;border-radius:4px;touch-action:none;background:#7ec8f0}
.ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;background:#283641;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.4);text-align:center;padding:14px 10px 0}
.ov h2{color:#fff;font-size:17px;margin-bottom:5px}
.ov p{color:#c4ccd4;font-size:12px;margin-bottom:10px}
.ov .s{border-top:1px solid rgba(255,255,255,.15)}
.ov button{background:none;border:0;color:#d4e000;font:bold 15px Arial;padding:11px 0;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);grid-template-areas:". up ." "left . right" ". down .";gap:0;margin:9px auto 0;width:fit-content}
.pad button{height:70px;width:70px;background:transparent;border:1.5px solid #6b7a5a;color:#3a4a2a;font-size:26px;touch-action:manipulation;margin:0;padding:0}
.pad button[data-d="up"]{grid-area:up;border-radius:12px 12px 0 0;border-bottom:0}
.pad button[data-d="left"]{grid-area:left;border-radius:12px 0 0 12px;border-right:0}
.pad button[data-d="right"]{grid-area:right;border-radius:0 12px 12px 0;border-left:0}
.pad button[data-d="down"]{grid-area:down;border-radius:0 0 12px 12px;border-top:0}
.pad button:active{background:rgba(160,175,100,.5)}
.hint{text-align:center;color:#4a5a3a;font-size:11px;font-weight:bold;margin-top:7px}
</style>
</head>
<body>
<div class="shell">
<div class="hd"><div class="title">🚇 Subway Surf</div><div class="best">🏆 BEST <span id="best">0000</span></div></div>
<div class="card">
<div class="sb"><span>Score <span id="score">0000</span></span><span>Coins <span id="coins">000</span></span></div>
<div class="pf">
<canvas id="c" width="336" height="300"></canvas>
<div class="ov" id="ov"><h2 id="ovT">Ready?</h2><p id="ovM">Swipe the road or tap an arrow to run.</p><div class="s"><button id="go">Play</button></div></div>
</div>
</div>
<div class="pad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="right">▶</button><button data-d="down">▼</button></div>
<div class="hint">Swipe: ◀ ▶ lanes · ▲ jump · ▼ roll. Hit twice and the cop gets you!</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
var HY=Math.round(H*0.30),T0=0.8,CC=10,LW=W*0.36,SP=95,TM=0.03;
var LEN={train:6,barrier:0.8,lowbar:0.8};
var PAL=['#e2503a','#f0a020','#2fa39a','#8a4fd0','#3a7bd5'];
var $=function(i){return document.getElementById(i)};
var scoreEl=$('score'),coinsEl=$('coins'),bestEl=$('best'),ov=$('ov'),ovT=$('ovT'),ovM=$('ovM');
var mem=0;
function getBest(){try{return parseInt(localStorage.getItem('subway_best')||'0',10)||0}catch(e){return mem}}
function setBest(v){mem=v;try{localStorage.setItem('subway_best',String(v))}catch(e){}}
function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n}
function tOf(z){return T0*CC/(CC+z)}
function yG(t){return HY+(H-HY)*t}
function X(x,t){return W/2+x*LW*t}
function Y(h,t){return yG(t)-h*LW*t}
function P(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(var i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function side(x,tf,tb,h,c){P([X(x,tf),Y(0,tf),X(x,tb),Y(0,tb),X(x,tb),Y(h,tb),X(x,tf),Y(h,tf)],c)}
function face(x0,x1,t,h,c,h0){var y1=Y(h,t),y0=Y(h0||0,t);g.fillStyle=c;g.fillRect(X(x0,t),y1,X(x1,t)-X(x0,t),y0-y1)}
function topf(x0,x1,tf,tb,h,c){P([X(x0,tb),Y(h,tb),X(x1,tb),Y(h,tb),X(x1,tf),Y(h,tf),X(x0,tf),Y(h,tf)],c)}
function hs(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
var S,best=getBest(),raf,last=0,lastTick=Date.now();
bestEl.textContent=pad(best,4);
function init(){S={run:false,dead:false,deadAt:0,z0:0,speed:22,dist:0,nextD:0,coins:0,lane:0,lx:0,jy:0,jv:0,jump:false,roll:0,stumble:0,shake:0,inv:0,copA:0,ph:0,obs:[],coin:[]}}
function score(){return Math.floor(S.dist*0.4+S.coins*5)}
function begin(){init();S.run=true;ov.style.display='none'}
function act(d){
  if(S.dead){if(Date.now()-S.deadAt>600)begin();return}
  if(!S.run)begin();
  if(d==='left'&&S.lane>-1)S.lane--;
  else if(d==='right'&&S.lane<1)S.lane++;
  else if(d==='up'&&!S.jump&&S.roll<=0){S.jump=true;S.jv=6;S.jy=0.01}
  else if(d==='down'){if(S.jump)S.jv=-9;else S.roll=0.55}
}
function caught(){
  S.dead=true;S.run=false;S.deadAt=Date.now();
  var sc=score();if(sc>best){best=sc;setBest(best);bestEl.textContent=pad(best,4)}
  ovT.textContent='Caught!';ovM.textContent='Score '+pad(sc,4)+' · Coins '+pad(S.coins,3);$('go').textContent='Play Again';ov.style.display='block';
}
function hit(){
  if(S.stumble>0){caught();return}
  S.stumble=5;S.shake=0.6;S.inv=1;S.speed=Math.max(18,S.speed*0.85);
}
function row(){
  var f=Math.floor(Math.random()*3)-1,x,r,t,i;
  for(x=-1;x<=1;x++){
    if(x===f)continue;r=Math.random();
    if(r<0.5){t=r<0.25?'train':(r<0.38?'barrier':'lowbar');S.obs.push({x:x,z:SP,t:t,mv:t==='train'&&Math.random()<0.4,c:Math.random()<0.5?1:0})}
  }
  if(Math.random()<0.7)for(i=0;i<6;i++)S.coin.push({x:f,z:SP+i*2.2});
}
function step(dt){
  var i,o,c,len;
  S.lx+=(S.lane-S.lx)*Math.min(1,dt*14);
  if(S.jump){S.jv-=20*dt;S.jy+=S.jv*dt;if(S.jy<=0){S.jy=0;S.jv=0;S.jump=false}}
  if(S.roll>0)S.roll-=dt;
  if(S.shake>0)S.shake-=dt;
  if(S.inv>0)S.inv-=dt;
  if(S.stumble>0)S.stumble-=dt;
  S.copA+=((S.stumble>0||S.dead?1:0)-S.copA)*Math.min(1,dt*3);
  if(!S.run)return;
  var v=S.speed*(S.shake>0?0.55:1);
  S.speed=Math.min(40,S.speed+0.3*dt);S.dist+=v*dt;S.z0+=v*dt;S.ph+=v*dt*0.55;
  if(S.dist>=S.nextD){row();S.nextD=S.dist+20+Math.random()*10}
  for(i=S.obs.length-1;i>=0;i--){
    o=S.obs[i];o.z-=(v+(o.mv?8:0))*dt;len=LEN[o.t];
    if(o.z+len<-4){S.obs.splice(i,1);continue}
    if(S.inv<=0&&o.z<0.5&&o.z+len>-0.5&&Math.abs(o.x-S.lx)<0.6){
      if(o.t==='barrier'&&S.jy>0.45)continue;
      if(o.t==='lowbar'&&S.roll>0)continue;
      S.obs.splice(i,1);hit();if(S.dead)return;
    }
  }
  for(i=S.coin.length-1;i>=0;i--){
    c=S.coin[i];c.z-=v*dt;
    if(c.z<-3){S.coin.splice(i,1);continue}
    if(Math.abs(c.z)<0.9&&Math.abs(c.x-S.lx)<0.6){S.coin.splice(i,1);S.coins++}
  }
}
function buildings(){
  var SEG=12,b=Math.floor(S.z0/SEG),i,s,zf,zb,tf,tb,h,c,x,r,hh;
  for(i=9;i>=0;i--){
    zf=(b+i)*SEG-S.z0;zb=zf+SEG-2;if(zb<-3)continue;zf=Math.max(zf,-3);tf=tOf(zf);tb=tOf(zb);
    for(s=-1;s<=1;s+=2){
      r=hs((b+i)*2+(s>0?1:0));h=3+r*6;c=PAL[Math.floor(hs((b+i)*7+s)*5)];x=s*2;
      side(x,tf,tb,h,c);side(x,tf,tb,h,'rgba(0,0,0,.28)');
      g.strokeStyle='rgba(255,240,150,.75)';g.lineWidth=1+2*tf;
      for(hh=1.2;hh<h;hh+=1.4){g.beginPath();g.moveTo(X(x,tf),Y(hh,tf));g.lineTo(X(x,tb),Y(hh,tb));g.stroke()}
      face(s>0?x:x-3.5,s>0?x+3.5:x,tf,h,c);
    }
  }
}
function person(cx,fy,U,sh,pn,hat,pk,ph,tuck,lean){
  var s=Math.sin(ph),a=U*0.06,ly=U*0.2,ty=fy-ly-U*0.26,lx=lean*U;
  g.fillStyle=pn;
  g.fillRect(cx-U*0.14,fy-ly-(tuck?a:Math.max(0,s)*a),U*0.11,ly);
  g.fillRect(cx+U*0.03,fy-ly-(tuck?a:Math.max(0,-s)*a),U*0.11,ly);
  g.fillStyle=sh;g.fillRect(cx-U*0.15+lx,ty,U*0.3,U*0.28);
  g.fillRect(cx-U*0.22+lx,ty+U*0.02+s*a,U*0.07,U*0.2);g.fillRect(cx+U*0.15+lx,ty+U*0.02-s*a,U*0.07,U*0.2);
  g.fillStyle=pk;g.fillRect(cx-U*0.09+lx,ty+U*0.04,U*0.18,U*0.18);
  g.fillStyle=hat;g.beginPath();g.arc(cx+lx*1.3,ty-U*0.08,U*0.1,0,6.3);g.fill();
  g.fillStyle='#3a2a20';g.fillRect(cx-U*0.08+lx*1.3,ty-U*0.04,U*0.16,U*0.05);
}
function drawTrain(o){
  var zf=Math.max(o.z,-2.5),zb=o.z+6;if(zb<-2.5)return;
  var tf=tOf(zf),tb=tOf(zb),xl=o.x-0.42,xr=o.x+0.42,h=1.4;
  g.globalAlpha=o.z>70?Math.max(0,(SP-o.z)/25):1;
  var body=o.c?'#e8a020':'#2f7fe0',fr=o.c?'#b87810':'#e8452c';
  topf(xl,xr,tf,tb,h,'#d6dce2');
  if(o.x<-0.1)side(xr,tf,tb,h,body);else if(o.x>0.1)side(xl,tf,tb,h,body);
  face(xl,xr,tf,h,fr);
  g.fillStyle='#bfe6ff';g.fillRect(X(xl+0.1,tf),Y(1.2,tf),X(xr-0.1,tf)-X(xl+0.1,tf),Math.max(2,0.3*LW*tf));
  if(o.mv){g.fillStyle='#fff6a0';g.fillRect(X(xl+0.08,tf),Y(0.35,tf),Math.max(2,0.14*LW*tf),Math.max(2,0.1*LW*tf));g.fillRect(X(xr-0.22,tf),Y(0.35,tf),Math.max(2,0.14*LW*tf),Math.max(2,0.1*LW*tf))}
  g.globalAlpha=1;
}
function drawBarrier(o){
  var t=tOf(Math.max(o.z,-2.5)),k;
  g.globalAlpha=o.z>70?Math.max(0,(SP-o.z)/25):1;
  face(o.x-0.4,o.x+0.4,t,0.45,'#ff8a00');
  g.fillStyle='#ffe100';
  for(k=0;k<4;k++)g.fillRect(X(o.x-0.4+k*0.2+0.04,t),Y(0.45,t),0.1*LW*t,0.45*LW*t);
  g.globalAlpha=1;
}
function drawLowbar(o){
  var t=tOf(Math.max(o.z,-2.5)),k;
  g.globalAlpha=o.z>70?Math.max(0,(SP-o.z)/25):1;
  face(o.x-0.44,o.x-0.36,t,0.8,'#555');face(o.x+0.36,o.x+0.44,t,0.8,'#555');
  face(o.x-0.44,o.x+0.44,t,0.78,'#e83030',0.38);
  g.fillStyle='#fff';
  for(k=0;k<4;k++)g.fillRect(X(o.x-0.4+k*0.22,t),Y(0.78,t),0.09*LW*t,0.4*LW*t);
  g.globalAlpha=1;
}
function drawCoin(c){
  if(c.z<-2.5)return;
  var t=tOf(c.z),r=0.16*LW*t,sq=Math.abs(Math.cos(Date.now()/150+c.z)),cx=X(c.x,t),cy=Y(0.45,t);
  g.globalAlpha=c.z>70?Math.max(0,(SP-c.z)/25):1;
  g.fillStyle='#ffc400';g.beginPath();g.ellipse(cx,cy,Math.max(1,r*sq),r,0,0,6.3);g.fill();
  g.fillStyle='#fff1a0';g.beginPath();g.ellipse(cx,cy,Math.max(0.5,r*sq*0.5),r*0.55,0,0,6.3);g.fill();
  g.globalAlpha=1;
}
function drawPlayer(){
  var U=LW*T0*0.85,cx=X(S.lx,T0),gy=yG(T0),fy=gy-S.jy*LW*T0;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(cx,gy,U*0.22*(1-Math.min(0.5,S.jy*0.5)),U*0.06,0,0,6.3);g.fill();
  if(S.shake>0&&Math.floor(Date.now()/80)%2)g.globalAlpha=0.45;
  if(S.roll>0){
    g.save();g.translate(cx,fy-U*0.17);g.rotate(S.ph*2);
    g.fillStyle='#e83a2f';g.beginPath();g.arc(0,0,U*0.17,0,6.3);g.fill();
    g.fillStyle='#2a4a8a';g.fillRect(-U*0.17,U*0.02,U*0.34,U*0.1);g.fillStyle='#ffd23f';g.fillRect(-U*0.06,-U*0.2,U*0.12,U*0.07);
    g.restore();
  }else person(cx,fy,U,'#e83a2f','#2a4a8a','#d83030','#ffd23f',S.ph,S.jump,(S.lane-S.lx)*0.15);
  g.globalAlpha=1;
}
function drawCop(){
  if(S.copA<0.03)return;
  var U=LW*T0*0.85*1.15;
  person(X(S.lx,1),H+(1-S.copA)*70+4,U,'#1d3fa8','#12285e','#0c1a44','#1d3fa8',S.ph*1.1+1,false,0);
}
function draw(){
  var i,t,z,c;
  var sk=g.createLinearGradient(0,0,0,HY+10);sk.addColorStop(0,'#2f8cff');sk.addColorStop(1,'#b9e3ff');
  g.fillStyle=sk;g.fillRect(0,0,W,HY+10);
  g.fillStyle='rgba(255,255,255,.9)';
  for(i=0;i<3;i++){var cx=W+40-((i*140+S.z0*1.5)%(W+80)),cy=12+i*14;g.beginPath();g.arc(cx,cy,9,0,6.3);g.fill();g.beginPath();g.arc(cx+10,cy+2,7,0,6.3);g.fill();g.beginPath();g.arc(cx-10,cy+2,7,0,6.3);g.fill()}
  g.fillStyle='#9ba1a9';g.fillRect(0,HY,W,H-HY);
  P([X(-1.6,TM),yG(TM),X(1.6,TM),yG(TM),X(1.6,1.05),yG(1.05),X(-1.6,1.05),yG(1.05)],'#6e6259');
  g.strokeStyle='#f2c200';g.lineWidth=2;
  for(i=-1;i<=1;i+=2){g.beginPath();g.moveTo(X(i*1.75,TM),yG(TM));g.lineTo(X(i*1.75,1.05),yG(1.05));g.stroke()}
  g.strokeStyle='#4a3b2c';
  for(z=-(S.z0%2);z<90;z+=2){t=tOf(z);if(t<TM)continue;g.lineWidth=1+t*3;g.beginPath();g.moveTo(X(-1.55,t),yG(t));g.lineTo(X(1.55,t),yG(t));g.stroke()}
  g.strokeStyle='#d7dde2';g.lineWidth=2;
  for(c=-1;c<=1;c++){for(i=-1;i<=1;i+=2){g.beginPath();g.moveTo(X(c+i*0.28,TM),yG(TM));g.lineTo(X(c+i*0.28,1.05),yG(1.05));g.stroke()}}
  buildings();
  var fg=g.createLinearGradient(0,HY-4,0,HY+36);fg.addColorStop(0,'rgba(200,230,255,1)');fg.addColorStop(1,'rgba(200,230,255,0)');
  g.fillStyle=fg;g.fillRect(0,HY-4,W,40);
  var L=[];
  for(i=0;i<S.obs.length;i++)L.push({k:S.obs[i].z+LEN[S.obs[i].t]/2,o:S.obs[i],y:1});
  for(i=0;i<S.coin.length;i++)L.push({k:S.coin[i].z,o:S.coin[i],y:2});
  L.push({k:0,y:3});L.push({k:-2,y:4});
  L.sort(function(a,b){return b.k-a.k});
  for(i=0;i<L.length;i++){
    var it=L[i];
    if(it.y===1){if(it.o.t==='train')drawTrain(it.o);else if(it.o.t==='barrier')drawBarrier(it.o);else drawLowbar(it.o)}
    else if(it.y===2)drawCoin(it.o);
    else if(it.y===3)drawPlayer();
    else drawCop();
  }
  if(S.copA>0.05){g.strokeStyle='rgba(255,40,40,'+(0.5*S.copA)+')';g.lineWidth=8;g.strokeRect(0,0,W,H)}
}
function hud(){scoreEl.textContent=pad(score(),4);coinsEl.textContent=pad(S.coins,3)}
function tick(now){
  lastTick=Date.now();
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  step(dt);draw();hud();
  raf=requestAnimationFrame(tick);
}
var bs=document.querySelectorAll('.pad button'),b;
for(b=0;b<bs.length;b++)(function(btn){btn.addEventListener('click',function(){act(btn.getAttribute('data-d'))})})(bs[b]);
$('go').addEventListener('click',function(){if(S.dead&&Date.now()-S.deadAt<300)return;if(S.dead||!S.run)begin()});
var tx=0,ty=0;
cv.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(!S.run||S.dead)act('');return}
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');else act(dy>0?'down':'up');
});
document.addEventListener('keydown',function(e){
  var k=e.key,d=k==='ArrowLeft'||k==='a'?'left':k==='ArrowRight'||k==='d'?'right':k==='ArrowUp'||k==='w'||k===' '?'up':k==='ArrowDown'||k==='s'?'down':'';
  if(d){e.preventDefault();act(d)}
});
setInterval(function(){if(Date.now()-lastTick>800){last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}},500);
init();last=performance.now();raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>

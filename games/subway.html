<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subway Surf</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:18px 22px}
.app{display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px 2px}
.title{font-size:13px;font-weight:bold;color:#d4af37;letter-spacing:1px}
.best{background:rgba(212,175,55,0.15);color:#d4af37;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;border:1px solid rgba(212,175,55,0.4)}
.divider{height:1px;background:#d4af37;opacity:0.35;margin-bottom:8px}
.card{background:linear-gradient(180deg,#2a1040 0%,#1a0828 100%);border:2px solid #d4af37;border-radius:12px;padding:8px}
.scorebar{display:flex;justify-content:space-between;font-family:monospace;font-size:10px;color:#d4af37;letter-spacing:1px;padding:2px 4px 6px 4px;text-transform:uppercase}
.playfield{position:relative;border-radius:8px;overflow:hidden}
canvas{display:block;background:#0a0410;border-radius:8px;width:100%;height:auto;touch-action:none}
.dpad{margin-top:10px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:8px;justify-content:center}
.dpad button{background:transparent;border:1px solid #d4af37;border-radius:10px;color:#d4af37;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.dpad button:active{background:rgba(212,175,55,0.25)}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
.dpad .down{grid-column:2;grid-row:3}
.hint{text-align:center;color:#8866aa;font-size:11px;font-weight:bold;margin-top:10px;padding-bottom:2px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="title">🚇 SUBWAY SURF</div><div class="best">🏆 BEST <span id="best">0000</span></div></div>
<div class="divider"></div>
<div class="card">
<div class="scorebar"><span>Dist <span id="dist">0</span></span><span>🪙 <span id="coins">0</span></span><span>Spd <span id="speed">1</span></span></div>
<div class="playfield"><canvas id="c" width="320" height="380"></canvas></div>
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="left" data-dir="left">◀</button>
<button class="right" data-dir="right">▶</button>
<button class="down" data-dir="down">▼</button>
</div>
</div>
<div class="hint">Swipe or tap · escape the police!</div>
</div>
<script>
(function(){
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
var HORIZON=Math.floor(H*0.30);
var GROUND_Y=H-15;
var PLAYER_Y=H-90;
var LANE_W=W/3;

var distEl=document.getElementById('dist');
var coinsEl=document.getElementById('coins');
var speedEl=document.getElementById('speed');
var bestEl=document.getElementById('best');
var best=parseInt(localStorage.getItem('subway_best')||'0',10);
bestEl.textContent=pad(best);
function pad(n){n=String(n);while(n.length<4)n='0'+n;return n;}

var lane,nextLane,laneX;
var jumping,jumpY,jumpV;
var rolling,rollTimer;
var obstacles,coinsArr,buildings;
var dist,coinCount,dead,started;
var spawnTimer,coinTimer,nextSpawnGap;
var copDist,copBob,copDog;
var trackOffset,shake,hitFlash;
var lastTime,raf;

var audioCtx=null,masterGain=null,compressor=null;
function initAudio(){
if(!audioCtx){try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();masterGain.gain.value=0.5;
compressor=audioCtx.createDynamicsCompressor();
compressor.threshold.value=-15;compressor.knee.value=10;compressor.ratio.value=4;
masterGain.connect(compressor);compressor.connect(audioCtx.destination);
}catch(e){audioCtx=null;}}
if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function beep(f1,f2,dur,type,vol,delay){
initAudio();if(!audioCtx)return;
var t=audioCtx.currentTime+(delay||0);
var o=audioCtx.createOscillator();var g=audioCtx.createGain();
o.type=type||'sine';o.frequency.setValueAtTime(f1,t);
if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.006);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,hp){
initAudio();if(!audioCtx)return;
var len=Math.floor(audioCtx.sampleRate*dur);
var buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
var d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
var s=audioCtx.createBufferSource();s.buffer=buf;
var f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
var g=audioCtx.createGain();g.gain.value=vol||0.3;
s.connect(f);f.connect(g);g.connect(masterGain);s.start();
}
function sndJump(){beep(500,900,0.1,'sine',0.2);}
function sndLand(){noise(0.05,0.18,400);}
function sndCoin(){beep(1200,1200,0.06,'sine',0.28);beep(1600,1600,0.1,'sine',0.28,0.06);}
function sndCrash(){noise(0.2,0.4,300);beep(200,80,0.15,'triangle',0.3);}
function sndCaught(){noise(0.2,0.35,500);beep(400,120,0.25,'sawtooth',0.3);}
function sndGameOver(){beep(400,400,0.14,'triangle',0.3,0);beep(300,300,0.14,'triangle',0.3,0.14);beep(200,200,0.28,'triangle',0.3,0.28);}

function reset(){
lane=1;nextLane=1;laneX=1;
jumping=false;jumpY=0;jumpV=0;
rolling=false;rollTimer=0;
obstacles=[];coinsArr=[];
buildings=[];
for(var b=0;b<14;b++){
buildings.push({z:b*0.07,side:(b%2===0)?-1:1,h:50+Math.random()*70,w:0.4+Math.random()*0.3,c:Math.floor(Math.random()*4)});
}
dist=0;coinCount=0;dead=false;started=false;
spawnTimer=0;coinTimer=0;nextSpawnGap=1.6;
copDist=0.92;copBob=0;copDog=0;
trackOffset=0;shake=0;hitFlash=0;
distEl.textContent='0';coinsEl.textContent='0';speedEl.textContent='1';
lastTime=performance.now();
cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}

// Perspective projection
function project(z, laneOffset, worldY){
if(z<0)z=0;if(z>1)z=1;
var persp=1-z;
var scale=0.10+persp*0.90;
var y=HORIZON+(GROUND_Y-HORIZON)*Math.pow(persp,0.75);
y-=(worldY||0)*scale;
var x=W/2+laneOffset*LANE_W*scale*1.15;
return{x:x,y:y,scale:scale,persp:persp};
}

function spawnObstacle(){
var roll=Math.random();
var l=Math.floor(Math.random()*3);
var type;
if(roll<0.55){
// single obstacle
type=Math.random()<0.6?'train':'barrier';
if(Math.random()<0.3)type='lowbar';
obstacles.push({lane:l,z:1,type:type});
}else if(roll<0.80){
// double in two lanes, one is always open
var openLane=Math.floor(Math.random()*3);
var types=['train','barrier','lowbar'];
var t1=types[Math.floor(Math.random()*types.length)];
var t2=types[Math.floor(Math.random()*types.length)];
var leftLane=openLane===0?1:0;
var rightLane=openLane===2?1:2;
obstacles.push({lane:leftLane,z:1,type:t1});
obstacles.push({lane:rightLane,z:1,type:t2});
}else{
// three lanes but one is a lowbar (roll-through)
var rollLane=Math.floor(Math.random()*3);
for(var i=0;i<3;i++){
obstacles.push({lane:i,z:1+(i*0.02),type:i===rollLane?'lowbar':'train'});
}
}
}

function spawnCoins(){
var l=Math.floor(Math.random()*3);
var blocked=false;
for(var k=0;k<obstacles.length;k++){
if(obstacles[k].lane===l&&obstacles[k].z>0.85){blocked=true;break;}
}
if(blocked)l=(l+1)%3;
var n=3+Math.floor(Math.random()*3);
var arc=Math.random()<0.4;
for(var i=0;i<n;i++){
var worldY=arc?Math.sin((i/(n-1))*Math.PI)*30:0;
coinsArr.push({lane:l,z:1+i*0.04,worldY:worldY,taken:false});
}
}

function tick(now){
if(dead)return;
var dt=Math.min(0.05,(now-lastTime)/1000);
lastTime=now;

var speed=started?(1.0+Math.min(1.3,dist/1500)*0.9):0.5;
var advance=speed*dt*1.4;

if(started){
trackOffset=(trackOffset+speed*dt*4)%0.1;
dist+=speed*dt*18;
}

// lane interp
laneX+=(nextLane-laneX)*Math.min(1,dt*16);
if(Math.abs(nextLane-laneX)<0.02)laneX=nextLane;

// jump
if(jumping){jumpV-=10*dt;jumpY+=jumpV*dt;
if(jumpY<=0){jumpY=0;jumping=false;jumpV=0;sndLand();}}
// roll
if(rolling){rollTimer-=dt;if(rollTimer<=0)rolling=false;}
if(hitFlash>0)hitFlash-=dt*3.5;
if(shake>0)shake-=dt*30;

// spawn
spawnTimer+=dt;
if(spawnTimer>=nextSpawnGap){spawnTimer=0;nextSpawnGap=1.1+Math.random()*0.9;if(started)spawnObstacle();}
coinTimer+=dt;
if(coinTimer>1.6){coinTimer=0;if(started)spawnCoins();}

// move obstacles
for(var i=obstacles.length-1;i>=0;i--){
var o=obstacles[i];
o.z-=advance;
if(o.z<-0.15){obstacles.splice(i,1);continue;}
// collision at z near 0 (player position)
if(o.z<0.06&&o.z>-0.08){
var pl=Math.round(laneX);
if(o.lane===pl){
var hit=false;
if(o.type==='train')hit=true;
else if(o.type==='barrier')hit=jumpY<14;
else if(o.type==='lowbar')hit=!rolling;
if(hit){
copDist-=0.13;
sndCrash();
hitFlash=1;shake=8;
dist=Math.max(0,dist-30);
speed=Math.max(0.4,speed-0.2);
if(copDist<=0)return caught();
obstacles.splice(i,1);
}
}
}
}

// coins
for(var j=coinsArr.length-1;j>=0;j--){
var c=coinsArr[j];
c.z-=advance;
if(c.z<-0.1){coinsArr.splice(j,1);continue;}
if(!c.taken&&c.z<0.06&&c.z>-0.06){
var pl2=Math.round(laneX);
var inY=!jumping||jumpY>0;
if(c.lane===pl2&&inY){
c.taken=true;
coinCount++;sndCoin();
coinsEl.textContent=coinCount;
copDist=Math.min(0.92,copDist+0.025);
coinsArr.splice(j,1);
}
}
}

distEl.textContent=Math.floor(dist);
var spdLevel=Math.floor(dist/300)+1;
speedEl.textContent=spdLevel;

// cop natural drift (slowly catches up)
if(started&&speed<0.9)copDist-=0.02*dt;
copBob+=dt*10;
copDog+=dt*12;

// buildings scroll
for(var b=0;b<buildings.length;b++){
buildings[b].z-=advance*0.5;
if(buildings[b].z<-0.2)buildings[b].z+=1;
}

draw();
raf=requestAnimationFrame(tick);
}

function caught(){
dead=true;
cancelAnimationFrame(raf);
var finalScore=Math.floor(dist)+coinCount*5;
if(finalScore>best){best=finalScore;localStorage.setItem('subway_best',best);bestEl.textContent=pad(best);}
sndCaught();
setTimeout(sndGameOver,200);
draw();
}

function drawSky(){
var sky=ctx.createLinearGradient(0,0,0,HORIZON+40);
sky.addColorStop(0,'#3a2a5a');
sky.addColorStop(0.5,'#7a4a7a');
sky.addColorStop(1,'#e8a870');
ctx.fillStyle=sky;
ctx.fillRect(0,0,W,HORIZON+40);
// distant city silhouette
ctx.fillStyle='rgba(20,10,30,0.8)';
for(var i=0;i<20;i++){
var bx=(i*17)%W;
var bh=6+((i*13)%14);
ctx.fillRect(bx,HORIZON-bh,10,bh);
}
}

function drawBuilding(b){
var side=b.side;
var off=side*(1.6+b.w);
var p=project(b.z,off,0);
if(p.persp<0.05)return;
var scale=p.scale;
var w=b.w*LANE_W*scale*1.4;
var h=b.h*scale;
var x=p.x-(side<0?w*0.5:w*0.5);
var yTop=p.y-h;
var colors=['#2a1a4a','#3a2040','#2a2545','#302040'];
ctx.fillStyle=colors[b.c];
ctx.fillRect(x,yTop,w,h);
// windows
ctx.fillStyle='rgba(255,220,120,0.6)';
var cols=Math.max(2,Math.floor(w/7));
var rows=Math.max(2,Math.floor(h/9));
for(var wy=0;wy<rows;wy++){
for(var wx=0;wx<cols;wx++){
if((wx+wy+b.c)%3===0){
ctx.fillRect(x+wx*(w/cols)+2,yTop+wy*(h/rows)+2,2.5*scale,3*scale);
}
}
}
}

function drawGround(){
var g=ctx.createLinearGradient(0,HORIZON,0,GROUND_Y);
g.addColorStop(0,'#3a3020');
g.addColorStop(0.4,'#3a3a3a');
g.addColorStop(1,'#1a1a1a');
ctx.fillStyle=g;
ctx.fillRect(0,HORIZON,W,H-HORIZON);
}

function drawTrack(laneOffset){
var halfW=0.40;
var bedL=project(0.02,laneOffset-halfW,0);
var bedR=project(0.02,laneOffset+halfW,0);
var bedLf=project(0.98,laneOffset-halfW,0);
var bedRf=project(0.98,laneOffset+halfW,0);
// rail bed
ctx.fillStyle='#4a3a28';
ctx.beginPath();
ctx.moveTo(bedLf.x,bedLf.y);
ctx.lineTo(bedRf.x,bedRf.y);
ctx.lineTo(bedR.x,bedR.y);
ctx.lineTo(bedL.x,bedL.y);
ctx.closePath();
ctx.fill();
// sleepers
for(var z=-trackOffset;z<1;z+=0.06){
var zz=z<0?z+1:z;
if(zz<0.02)continue;
var a=project(zz,laneOffset-halfW,0);
var b=project(zz,laneOffset+halfW,0);
ctx.strokeStyle='rgba(60,40,20,'+(0.4+(1-zz)*0.5)+')';
ctx.lineWidth=Math.max(0.5,1+(1-zz)*2.8);
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
// rails
var railOff=halfW-0.06;
var rl1=project(0.02,laneOffset-railOff,0);
var rl2=project(0.98,laneOffset-railOff,0);
var rr1=project(0.02,laneOffset+railOff,0);
var rr2=project(0.98,laneOffset+railOff,0);
ctx.strokeStyle='rgba(220,220,200,0.9)';
ctx.lineWidth=1.8;
ctx.beginPath();ctx.moveTo(rl2.x,rl2.y);ctx.lineTo(rl1.x,rl1.y);ctx.stroke();
ctx.beginPath();ctx.moveTo(rr2.x,rr2.y);ctx.lineTo(rr1.x,rr1.y);ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,0.5)';
ctx.lineWidth=0.7;
ctx.beginPath();ctx.moveTo(rl2.x,rl2.y);ctx.lineTo(rl1.x,rl1.y);ctx.stroke();
ctx.beginPath();ctx.moveTo(rr2.x,rr2.y);ctx.lineTo(rr1.x,rr1.y);ctx.stroke();
}

function drawObstacle(o){
if(o.z<0||o.z>1.05)return;
var p=project(o.z,o.lane-1,0);
if(p.persp<0.04)return;
var trackW=LANE_W*p.scale*1.15*0.78;

if(o.type==='train'){
var th=70*p.scale;
var x=p.x-trackW/2;
var yTop=p.y-th;
// body
ctx.fillStyle='#8a2a2a';
ctx.fillRect(x,yTop,trackW,th);
// top lighter strip
ctx.fillStyle='#a83a3a';
ctx.fillRect(x,yTop,trackW,5*p.scale);
// bottom dark
ctx.fillStyle='#5a1a1a';
ctx.fillRect(x,yTop+th-4*p.scale,trackW,4*p.scale);
// windows
ctx.fillStyle='#4a8ab8';
var winY=yTop+th*0.18;
var winH=th*0.22;
ctx.fillRect(x+trackW*0.12,winY,trackW*0.28,winH);
ctx.fillRect(x+trackW*0.6,winY,trackW*0.28,winH);
ctx.fillStyle='rgba(180,220,255,0.5)';
ctx.fillRect(x+trackW*0.12,winY,trackW*0.28,2*p.scale);
ctx.fillRect(x+trackW*0.6,winY,trackW*0.28,2*p.scale);
// yellow stripe
ctx.fillStyle='#ffdd44';
ctx.fillRect(x+trackW*0.1,yTop+th*0.55,trackW*0.8,3*p.scale);
// front face darker
ctx.fillStyle='rgba(0,0,0,0.2)';
ctx.fillRect(x,yTop+th*0.7,trackW,th*0.3);
}
else if(o.type==='barrier'){
var bh=28*p.scale;
var bw=trackW*0.94;
var x=p.x-bw/2;
var yTop=p.y-bh;
ctx.fillStyle='#d88020';
ctx.fillRect(x,yTop,bw,bh);
ctx.fillStyle='#ffaa44';
ctx.fillRect(x,yTop,bw,3*p.scale);
ctx.fillStyle='#3a2a1a';
for(var s=0;s<4;s++){
ctx.fillRect(x+bw*(0.08+s*0.23),yTop+5*p.scale,bw*0.1,bh-10*p.scale);
}
// legs
ctx.fillStyle='#6a4a2a';
ctx.fillRect(x,yTop+bh-2*p.scale,3*p.scale,3*p.scale);
ctx.fillRect(x+bw-3*p.scale,yTop+bh-2*p.scale,3*p.scale,3*p.scale);
}
else if(o.type==='lowbar'){
var bh=12*p.scale;
var bw=trackW*0.94;
var x=p.x-bw/2;
var yTop=p.y-40*p.scale;
// vertical poles
ctx.fillStyle='#3a2a1a';
ctx.fillRect(x,yTop,3*p.scale,p.y-yTop);
ctx.fillRect(x+bw-3*p.scale,yTop,3*p.scale,p.y-yTop);
// horizontal bar
ctx.fillStyle='#aa2a2a';
ctx.fillRect(x,yTop,bw,bh);
ctx.fillStyle='#ff5555';
ctx.fillRect(x,yTop,bw,2*p.scale);
ctx.fillStyle='#5a0a0a';
ctx.fillRect(x,yTop+bh-2*p.scale,bw,2*p.scale);
}
}

function drawCoin(c){
if(c.z<0||c.z>1)return;
var p=project(c.z,c.lane-1,c.worldY||14);
if(p.persp<0.04)return;
var r=7*p.scale;
var spin=Math.abs(Math.sin(Date.now()/120+c.z*10));
ctx.fillStyle='#ffd700';
ctx.beginPath();
ctx.ellipse(p.x,p.y,r*spin+r*0.2,r,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#ffaa00';
ctx.beginPath();
ctx.ellipse(p.x,p.y,r*spin*0.5,r*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.7)';
ctx.beginPath();
ctx.arc(p.x-r*0.3,p.y-r*0.3,r*0.18,0,Math.PI*2);
ctx.fill();
}

function drawPerson(x,y,scale,shirt,pants,skin,hair,opts){
opts=opts||{};
var bodyH=34*scale;
var headR=8*scale;
var yTop=y-bodyH;

// shadow
ctx.fillStyle='rgba(0,0,0,0.4)';
ctx.beginPath();
ctx.ellipse(x,y+3,12*scale,3*scale,0,0,Math.PI*2);
ctx.fill();

if(opts.rolling||rolling&&opts.isPlayer){
ctx.fillStyle=shirt;
ctx.beginPath();
ctx.ellipse(x,y-10*scale,14*scale,10*scale,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle=skin;
ctx.beginPath();
ctx.arc(x+10*scale,y-12*scale,5*scale,0,Math.PI*2);
ctx.fill();
return;
}

var legPhase=opts.legPhase||0;
// legs
ctx.fillStyle=pants;
if(jumping&&opts.isPlayer){
ctx.fillRect(x-7*scale,y-8*scale,5*scale,8*scale);
ctx.fillRect(x+2*scale,y-11*scale,5*scale,11*scale);
}else{
ctx.fillRect(x-6*scale,y-8*scale,5*scale,8*scale+legPhase);
ctx.fillRect(x+1*scale,y-8*scale,5*scale,8*scale-legPhase);
}
// shoes
ctx.fillStyle='#1a1a1a';
ctx.fillRect(x-7*scale,y-3*scale+legPhase,6*scale,3*scale);
ctx.fillRect(x+1*scale,y-3*scale-legPhase,6*scale,3*scale);

// torso
ctx.fillStyle=shirt;
ctx.fillRect(x-8*scale,yTop,16*scale,bodyH);
// backpack straps (back view)
ctx.fillStyle='#1a1a1a';
ctx.fillRect(x-5*scale,yTop+2*scale,2.5*scale,bodyH-6*scale);
ctx.fillRect(x+3*scale,yTop+2*scale,2.5*scale,bodyH-6*scale);
// hood detail
ctx.fillStyle='rgba(0,0,0,0.2)';
ctx.fillRect(x-4*scale,yTop,8*scale,4*scale);

// arms
ctx.fillStyle=shirt;
var armPhase=opts.armPhase||0;
ctx.fillRect(x-12*scale,yTop+4*scale+armPhase,4.5*scale,12*scale);
ctx.fillRect(x+7*scale,yTop+4*scale-armPhase,4.5*scale,12*scale);

// head
ctx.fillStyle=skin;
ctx.beginPath();
ctx.arc(x,yTop-headR+1,headR,0,Math.PI*2);
ctx.fill();
// hair (top + back)
ctx.fillStyle=hair;
ctx.beginPath();
ctx.arc(x,yTop-headR+1,headR,Math.PI,Math.PI*2);
ctx.fill();
ctx.fillRect(x-headR,yTop-headR+1,headR*2,3.5*scale);
// ear hints
ctx.fillStyle=skin;
ctx.beginPath();
ctx.arc(x-headR,yTop-headR+4,2*scale,0,Math.PI*2);
ctx.arc(x+headR,yTop-headR+4,2*scale,0,Math.PI*2);
ctx.fill();

// badge/numeral on shirt back (for cop)
if(opts.badge){
ctx.fillStyle='#ffdd44';
ctx.fillRect(x-2*scale,yTop+bodyH*0.5,4*scale,4*scale);
}
}

function drawPlayer(){
var p=project(0,laneX-1,0);
var y=PLAYER_Y-jumpY*35;
var legPhase=Math.sin(Date.now()/70)*4;
var armPhase=Math.sin(Date.now()/70)*2;
drawPerson(p.x,y,1.0,'#d84040','#2a3a5a','#e8c8a0','#2a1a1a',{isPlayer:true,legPhase:legPhase,armPhase:armPhase});
}

function drawCop(){
if(copDist>0.55)return;
var closeness=1-copDist/0.55;
var scale=0.75+closeness*0.55;
var y=H+10-(copDist*40);
if(y>GROUND_Y+20)y=GROUND_Y+20;
var x=W/2+(copLane-1)*LANE_W*0.35;

var bob=Math.sin(copBob)*2;

// siren glow above
var flash=Math.floor(Date.now()/180)%2===0;
var gl=ctx.createRadialGradient(x,y-55*scale,3,x,y-55*scale,28*scale);
gl.addColorStop(0,flash?'rgba(255,70,70,0.75)':'rgba(70,70,255,0.75)');
gl.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=gl;
ctx.beginPath();
ctx.arc(x,y-55*scale,28*scale,0,Math.PI*2);
ctx.fill();

// cop body (blue)
drawPerson(x,y,scale,'#1a2a5a','#0a1a2a','#e8c8a0','#1a0a0a',{badge:true,legPhase:Math.sin(copBob)*3,armPhase:Math.sin(copBob+1)*2});

// cop hat (drawn over head)
var headR=8*scale;
var yTop=y-34*scale;
ctx.fillStyle='#0a1a3a';
ctx.fillRect(x-headR-1*scale,yTop-headR+1,headR*2+2*scale,4*scale);
ctx.fillRect(x-headR*0.7+1*scale,yTop-headR-2*scale,headR*1.4,3*scale);
ctx.fillStyle='#ffdd44';
ctx.fillRect(x-2*scale,yTop-headR+2,4*scale,2*scale);

// dog running alongside
var dogX=x+28*scale;
var dogY=y+4*scale;
var dogBob=Math.sin(copDog)*1.5;
ctx.fillStyle='rgba(0,0,0,0.4)';
ctx.beginPath();
ctx.ellipse(dogX,dogY+2,10*scale,2*scale,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#3a2a1a';
ctx.fillRect(dogX-8*scale,dogY-10*scale+dogBob,16*scale,10*scale);
ctx.fillRect(dogX-9*scale,dogY-6*scale+dogBob,4*scale,5*scale);
ctx.fillRect(dogX+5*scale,dogY-6*scale+dogBob,4*scale,5*scale);
// dog head
ctx.fillStyle='#3a2a1a';
ctx.beginPath();
ctx.arc(dogX+7*scale,dogY-12*scale+dogBob,5*scale,0,Math.PI*2);
ctx.fill();
// dog ears
ctx.fillRect(dogX+3*scale,dogY-18*scale+dogBob,4*scale,5*scale);
ctx.fillRect(dogX+8*scale,dogY-18*scale+dogBob,4*scale,5*scale);

// red vignette when close
if(copDist<0.20){
ctx.fillStyle='rgba(255,0,0,'+(0.20-copDist)*4+')';
ctx.fillRect(0,0,W,H);
}
}

function draw(){
ctx.save();
if(shake>0){
ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
}

drawSky();

// buildings behind horizon
for(var b=0;b<buildings.length;b++){if(buildings[b].z>0.9||buildings[b].z<0.02)continue;drawBuilding(buildings[b]);}

drawGround();

// draw 3 tracks far-to-near, so overlaps look right
drawTrack(-1);
drawTrack(0);
drawTrack(1);

// sort renderables
var r=[];
for(var i=0;i<obstacles.length;i++)r.push({z:obstacles[i].z,k:'o',d:obstacles[i]});
for(var i=0;i<coinsArr.length;i++)r.push({z:coinsArr[i].z,k:'c',d:coinsArr[i]});
r.push({z:0,k:'p'});
r.push({z:-copDist*0.55,k:'cp'});
r.sort(function(a,b){return b.z-a.z;});
for(var i=0;i<r.length;i++){
var it=r[i];
if(it.k==='o')drawObstacle(it.d);
else if(it.k==='c')drawCoin(it.d);
else if(it.k==='cp')drawCop();
else drawPlayer();
}

if(hitFlash>0){
ctx.fillStyle='rgba(255,60,60,'+hitFlash*0.4+')';
ctx.fillRect(0,0,W,H);
}

if(!started&&!dead){
ctx.fillStyle='rgba(0,0,0,0.6)';
ctx.fillRect(0,H*0.42,W,70);
ctx.fillStyle='#d4af37';
ctx.font='bold 20px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('TAP TO RUN',W/2,H*0.42+24);
ctx.fillStyle='#fff';ctx.font='bold 11px Arial';
ctx.fillText('swipe to dodge · escape the police',W/2,H*0.42+46);
}

if(dead){
ctx.fillStyle='rgba(0,0,0,0.78)';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ff4444';ctx.font='bold 30px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('CAUGHT!',W/2,H/2-40);
ctx.fillStyle='#d4af37';ctx.font='bold 16px Arial';
ctx.fillText('Distance '+Math.floor(dist)+'m',W/2,H/2-4);
ctx.fillText('Coins '+coinCount+'  (+'+(coinCount*5)+')',W/2,H/2+20);
ctx.fillStyle='#ffffff';ctx.font='bold 12px Arial';
ctx.fillText('Tap to play again',W/2,H/2+56);
}
ctx.restore();
}

function act(dir){
if(dead){reset();return;}
if(!started)started=true;
if(dir==='up'){if(!jumping&&!rolling){jumping=true;jumpV=6.2;jumpY=0.1;sndJump();}}
else if(dir==='down'){if(!jumping&&!rolling){rolling=true;rollTimer=0.6;}}
else if(dir==='left'){if(nextLane>0){nextLane--;copLane=Math.max(0,copLane-(Math.random()<0.5?1:0));}}
else if(dir==='right'){if(nextLane<2){nextLane++;copLane=Math.min(2,copLane+(Math.random()<0.5?1:0));}}
}

var btns=document.querySelectorAll('.dpad button');
for(var b=0;b<btns.length;b++){(function(x){x.addEventListener('click',function(){act(x.dataset.dir);});})(btns[b]);}

var ts=null;
cv.addEventListener('touchstart',function(e){e.preventDefault();ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:false});
cv.addEventListener('touchend',function(e){
e.preventDefault();
if(dead){reset();return;}
if(!ts)return;
var dx=e.changedTouches[0].clientX-ts.x;
var dy=e.changedTouches[0].clientY-ts.y;
if(Math.abs(dx)<20&&Math.abs(dy)<20){if(!started)started=true;ts=null;return;}
if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');
else act(dy>0?'down':'up');
ts=null;
},{passive:false});
cv.addEventListener('click',function(){if(dead){reset();}else if(!started){started=true;}});
document.addEventListener('keydown',function(e){
if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();act('up');}
else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();act('down');}
else if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();act('left');}
else if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();act('right');}
});

reset();
})();
</script>
</body>
</html>

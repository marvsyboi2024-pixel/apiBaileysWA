<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fishing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .gameover { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .gameover h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .gameover p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .gameover .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .gameover button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
  .jump { display: flex; justify-content: center; margin-top: 12px; width: 100%; }
  .jump button { background: rgba(90,100,60,0.15); border: 1px solid #7a8a5a; border-radius: 12px; color: #3a4a1a; font-size: 15px; font-weight: bold; letter-spacing: 3px; padding: 0; height: 52px; width: 100%; cursor: pointer; font-family: inherit; }
  .jump button:active { background: rgba(90,100,60,0.35); color: #1a2a0a; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 8px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🎣 Fishing</div>
    <div class="best">🏆 BEST <span id="best">0000</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Coins <span id="score">0000</span></span>
      <span>Time <span id="time">60</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="200"></canvas>
      <div class="gameover" id="overlay">
        <h2>Time Up</h2>
        <p id="overlayMsg">You caught 0 fish, coins: 0000.</p>
        <div class="sect"><button id="restart">Play Again</button></div>
      </div>
    </div>
  </div>
  <div class="jump">
    <button id="castBtn">CAST</button>
  </div>
  <div class="hint">Tap CAST to lower the hook, tap again to reel!</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var WATER_Y = 55;
  var DURATION = 60;

  var FISH = [
    { c: '#3a7a3a', r: 6, v: 4, name: 'Small' },
    { c: '#7a8a3a', r: 8, v: 8, name: 'Medium' },
    { c: '#a86a3a', r: 10, v: 15, name: 'Big' },
    { c: '#aa2a3a', r: 12, v: 30, name: 'Rare' }
  ];

  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayMsg = document.getElementById('overlayMsg');

  var fishes, coins, caught, timeLeft, hookY, hookState, dead, lastTime, raf, spawnTimer;

  var best = parseInt(localStorage.getItem('fish_best') || '0', 10);
  bestEl.textContent = pad(best);

  function pad(n){ n = String(n); while (n.length < 4) n = '0' + n; return n; }

  function reset() {
    fishes = [];
    coins = 0;
    caught = 0;
    timeLeft = DURATION;
    hookY = WATER_Y;
    hookState = 'idle';
    dead = false;
    spawnTimer = 0;
    scoreEl.textContent = pad(0);
    timeEl.textContent = '60';
    overlay.style.display = 'none';
    lastTime = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function spawnFish() {
    var t = FISH[Math.floor(Math.random() * FISH.length)];
    var fromLeft = Math.random() > 0.5;
    fishes.push({
      t: t,
      x: fromLeft ? -20 : W + 20,
      y: WATER_Y + 20 + Math.random() * (H - WATER_Y - 40),
      vx: (fromLeft ? t.v : -t.v),
      wobble: Math.random() * Math.PI * 2
    });
  }

  function tick(now) {
    if (dead) return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; return die(); }
    timeEl.textContent = Math.ceil(timeLeft);

    spawnTimer += dt;
    if (spawnTimer > 0.8) {
      spawnTimer = 0;
      if (fishes.length < 8) spawnFish();
    }

    if (hookState === 'down') {
      hookY += 90 * dt;
      if (hookY >= H - 20) { hookY = H - 20; hookState = 'up'; }
    } else if (hookState === 'up') {
      hookY -= 130 * dt;
      if (hookY <= WATER_Y) { hookY = WATER_Y; hookState = 'idle'; }
    }

    for (var i = fishes.length - 1; i >= 0; i--) {
      var f = fishes[i];
      f.x += f.vx * dt;
      f.wobble += dt * 6;
      if (f.x < -40 || f.x > W + 40) fishes.splice(i, 1);
    }

    if (hookState !== 'idle') {
      for (var j = fishes.length - 1; j >= 0; j--) {
        var ff = fishes[j];
        var dx = ff.x - W / 2;
        var dy = ff.y - hookY;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < ff.t.r + 10) {
          coins += ff.t.v;
          caught++;
          scoreEl.textContent = pad(coins);
          if (hookState === 'up' || hookState === 'down') hookState = 'up';
          fishes.splice(j, 1);
          break;
        }
      }
    }

    draw();
    raf = requestAnimationFrame(tick);
  }

  function die() {
    dead = true;
    cancelAnimationFrame(raf);
    if (coins > best) {
      best = coins;
      localStorage.setItem('fish_best', best);
      bestEl.textContent = pad(best);
    }
    overlayMsg.textContent = 'You caught ' + caught + ' fish, coins: ' + pad(coins) + '.';
    overlay.style.display = 'block';
  }

  function draw() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#c4cd9d');
    grad.addColorStop(0.28, '#c4cd9d');
    grad.addColorStop(0.28, '#7a9a7a');
    grad.addColorStop(1, '#3a5a3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#1e3a1a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, WATER_Y);
    ctx.lineTo(W, WATER_Y);
    ctx.stroke();

    for (var i = 0; i < fishes.length; i++) {
      var f = fishes[i];
      var wobble = Math.sin(f.wobble) * 2;
      ctx.fillStyle = f.t.c;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + wobble, f.t.r, f.t.r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e3a1a';
      ctx.beginPath();
      ctx.arc(f.x + (f.vx > 0 ? f.t.r * 0.4 : -f.t.r * 0.4), f.y + wobble - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = f.t.c;
      var tailDir = f.vx > 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(f.x + tailDir * f.t.r * 0.9, f.y + wobble);
      ctx.lineTo(f.x + tailDir * (f.t.r * 1.5), f.y + wobble - 4);
      ctx.lineTo(f.x + tailDir * (f.t.r * 1.5), f.y + wobble + 4);
      ctx.fill();
    }

    ctx.strokeStyle = '#3a4a2a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, WATER_Y);
    ctx.lineTo(W / 2, hookY);
    ctx.stroke();

    ctx.fillStyle = '#aa2a3a';
    ctx.beginPath();
    ctx.arc(W / 2, hookY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(W / 2, hookY, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function cast() {
    if (dead) { reset(); return; }
    if (hookState === 'idle') hookState = 'down';
    else if (hookState === 'down') hookState = 'up';
  }

  document.getElementById('castBtn').addEventListener('click', cast);
  cv.addEventListener('click', cast);
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); cast(); }, { passive: false });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); cast(); }
  });
  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

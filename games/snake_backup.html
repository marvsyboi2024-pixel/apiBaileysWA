<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0000; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  h1 { color: #ff2222; font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; font-weight: bold; }
  #scorebar { display: flex; gap: 24px; margin-bottom: 12px; font-size: 14px; color: #ff6666; letter-spacing: 1px; }
  #scorebar span b { color: #fff; }
  #wrap { position: relative; }
  canvas { background: #150000; border: 2px solid #440000; border-radius: 10px; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(10,0,0,0.88); border-radius: 10px; text-align: center; padding: 20px; }
  #overlay.show { display: flex; }
  #overlay h2 { color: #ff2222; font-size: 22px; margin-bottom: 8px; letter-spacing: 3px; }
  #overlay p { color: #ccc; font-size: 14px; margin-bottom: 16px; }
  #overlay button { padding: 10px 24px; background: #aa0000; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
  #overlay button:active { background: #dd0000; }
  #dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 6px; margin-top: 14px; }
  #dpad button { background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 22px; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
  #dpad button:active { background: #440000; color: #fff; }
  #dpad .blank { visibility: hidden; }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
</style>
<meta property="og:title" content="Snake — SUKUNA REALM">
<meta property="og:description" content="Classic snake game. Dodge walls, eat dots, grow longer.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUKUNA REALM">
<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://marvsyboi2024-pixel.github.io/apiBaileysWA/games/preview.jpg">
</head>
<body>
<h1>SUKUNA SNAKE</h1>
<div id="scorebar">
  <span>SCORE <b id="score">0</b></span>
  <span>BEST <b id="best">0</b></span>
</div>
<div id="wrap">
  <canvas id="c" width="320" height="320"></canvas>
  <div id="overlay">
    <h2 id="ovtitle">GAME OVER</h2>
    <p id="ovtext">Score: 0</p>
    <button id="restart">RESTART</button>
  </div>
</div>
<div id="dpad">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const CELL = 16;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovtitle');
  const ovText = document.getElementById('ovtext');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, score, best, dead, timer, speed;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 8, y: 8}, {x: 7, y: 8}, {x: 6, y: 8}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 150;
    dead = false;
    placeFood();
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    clearInterval(timer);
    timer = setInterval(tick, speed);
    draw();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60) {
        speed -= 4;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function die() {
    dead = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'GAME OVER';
    ovText.textContent = 'Score: ' + score;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#150000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1f0000';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
    ctx.fill();
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      ctx.fillStyle = i === 0 ? '#ff2222' : (i % 2 === 0 ? '#cc0000' : '#991111');
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  function setDir(d) {
    const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    const n = map[d];
    if (!n) return;
    if (n.x === -dir.x && n.y === -dir.y) return;
    nextDir = n;
  }

  document.querySelectorAll('#dpad button').forEach(b => {
    b.addEventListener('click', () => setDir(b.dataset.dir));
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w') setDir('up');
    else if (k === 'ArrowDown' || k === 's') setDir('down');
    else if (k === 'ArrowLeft' || k === 'a') setDir('left');
    else if (k === 'ArrowRight' || k === 'd') setDir('right');
  });

  restartBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

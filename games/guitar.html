<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guitar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:18px 22px}
.app{display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px 2px}
.title{font-size:13px;font-weight:bold;color:#d4af37;letter-spacing:1px}
.best{background:rgba(212,175,55,0.15);color:#d4af37;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;border:1px solid rgba(212,175,55,0.4)}
.divider{height:1px;background:#d4af37;opacity:0.35;margin-bottom:8px}
.card{background:linear-gradient(180deg,#2a1040 0%,#1a0828 100%);border:2px solid #d4af37;border-radius:12px;padding:8px}
.scorebar{display:flex;justify-content:space-between;font-family:monospace;font-size:11px;color:#d4af37;letter-spacing:1.5px;padding:2px 4px 6px 4px;text-transform:uppercase}
.playfield{position:relative;border-radius:6px;overflow:hidden}
canvas{display:block;background:transparent;border-radius:6px;width:100%;height:auto;touch-action:none}
.volctl{margin-top:8px;padding:8px 10px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.3);border-radius:8px}
.volctl .row{display:flex;align-items:center;gap:10px}
.volctl .lbl{color:#d4af37;font-family:monospace;font-size:11px;font-weight:bold;letter-spacing:1px;min-width:40px}
.volctl .pct{color:#ffdd44;font-family:monospace;font-size:13px;font-weight:bold;letter-spacing:1px;min-width:44px;text-align:right}
.volctl input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;background:linear-gradient(90deg,#ffdd44 0%,#ffdd44 var(--pct,60%),#3a2050 var(--pct,60%),#3a2050 100%);border-radius:4px;outline:none;cursor:pointer}
.volctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffdd44,#a87810);border:2px solid #d4af37;box-shadow:0 2px 6px rgba(0,0,0,0.5);cursor:grab}
.volctl input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
.hint{text-align:center;color:#8866aa;font-size:11px;font-weight:bold;margin-top:10px;padding-bottom:2px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="title">🎸 GUITAR</div><div class="best">🎵 <span id="lastNote">—</span></div></div>
<div class="divider"></div>
<div class="card">
<div class="scorebar"><span>Strings <span id="count">0</span></span><span>Chord <span id="chordLabel">—</span></span></div>
<div class="playfield"><canvas id="c" width="336" height="240"></canvas></div>
<div class="volctl">
<div class="row">
<span class="lbl">VOL</span>
<input type="range" id="volSlider" min="0" max="100" value="60" step="1">
<span class="pct" id="volPct">60%</span>
</div>
</div>
</div>
<div class="hint">Tap a chord, or strum strings · drag across for runs</div>
</div>
<script>
(function(){
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;

var OPEN_STRINGS=['E2','A2','D3','G3','B3','E4'];
var STRING_LABELS=['E','A','D','G','B','E'];
var NUM_STRINGS=6;
var CHORD_H=68;
var STRING_TOP=CHORD_H+10;
var STRING_AREA_H=H-STRING_TOP-8;
var STRING_GAP=STRING_AREA_H/(NUM_STRINGS+1);

var CHORDS=[
{name:'Am',notes:['A2','E3','A3','C4','E4']},
{name:'C',notes:['C3','E3','G3','C4','E4']},
{name:'G',notes:['G2','B2','D3','G3','B3']},
{name:'Em',notes:['E2','B2','E3','G3','B3']}
];

var FREQ={
'E2':82.41,'F2':87.31,'G2':98.00,'A2':110.00,'B2':123.47,
'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'B3':246.94,
'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'F#4':369.99,'G4':392.00,
'A4':440.00,'C#4':277.18
};

var countEl=document.getElementById('count');
var lastNoteEl=document.getElementById('lastNote');
var chordLabelEl=document.getElementById('chordLabel');
var volSlider=document.getElementById('volSlider');
var volPct=document.getElementById('volPct');

var audioCtx=null,masterGain=null,compressor=null;
var volumeLevel=60;
var noteCount=0;
var activeStrings={};
var activeChord=-1;
var chordTimer=null;

function initAudio(){
if(!audioCtx){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();
masterGain.gain.value=volumeLevel/100;
compressor=audioCtx.createDynamicsCompressor();
compressor.threshold.value=-12;
compressor.knee.value=8;
compressor.ratio.value=4;
compressor.attack.value=0.003;
compressor.release.value=0.25;
masterGain.connect(compressor);
compressor.connect(audioCtx.destination);
}catch(e){audioCtx=null;}
}
if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}

function pluck(note,delay){
initAudio();
if(!audioCtx)return;
var f=FREQ[note];
if(!f)return;
var t=audioCtx.currentTime+(delay||0);
var dur=2.2;

var voiceGain=audioCtx.createGain();
voiceGain.gain.setValueAtTime(0.0001,t);
voiceGain.gain.exponentialRampToValueAtTime(0.6,t+0.005);
voiceGain.gain.exponentialRampToValueAtTime(0.35,t+0.08);
voiceGain.gain.exponentialRampToValueAtTime(0.12,t+0.6);
voiceGain.gain.exponentialRampToValueAtTime(0.0001,t+dur);

var filter=audioCtx.createBiquadFilter();
filter.type='lowpass';
filter.frequency.setValueAtTime(Math.min(5000,f*7),t);
filter.frequency.exponentialRampToValueAtTime(Math.max(500,f*2),t+dur*0.8);
filter.Q.value=0.7;
filter.connect(voiceGain);
voiceGain.connect(masterGain);

var partials=[
{freq:f,type:'triangle',level:0.5},
{freq:f*2,type:'sawtooth',level:0.22},
{freq:f*3,type:'sine',level:0.10}
];

partials.forEach(function(p){
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type=p.type;
osc.frequency.value=p.freq;
g.gain.value=p.level;
osc.connect(g);
g.connect(filter);
osc.start(t);
osc.stop(t+dur+0.05);
});

// Noise burst for the pluck attack
var noiseDur=0.04;
var noiseBuf=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*noiseDur),audioCtx.sampleRate);
var noiseData=noiseBuf.getChannelData(0);
for(var i=0;i<noiseData.length;i++)noiseData[i]=(Math.random()*2-1)*(1-i/noiseData.length);
var noiseSrc=audioCtx.createBufferSource();
noiseSrc.buffer=noiseBuf;
var noiseGain=audioCtx.createGain();
noiseGain.gain.value=0.18;
noiseSrc.connect(noiseGain);
noiseGain.connect(filter);
noiseSrc.start(t);
}

function playChord(idx){
var c=CHORDS[idx];
for(var i=0;i<c.notes.length;i++)pluck(c.notes[i],i*0.04);
noteCount+=c.notes.length;
countEl.textContent=noteCount;
lastNoteEl.textContent=c.name;
chordLabelEl.textContent=c.name;
}

function draw(){
ctx.fillStyle='#0a0410';
ctx.fillRect(0,0,W,H);

// chords row
var cw=(W-24)/CHORDS.length;
for(var i=0;i<CHORDS.length;i++){
var x=12+i*cw,y=8,inset=3;
var bx=x+inset,by=y+inset,bw=cw-inset*2,bh=CHORD_H-18;
var isActive=(activeChord===i);
ctx.fillStyle=isActive?'#d4af37':'#2a1040';
roundRect(bx,by,bw,bh,8);
ctx.fill();
ctx.strokeStyle='#d4af37';
ctx.lineWidth=2;
roundRect(bx,by,bw,bh,8);
ctx.stroke();
ctx.fillStyle=isActive?'#0a0410':'#ffdd44';
ctx.font='bold 18px Arial';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(CHORDS[i].name,bx+bw/2,by+bh/2);
}

// strum bar
var strumY=CHORD_H+2;
ctx.fillStyle='#3a2050';
roundRect(12,strumY,W-24,16,6);
ctx.fill();
ctx.strokeStyle='#d4af37';
ctx.lineWidth=1;
roundRect(12,strumY,W-24,16,6);
ctx.stroke();
ctx.fillStyle='#ffdd44';
ctx.font='bold 10px Arial';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('⚡ STRUM ALL',W/2,strumY+8);

// strings
for(var j=0;j<NUM_STRINGS;j++){
var sy=STRING_TOP+(j+1)*STRING_GAP;
var isHit=activeStrings[j];
if(isHit){ctx.shadowColor='#ffdd44';ctx.shadowBlur=12;}
ctx.strokeStyle=isHit?'#ffdd44':'#a08830';
ctx.lineWidth=isHit?3:2;
ctx.beginPath();
ctx.moveTo(24,sy);
ctx.lineTo(W-24,sy);
ctx.stroke();
ctx.shadowBlur=0;
ctx.fillStyle='#d4af37';
ctx.font='bold 12px Arial';
ctx.textAlign='left';
ctx.textBaseline='middle';
ctx.fillText(STRING_LABELS[j],6,sy);
}
}

function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function getPos(t){
var rect=cv.getBoundingClientRect();
var sx=cv.width/rect.width,sy=cv.height/rect.height;
return{x:(t.clientX-rect.left)*sx,y:(t.clientY-rect.top)*sy};
}

function hitTest(x,y){
if(y>=8&&y<=CHORD_H-10){
var cw=(W-24)/CHORDS.length;
var idx=Math.floor((x-12)/cw);
if(idx>=0&&idx<CHORDS.length)return{kind:'chord',idx:idx};
}
if(y>=CHORD_H+2&&y<=CHORD_H+18)return{kind:'strum'};
var best=-1,bestDist=16;
for(var j=0;j<NUM_STRINGS;j++){
var sy=STRING_TOP+(j+1)*STRING_GAP;
var d=Math.abs(y-sy);
if(d<bestDist){bestDist=d;best=j;}
}
if(best>=0)return{kind:'string',idx:best};
return null;
}

function trigger(hit){
if(!hit)return;
if(hit.kind==='chord'){
playChord(hit.idx);
activeChord=hit.idx;
clearTimeout(chordTimer);
chordTimer=setTimeout(function(){activeChord=-1;draw();},280);
draw();
return;
}
if(hit.kind==='strum'){
for(var i=0;i<OPEN_STRINGS.length;i++)pluck(OPEN_STRINGS[i],i*0.045);
noteCount+=6;
countEl.textContent=noteCount;
lastNoteEl.textContent='STRUM';
chordLabelEl.textContent='—';
return;
}
if(hit.kind==='string'){
pluck(OPEN_STRINGS[hit.idx],0);
noteCount++;
countEl.textContent=noteCount;
lastNoteEl.textContent=STRING_LABELS[hit.idx];
activeStrings[hit.idx]=true;
(function(idx){
setTimeout(function(){activeStrings[idx]=false;draw();},180);
})(hit.idx);
draw();
}
}

var lastHit={};
function targetKey(hit){if(!hit)return null;return hit.kind+'-'+hit.idx;}
function handleTouch(id,x,y){
  var hit=hitTest(x,y);
  var key=targetKey(hit);
  var prev=lastHit[id];
  if(prev===key)return;
  lastHit[id]=key;
  if(hit&&hit.kind==='string'){
    pluck(OPEN_STRINGS[hit.idx],0);
    noteCount++;countEl.textContent=noteCount;
    lastNoteEl.textContent=STRING_LABELS[hit.idx];
    activeStrings[hit.idx]=true;
    (function(i){setTimeout(function(){activeStrings[i]=false;draw();},160);})(hit.idx);
    draw();
  } else if(hit&&hit.kind==='chord'){
    playChord(hit.idx);
    activeChord=hit.idx;
    clearTimeout(chordTimer);
    chordTimer=setTimeout(function(){activeChord=-1;draw();},280);
    draw();
  } else if(hit&&hit.kind==='strum'){
    for(var i=0;i<OPEN_STRINGS.length;i++)pluck(OPEN_STRINGS[i],i*0.04);
    noteCount+=6;countEl.textContent=noteCount;
    lastNoteEl.textContent='STRUM';chordLabelEl.textContent='—';
  }
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var p=getPos(t);
    lastHit[t.identifier]=null;
    handleTouch(t.identifier,p.x,p.y);
  }
}, {passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.touches.length;i++){
    var t=e.touches[i];
    var p=getPos(t);
    handleTouch(t.identifier,p.x,p.y);
  }
}, {passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++)delete lastHit[e.changedTouches[i].identifier];
}, {passive:false});
var mouseDown=false;
cv.addEventListener('mousedown',function(e){mouseDown=true;lastHit['mouse']=null;var p=getPos(e);handleTouch('mouse',p.x,p.y);});
cv.addEventListener('mousemove',function(e){if(!mouseDown)return;var p=getPos(e);handleTouch('mouse',p.x,p.y);});
cv.addEventListener('mouseup',function(){mouseDown=false;delete lastHit['mouse'];});
cv.addEventListener('mouseleave',function(){mouseDown=false;delete lastHit['mouse'];});

function setVolume(v){
volumeLevel=Math.max(0,Math.min(100,v));
if(masterGain)masterGain.gain.value=volumeLevel/100;
if(volPct)volPct.textContent=volumeLevel+'%';
if(volSlider){volSlider.value=volumeLevel;volSlider.style.setProperty('--pct',volumeLevel+'%');}
}
if(volSlider)volSlider.addEventListener('input',function(){setVolume(parseInt(this.value,10));});
volSlider.style.setProperty('--pct',volumeLevel+'%');

draw();
})();
</script>
</body>
</html>

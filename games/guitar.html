<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guitar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; touch-action: none; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 10px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🎸 Guitar</div>
    <div class="best">🎵 <span id="lastNote">—</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Mode <span id="modeLabel">STRINGS</span></span>
      <span>Notes <span id="count">0</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="240"></canvas>
    </div>
  </div>
  <div class="hint">Tap a chord, or strum individual strings</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var CHORD_H = 68;
  var STRING_TOP = CHORD_H + 8;
  var STRING_AREA_H = H - STRING_TOP - 10;
  var NUM_STRINGS = 6;
  var STRING_GAP = STRING_AREA_H / (NUM_STRINGS + 1);

  var CHORDS = [
    { name: 'Am', notes: ['A2','E3','A3','C4','E4'] },
    { name: 'C',  notes: ['C3','E3','G3','C4','E4'] },
    { name: 'G',  notes: ['G2','B2','D3','G3','B3'] },
    { name: 'Em', notes: ['E2','B2','E3','G3','B3'] }
  ];

  var STRINGS = [
    { note: 'E2', label: 'E' },
    { note: 'A2', label: 'A' },
    { note: 'D3', label: 'D' },
    { note: 'G3', label: 'G' },
    { note: 'B3', label: 'B' },
    { note: 'E4', label: 'E' }
  ];

  var FREQ = {
    'E2': 82.41, 'F2': 87.31, 'G2': 98.00,
    'A2': 110.00, 'B2': 123.47,
    'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'A4': 440.00, 'C#4': 277.18
  };

  var lastNoteEl = document.getElementById('lastNote');
  var countEl = document.getElementById('count');
  var modeEl = document.getElementById('modeLabel');

  var audioCtx = null;
  var noteCount = 0;
  var activeChord = -1;
  var activeStrings = {};
  var chordTimer = null;

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function pluck(note, delay) {
    initAudio();
    if (!audioCtx) return;
    var f = FREQ[note];
    if (!f) return;
    var t = audioCtx.currentTime + (delay || 0);

    var osc1 = audioCtx.createOscillator();
    var osc2 = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var filter = audioCtx.createBiquadFilter();

    osc1.type = 'triangle';
    osc2.type = 'sawtooth';
    osc1.frequency.value = f;
    osc2.frequency.value = f * 2;

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2800, t);
    filter.frequency.exponentialRampToValueAtTime(500, t + 0.7);

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);

    var mix2 = audioCtx.createGain();
    mix2.gain.value = 0.25;

    osc1.connect(filter);
    osc2.connect(mix2);
    mix2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(t);
    osc2.start(t);
    osc1.stop(t + 1.5);
    osc2.stop(t + 1.5);
  }

  function strum() {
    for (var i = 0; i < STRINGS.length; i++) {
      pluck(STRINGS[i].note, i * 0.045);
    }
    noteCount += 6;
    countEl.textContent = noteCount;
    lastNoteEl.textContent = 'STRUM';
  }

  function playChord(idx) {
    var c = CHORDS[idx];
    for (var i = 0; i < c.notes.length; i++) {
      pluck(c.notes[i], i * 0.035);
    }
    noteCount += c.notes.length;
    countEl.textContent = noteCount;
    lastNoteEl.textContent = c.name;
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    // Chords row
    var cw = (W - 24) / CHORDS.length;
    for (var i = 0; i < CHORDS.length; i++) {
      var x = 12 + i * cw;
      var y = 8;
      var inset = 3;
      var bx = x + inset;
      var by = y + inset;
      var bw = cw - inset * 2;
      var bh = CHORD_H - 16;

      var isActive = (activeChord === i);
      ctx.fillStyle = isActive ? '#5a7a3a' : '#1e3a1a';
      roundRect(bx, by, bw, bh, 8);
      ctx.fill();

      ctx.fillStyle = isActive ? '#f0f0e0' : '#a8b878';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(CHORDS[i].name, bx + bw / 2, by + bh / 2);
    }

    // Strum bar
    var strumY = CHORD_H + 2;
    ctx.fillStyle = '#2a4a1a';
    roundRect(12, strumY, W - 24, 16, 6);
    ctx.fill();
    ctx.fillStyle = '#a8b878';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚡ STRUM ALL', W / 2, strumY + 8);

    // Strings
    for (var j = 0; j < NUM_STRINGS; j++) {
      var sy = STRING_TOP + (j + 1) * STRING_GAP;
      var isHit = activeStrings[j];
      ctx.strokeStyle = isHit ? '#5a7a3a' : '#3a4a2a';
      ctx.lineWidth = isHit ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(20, sy);
      ctx.lineTo(W - 20, sy);
      ctx.stroke();

      ctx.fillStyle = '#3a4a2a';
      ctx.font = 'bold 10px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(STRINGS[j].label, 6, sy);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function getPos(e) {
    var rect = cv.getBoundingClientRect();
    var sx = cv.width / rect.width;
    var sy = cv.height / rect.height;
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
  }

  function tap(x, y) {
    // Chord row
    if (y >= 8 && y <= CHORD_H - 8) {
      var cw = (W - 24) / CHORDS.length;
      var idx = Math.floor((x - 12) / cw);
      if (idx >= 0 && idx < CHORDS.length) {
        playChord(idx);
        activeChord = idx;
        clearTimeout(chordTimer);
        chordTimer = setTimeout(function(){ activeChord = -1; draw(); }, 250);
        draw();
        return;
      }
    }

    // Strum bar
    if (y >= CHORD_H + 2 && y <= CHORD_H + 18) {
      strum();
      return;
    }

    // Strings
    var best = -1;
    var bestDist = 14;
    for (var j = 0; j < NUM_STRINGS; j++) {
      var sy = STRING_TOP + (j + 1) * STRING_GAP;
      var d = Math.abs(y - sy);
      if (d < bestDist) { bestDist = d; best = j; }
    }
    if (best >= 0) {
      pluck(STRINGS[best].note, 0);
      noteCount++;
      countEl.textContent = noteCount;
      lastNoteEl.textContent = STRINGS[best].label;
      activeStrings[best] = true;
      setTimeout(function(){ activeStrings[best] = false; draw(); }, 200);
      draw();
    }
  }

  cv.addEventListener('touchstart', function(e){ e.preventDefault(); var p = getPos(e); tap(p.x, p.y); }, { passive: false });
  cv.addEventListener('click', function(e){ var p = getPos(e); tap(p.x, p.y); });

  document.addEventListener('keydown', function(e){
    var map = { a: 0, s: 1, d: 2, f: 3, g: 4, h: 5 };
    if (map[e.key] !== undefined) {
      pluck(STRINGS[map[e.key]].note, 0);
      noteCount++;
      countEl.textContent = noteCount;
      lastNoteEl.textContent = STRINGS[map[e.key]].label;
    }
  });

  draw();
})();
</script>
</body>
</html>

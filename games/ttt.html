<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic-Tac-Toe — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0000; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  h1 { color: #ff2222; font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; font-weight: bold; }
  #modes { display: flex; gap: 6px; margin-bottom: 12px; }
  #modes button { padding: 8px 16px; background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 12px; border-radius: 5px; cursor: pointer; letter-spacing: 1px; font-weight: bold; }
  #modes button.active { background: #aa0000; color: #fff; border-color: #ff2222; }
  #scorebar { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #ff6666; letter-spacing: 1px; }
  #scorebar span b { color: #fff; }
  #status { margin-bottom: 12px; font-size: 15px; color: #ffaa88; letter-spacing: 2px; font-weight: bold; min-height: 22px; text-align: center; }
  #board { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 6px; background: #220000; padding: 6px; border-radius: 10px; }
  .cell { background: #150000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; cursor: pointer; }
  .cell.x { color: #ff2222; }
  .cell.o { color: #66ccff; }
  .cell.win { background: #440000; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { background: #440000; } to { background: #660000; } }
  #restart { margin-top: 16px; padding: 10px 30px; background: #aa0000; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
  #restart:active { background: #dd0000; }
  #diff { margin-top: 12px; display: flex; gap: 6px; }
  #diff button { padding: 6px 14px; background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 11px; border-radius: 5px; cursor: pointer; letter-spacing: 1px; }
  #diff button.active { background: #aa0000; color: #fff; border-color: #ff2222; }
</style>
</head>
<body>
<h1>SUKUNA TIC-TAC-TOE</h1>
<div id="modes">
  <button data-m="bot" class="active">VS BOT</button>
  <button data-m="duo">2 PLAYERS</button>
</div>
<div id="scorebar">
  <span>X <b id="sX">0</b></span>
  <span>DRAW <b id="sDraw">0</b></span>
  <span>O <b id="sO">0</b></span>
</div>
<div id="status">Your turn — you are ❌</div>
<div id="board"></div>
<button id="restart">NEW GAME</button>
<div id="diff">
  <button data-d="easy">EASY</button>
  <button data-d="medium" class="active">MEDIUM</button>
  <button data-d="hard">HARD</button>
</div>
<script>
(() => {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');
  const sXEl = document.getElementById('sX');
  const sDrawEl = document.getElementById('sDraw');
  const sOEl = document.getElementById('sO');
  const diffEl = document.getElementById('diff');

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board, gameOver, turn, mode, diff;
  let scoreX = parseInt(localStorage.getItem('ttt_sX') || '0', 10);
  let scoreO = parseInt(localStorage.getItem('ttt_sO') || '0', 10);
  let scoreDraw = parseInt(localStorage.getItem('ttt_sDraw') || '0', 10);

  mode = 'bot';
  diff = 'medium';
  updateScore();

  function updateScore() {
    sXEl.textContent = scoreX;
    sOEl.textContent = scoreO;
    sDrawEl.textContent = scoreDraw;
  }

  function saveScore() {
    localStorage.setItem('ttt_sX', scoreX);
    localStorage.setItem('ttt_sO', scoreO);
    localStorage.setItem('ttt_sDraw', scoreDraw);
  }

  function reset() {
    board = Array(9).fill('');
    gameOver = false;
    turn = 'X';
    if (mode === 'bot') {
      statusEl.textContent = 'Your turn — you are ❌';
      diffEl.style.display = 'flex';
    } else {
      statusEl.textContent = '❌ Player X — your turn';
      diffEl.style.display = 'none';
    }
    render();
  }

  function render(winLine) {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      if (board[i] === 'X') d.classList.add('x');
      if (board[i] === 'O') d.classList.add('o');
      if (winLine && winLine.includes(i)) d.classList.add('win');
      d.textContent = board[i] === 'X' ? '❌' : board[i] === 'O' ? '⭕' : '';
      d.addEventListener('click', () => play(i));
      boardEl.appendChild(d);
    }
  }

  function play(i) {
    if (gameOver || board[i]) return;
    if (mode === 'bot' && turn !== 'X') return;
    board[i] = turn;
    const r = check();
    if (r) return finish(r);
    render();
    if (mode === 'bot') {
      turn = 'O';
      statusEl.textContent = 'Bot thinking...';
      setTimeout(botTurn, 350);
    } else {
      turn = turn === 'X' ? 'O' : 'X';
      statusEl.textContent = turn === 'X' ? '❌ Player X — your turn' : '⭕ Player O — your turn';
    }
  }

  function botTurn() {
    if (gameOver) return;
    const move = botMove();
    if (move !== null) board[move] = 'O';
    const r = check();
    if (r) return finish(r);
    turn = 'X';
    statusEl.textContent = 'Your turn — you are ❌';
    render();
  }

  function finish(r) {
    gameOver = true;
    if (r.winner === 'X') {
      scoreX++;
      statusEl.textContent = mode === 'bot' ? '🏆 You win!' : '🏆 Player X wins!';
    } else if (r.winner === 'O') {
      scoreO++;
      statusEl.textContent = mode === 'bot' ? '💀 Bot wins' : '🏆 Player O wins!';
    } else {
      scoreDraw++;
      statusEl.textContent = '🤝 Draw';
    }
    updateScore();
    saveScore();
    render(r.line);
  }

  function check() {
    for (const w of WINS) {
      const [a,b,c] = w;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], line: w };
      }
    }
    if (board.every(c => c)) return { winner: 'draw' };
    return null;
  }

  function empty() { return board.map((v, i) => v ? -1 : i).filter(i => i >= 0); }

  function botMove() {
    const e = empty();
    if (e.length === 0) return null;
    if (diff === 'easy') return e[Math.floor(Math.random() * e.length)];
    if (diff === 'medium') {
      if (Math.random() < 0.5) {
        const s = smartMove();
        return s !== null ? s : e[Math.floor(Math.random() * e.length)];
      }
      return e[Math.floor(Math.random() * e.length)];
    }
    const s = smartMove();
    return s !== null ? s : e[Math.floor(Math.random() * e.length)];
  }

  function smartMove() {
    for (const w of WINS) {
      const line = w.map(i => board[i]);
      if (line.filter(v => v === 'O').length === 2) {
        const idx = line.indexOf('');
        if (idx >= 0) return w[idx];
      }
    }
    for (const w of WINS) {
      const line = w.map(i => board[i]);
      if (line.filter(v => v === 'X').length === 2) {
        const idx = line.indexOf('');
        if (idx >= 0) return w[idx];
      }
    }
    if (board[4] === '') return 4;
    const corners = [0, 2, 6, 8].filter(i => !board[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    const sides = [1, 3, 5, 7].filter(i => !board[i]);
    if (sides.length) return sides[Math.floor(Math.random() * sides.length)];
    return null;
  }

  restartBtn.addEventListener('click', reset);
  document.querySelectorAll('#modes button').forEach(b => {
    b.addEventListener('click', () => {
      mode = b.dataset.m;
      document.querySelectorAll('#modes button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    });
  });
  document.querySelectorAll('#diff button').forEach(b => {
    b.addEventListener('click', () => {
      diff = b.dataset.d;
      document.querySelectorAll('#diff button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    });
  });

  reset();
})();
</script>
</body>
</html>

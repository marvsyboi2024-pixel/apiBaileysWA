<div style="padding:10px;background:#150000;color:#ff2222;font-family:Arial">
<h1 style="color:#ff2222">STRIPPED SNAKE</h1>
<p style="color:#ff6666">SCORE <span id="sc">0</span></p>
<canvas id="c" width="320" height="320" style="border:2px solid #440000;border-radius:10px;display:block;background:#150000"></canvas>
<button id="up" style="margin-top:8px;padding:10px 20px">UP</button>
</div>
<script>
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var sc = document.getElementById('sc');
var snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
var dir = {x:1,y:0};
var food = {x:15,y:10};
var score = 0;
var CELL = 20;
function draw() {
  ctx.fillStyle = '#150000';
  ctx.fillRect(0,0,320,320);
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
  for (var i=0;i<snake.length;i++) {
    ctx.fillStyle = i===0 ? '#ff2222' : '#cc0000';
    ctx.fillRect(snake[i].x*CELL+1, snake[i].y*CELL+1, CELL-2, CELL-2);
  }
}
function tick() {
  var head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (head.x<0) head.x = 15;
  if (head.x>15) head.x = 0;
  if (head.y<0) head.y = 15;
  if (head.y>15) head.y = 0;
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score+=10;
    sc.textContent=score;
    food = {x:Math.floor(Math.random()*16), y:Math.floor(Math.random()*16)};
  } else {
    snake.pop();
  }
  draw();
}
setInterval(tick, 200);
document.getElementById('up').onclick = function(){ dir={x:0,y:-1}; };
draw();
</script>

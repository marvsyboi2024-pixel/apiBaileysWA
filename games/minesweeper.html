<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .gameover { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .gameover h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .gameover p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .gameover .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .gameover button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .controls button { flex: 1; background: rgba(90,100,60,0.15); border: 1px solid #7a8a5a; border-radius: 10px; color: #3a4a1a; font-size: 12px; font-weight: bold; letter-spacing: 1px; padding: 10px 0; cursor: pointer; font-family: inherit; }
  .controls button.active { background: rgba(90,100,60,0.45); color: #1a2a0a; border-color: #3a4a1a; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 10px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">💣 Minesweeper</div>
    <div class="best">🏆 BEST <span id="best">0s</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Mines <span id="mines">10</span></span>
      <span>Flags <span id="flags">0</span></span>
      <span>Time <span id="time">0</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="336"></canvas>
      <div class="gameover" id="overlay">
        <h2 id="ovTitle">Game Over</h2>
        <p id="overlayMsg">Tap Play Again.</p>
        <div class="sect"><button id="restart">Play Again</button></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="modeReveal" class="active">⛏ DIG</button>
    <button id="modeFlag">🚩 FLAG</button>
  </div>
  <div class="hint">Tap a cell to dig, tap FLAG then a cell to flag</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var COLS = 9, ROWS = 9;
  var CELL = Math.floor(Math.min(W, H) / COLS);
  var BOARD_W = COLS * CELL;
  var BOARD_H = ROWS * CELL;
  var OX = Math.floor((W - BOARD_W) / 2);
  var OY = Math.floor((H - BOARD_H) / 2);
  var MINES = 10;

  var grid, revealed, flagged, mineCount, flagMode, dead, won, started, timeTick, seconds;

  var minesEl = document.getElementById('mines');
  var flagsEl = document.getElementById('flags');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var overlayMsg = document.getElementById('overlayMsg');
  var btnReveal = document.getElementById('modeReveal');
  var btnFlag = document.getElementById('modeFlag');

  var bestTime = parseInt(localStorage.getItem('mine_best') || '0', 10);
  if (bestTime > 0) bestEl.textContent = bestTime + 's';

  function reset() {
    grid = [];
    revealed = [];
    flagged = [];
    for (var i = 0; i < ROWS * COLS; i++) {
      grid.push(0);
      revealed.push(false);
      flagged.push(false);
    }
    mineCount = MINES;
    flagMode = false;
    dead = false;
    won = false;
    started = false;
    seconds = 0;
    clearInterval(timeTick);
    timeEl.textContent = '0';
    minesEl.textContent = mineCount;
    flagsEl.textContent = '0';
    overlay.style.display = 'none';
    btnReveal.classList.add('active');
    btnFlag.classList.remove('active');
    draw();
  }

  function placeMines(safeIdx) {
    var sr = Math.floor(safeIdx / COLS);
    var sc = safeIdx % COLS;
    var forbidden = {};
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var r = sr + dr, c = sc + dc;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) forbidden[r * COLS + c] = true;
      }
    }
    var placed = 0;
    while (placed < mineCount) {
      var idx = Math.floor(Math.random() * ROWS * COLS);
      if (forbidden[idx] || grid[idx] === -1) continue;
      grid[idx] = -1;
      placed++;
    }
    for (var r2 = 0; r2 < ROWS; r2++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        var i2 = r2 * COLS + c2;
        if (grid[i2] === -1) continue;
        var count = 0;
        for (var dr2 = -1; dr2 <= 1; dr2++) {
          for (var dc2 = -1; dc2 <= 1; dc2++) {
            if (dr2 === 0 && dc2 === 0) continue;
            var nr = r2 + dr2, nc = c2 + dc2;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              if (grid[nr * COLS + nc] === -1) count++;
            }
          }
        }
        grid[i2] = count;
      }
    }
  }

  function reveal(idx) {
    if (revealed[idx] || flagged[idx] || dead) return;
    if (!started) {
      started = true;
      placeMines(idx);
      timeTick = setInterval(function(){
        if (!dead) { seconds++; timeEl.textContent = seconds; }
      }, 1000);
    }
    revealed[idx] = true;
    if (grid[idx] === -1) {
      dead = true;
      clearInterval(timeTick);
      revealAllMines();
      ovTitle.textContent = 'Boom';
      overlayMsg.textContent = 'You hit a mine.';
      overlay.style.display = 'block';
      draw();
      return;
    }
    if (grid[idx] === 0) {
      var r = Math.floor(idx / COLS);
      var c = idx % COLS;
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          var nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            var ni = nr * COLS + nc;
            if (!revealed[ni] && !flagged[ni]) reveal(ni);
          }
        }
      }
    }
    checkWin();
    draw();
  }

  function revealAllMines() {
    for (var i = 0; i < grid.length; i++) {
      if (grid[i] === -1) revealed[i] = true;
    }
  }

  function checkWin() {
    var revealedCount = 0;
    for (var i = 0; i < revealed.length; i++) if (revealed[i]) revealedCount++;
    if (revealedCount === ROWS * COLS - mineCount) {
      won = true;
      dead = true;
      clearInterval(timeTick);
      if (bestTime === 0 || seconds < bestTime) {
        bestTime = seconds;
        localStorage.setItem('mine_best', bestTime);
        bestEl.textContent = bestTime + 's';
      }
      ovTitle.textContent = 'You Win';
      overlayMsg.textContent = 'Cleared in ' + seconds + 's.';
      overlay.style.display = 'block';
    }
  }

  function toggleFlag(idx) {
    if (dead || revealed[idx]) return;
    flagged[idx] = !flagged[idx];
    var f = 0;
    for (var i = 0; i < flagged.length; i++) if (flagged[i]) f++;
    flagsEl.textContent = f;
    minesEl.textContent = Math.max(0, mineCount - f);
    draw();
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = r * COLS + c;
        var x = OX + c * CELL;
        var y = OY + r * CELL;

        if (revealed[i]) {
          ctx.fillStyle = '#b0ba88';
          ctx.fillRect(x, y, CELL, CELL);
          ctx.strokeStyle = '#9aa678';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);

          if (grid[i] === -1) {
            ctx.fillStyle = '#aa2a3a';
            ctx.beginPath();
            ctx.arc(x + CELL/2, y + CELL/2, CELL * 0.3, 0, Math.PI * 2);
            ctx.fill();
          } else if (grid[i] > 0) {
            var colors = ['', '#1e3a1a', '#2a5a2a', '#5a4a1a', '#8a3a1a', '#8a1a1a', '#6a1a3a', '#1a3a5a', '#0a0a0a'];
            ctx.fillStyle = colors[grid[i]] || '#000';
            ctx.font = 'bold ' + Math.floor(CELL * 0.6) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(grid[i], x + CELL/2, y + CELL/2 + 1);
          }
        } else {
          ctx.fillStyle = '#8a9468';
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          ctx.fillStyle = '#a8b878';
          ctx.fillRect(x + 1, y + 1, CELL - 2, 2);
          ctx.fillRect(x + 1, y + 1, 2, CELL - 2);

          if (flagged[i]) {
            ctx.fillStyle = '#aa2a3a';
            ctx.beginPath();
            ctx.moveTo(x + CELL * 0.35, y + CELL * 0.25);
            ctx.lineTo(x + CELL * 0.7, y + CELL * 0.45);
            ctx.lineTo(x + CELL * 0.35, y + CELL * 0.65);
            ctx.fill();
            ctx.fillStyle = '#1e3a1a';
            ctx.fillRect(x + CELL * 0.32, y + CELL * 0.25, 2, CELL * 0.55);
          }
        }
      }
    }
  }

  function getPos(e) {
    var rect = cv.getBoundingClientRect();
    var scx = cv.width / rect.width;
    var scy = cv.height / rect.height;
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * scx, y: (cy - rect.top) * scy };
  }

  function tap(x, y) {
    if (dead) return;
    var c = Math.floor((x - OX) / CELL);
    var r = Math.floor((y - OY) / CELL);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    var i = r * COLS + c;
    if (flagMode) toggleFlag(i);
    else reveal(i);
  }

  cv.addEventListener('touchstart', function(e){ e.preventDefault(); var p = getPos(e); tap(p.x, p.y); }, { passive: false });
  cv.addEventListener('click', function(e){ var p = getPos(e); tap(p.x, p.y); });

  btnReveal.addEventListener('click', function(){ flagMode = false; btnReveal.classList.add('active'); btnFlag.classList.remove('active'); });
  btnFlag.addEventListener('click', function(){ flagMode = true; btnFlag.classList.add('active'); btnReveal.classList.remove('active'); });

  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

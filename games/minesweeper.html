<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0000; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  h1 { color: #ff2222; font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; font-weight: bold; }
  #scorebar { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; color: #ff6666; letter-spacing: 1px; }
  #scorebar span b { color: #fff; }
  #mode { display: flex; gap: 6px; margin-bottom: 10px; }
  #mode button { padding: 6px 12px; background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 11px; border-radius: 5px; cursor: pointer; letter-spacing: 1px; }
  #mode button.active { background: #aa0000; color: #fff; border-color: #ff2222; }
  #board { display: grid; gap: 3px; background: #220000; padding: 6px; border-radius: 10px; }
  .cell { width: 34px; height: 34px; background: #150000; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; cursor: pointer; }
  .cell.revealed { background: #0a0000; cursor: default; }
  .cell.flag { background: #330000; color: #ffcc00; }
  .cell.mine { background: #550000; }
  .cell.n1 { color: #66aaff; }
  .cell.n2 { color: #66ff88; }
  .cell.n3 { color: #ff6666; }
  .cell.n4 { color: #cc66ff; }
  .cell.n5 { color: #ffcc00; }
  .cell.n6 { color: #00dddd; }
  .cell.n7 { color: #eeeeee; }
  .cell.n8 { color: #999999; }
  #controls { display: flex; gap: 10px; margin-top: 14px; }
  #controls button { padding: 10px 22px; background: #aa0000; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
  #controls button#flagBtn { background: #220000; border: 1px solid #440000; color: #ffcc00; }
  #controls button#flagBtn.active { background: #660000; color: #fff; }
  #controls button:active { opacity: 0.8; }
  #msg { margin-top: 10px; font-size: 14px; color: #ffaa88; letter-spacing: 1px; min-height: 20px; text-align: center; font-weight: bold; }
</style>
<meta property="og:title" content="Minesweeper — SUKUNA REALM">
<meta property="og:description" content="Find all bombs without exploding.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUKUNA REALM">
<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://marvsyboi2024-pixel.github.io/apiBaileysWA/games/preview.jpg">
</head>
<body>
<h1>MINESWEEPER</h1>
<div id="scorebar">
  <span>MINES <b id="mines">0</b></span>
  <span>FLAGS <b id="flags">0</b></span>
  <span>TIME <b id="time">0</b></span>
</div>
<div id="mode">
  <button data-s="easy" class="active">EASY 8×8</button>
  <button data-s="medium">MED 10×10</button>
  <button data-s="hard">HARD 12×12</button>
</div>
<div id="board"></div>
<div id="controls">
  <button id="flagBtn">🚩 FLAG</button>
  <button id="restart">NEW GAME</button>
</div>
<div id="msg"></div>
<script>
(() => {
  const boardEl = document.getElementById('board');
  const minesEl = document.getElementById('mines');
  const flagsEl = document.getElementById('flags');
  const timeEl = document.getElementById('time');
  const msgEl = document.getElementById('msg');
  const flagBtn = document.getElementById('flagBtn');
  const restartBtn = document.getElementById('restart');

  const SIZES = {
    easy: { r: 8, c: 8, m: 10 },
    medium: { r: 10, c: 10, m: 18 },
    hard: { r: 12, c: 12, m: 28 }
  };

  let grid, revealed, flagged, mineCount, flagMode, dead, won, started, timeTick, seconds, size;

  size = 'easy';
  flagMode = false;
  restartBtn.addEventListener('click', reset);
  document.querySelectorAll('#mode button').forEach(b => {
    b.addEventListener('click', () => {
      size = b.dataset.s;
      document.querySelectorAll('#mode button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    });
  });

  flagBtn.addEventListener('click', () => {
    flagMode = !flagMode;
    flagBtn.classList.toggle('active', flagMode);
  });

  function reset() {
    const cfg = SIZES[size];
    grid = Array(cfg.r * cfg.c).fill(0);
    revealed = Array(cfg.r * cfg.c).fill(false);
    flagged = Array(cfg.r * cfg.c).fill(false);
    mineCount = cfg.m;
    dead = false;
    won = false;
    started = false;
    seconds = 0;
    clearInterval(timeTick);
    timeEl.textContent = '0';
    msgEl.textContent = '';
    minesEl.textContent = mineCount;
    flagsEl.textContent = '0';

    boardEl.style.gridTemplateColumns = 'repeat(' + cfg.c + ', 34px)';
    render();
  }

  function placeMines(safeIdx) {
    const cfg = SIZES[size];
    const total = cfg.r * cfg.c;
    const forbidden = new Set([safeIdx]);
    const sr = Math.floor(safeIdx / cfg.c);
    const sc = safeIdx % cfg.c;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = sr + dr, nc = sc + dc;
        if (nr >= 0 && nr < cfg.r && nc >= 0 && nc < cfg.c) {
          forbidden.add(nr * cfg.c + nc);
        }
      }
    }
    let placed = 0;
    while (placed < mineCount) {
      const idx = Math.floor(Math.random() * total);
      if (forbidden.has(idx) || grid[idx] === -1) continue;
      grid[idx] = -1;
      placed++;
    }
    for (let r = 0; r < cfg.r; r++) {
      for (let c = 0; c < cfg.c; c++) {
        const i = r * cfg.c + c;
        if (grid[i] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < cfg.r && nc >= 0 && nc < cfg.c) {
              if (grid[nr * cfg.c + nc] === -1) count++;
            }
          }
        }
        grid[i] = count;
      }
    }
  }

  function reveal(idx) {
    const cfg = SIZES[size];
    if (revealed[idx] || flagged[idx] || dead) return;
    if (!started) {
      started = true;
      placeMines(idx);
      timeTick = setInterval(() => {
        if (!dead) { seconds++; timeEl.textContent = seconds; }
      }, 1000);
    }
    revealed[idx] = true;
    if (grid[idx] === -1) {
      dead = true;
      clearInterval(timeTick);
      revealAllMines();
      msgEl.textContent = '💀 BOOM! You hit a mine.';
      render();
      return;
    }
    if (grid[idx] === 0) {
      const r = Math.floor(idx / cfg.c);
      const c = idx % cfg.c;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < cfg.r && nc >= 0 && nc < cfg.c) {
            const ni = nr * cfg.c + nc;
            if (!revealed[ni] && !flagged[ni]) reveal(ni);
          }
        }
      }
    }
    checkWin();
    render();
  }

  function revealAllMines() {
    const cfg = SIZES[size];
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === -1) revealed[i] = true;
    }
  }

  function checkWin() {
    const cfg = SIZES[size];
    const total = cfg.r * cfg.c;
    let revealedCount = 0;
    for (let i = 0; i < total; i++) if (revealed[i]) revealedCount++;
    if (revealedCount === total - mineCount) {
      won = true;
      dead = true;
      clearInterval(timeTick);
      msgEl.textContent = '🏆 You win! Time: ' + seconds + 's';
    }
  }

  function toggleFlag(idx, e) {
    e.preventDefault();
    if (dead || revealed[idx]) return;
    flagged[idx] = !flagged[idx];
    const f = flagged.filter(Boolean).length;
    flagsEl.textContent = f;
    minesEl.textContent = Math.max(0, mineCount - f);
    render();
  }

  function render() {
    const cfg = SIZES[size];
    boardEl.innerHTML = '';
    for (let i = 0; i < grid.length; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      if (flagged[i] && !revealed[i]) {
        d.classList.add('flag');
        d.textContent = '🚩';
      } else if (revealed[i]) {
        d.classList.add('revealed');
        if (grid[i] === -1) {
          d.classList.add('mine');
          d.textContent = '💣';
        } else if (grid[i] > 0) {
          d.textContent = grid[i];
          d.classList.add('n' + grid[i]);
        }
      }
      d.addEventListener('click', () => {
        if (flagMode) toggleFlag(i, { preventDefault: () => {} });
        else reveal(i);
      });
      d.addEventListener('contextmenu', e => toggleFlag(i, e));
      let holdTimer = null;
      d.addEventListener('touchstart', () => {
        holdTimer = setTimeout(() => toggleFlag(i, { preventDefault: () => {} }), 400);
      }, { passive: true });
      d.addEventListener('touchend', () => { clearTimeout(holdTimer); });
      boardEl.appendChild(d);
    }
  }

  reset();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Blast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:18px 22px}
.app{display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px 2px}
.title{font-size:13px;font-weight:bold;color:#ffdd44;letter-spacing:1px}
.best{background:rgba(255,221,68,0.15);color:#ffdd44;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;border:1px solid rgba(255,221,68,0.4)}
.divider{height:1px;background:#ffdd44;opacity:0.3;margin-bottom:8px}
.card{background:#0f0f1e;border:2px solid #2a2a4a;border-radius:12px;padding:8px}
.scorebar{display:flex;justify-content:space-between;font-family:monospace;font-size:11px;color:#ffdd44;letter-spacing:1.5px;padding:2px 4px 6px 4px;text-transform:uppercase}
.playfield{position:relative;border-radius:8px;overflow:hidden}
canvas{display:block;background:#0a0a18;border-radius:8px;width:100%;height:auto;touch-action:none}
.status{text-align:center;color:#8080a0;font-size:11px;font-weight:bold;letter-spacing:1px;margin-top:8px;min-height:16px}
.hint{text-align:center;color:#606080;font-size:11px;font-weight:bold;margin-top:8px;padding-bottom:2px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="title">🧩 BLOCK BLAST</div><div class="best">🏆 BEST <span id="best">0</span></div></div>
<div class="divider"></div>
<div class="card">
<div class="scorebar">
<span>Score <span id="score">0</span></span>
<span>Lines <span id="lines">0</span></span>
<span>Combo <span id="combo">0</span></span>
</div>
<div class="playfield"><canvas id="c" width="320" height="440"></canvas></div>
<div class="status" id="status">Drag a piece to place it</div>
</div>
<div class="hint">Fill rows or columns to clear them</div>
</div>
<script>
(function(){
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;

var COLS=8,ROWS=8,CELL=36;
var BOARD_X=(W-COLS*CELL)/2;
var BOARD_Y=8;
var TRAY_Y=BOARD_Y+ROWS*CELL+18;
var TRAY_H=100;

var COLORS=[
{base:'#4a9eff',top:'#7abcff',dark:'#2a5a9a'},
{base:'#4aff88',top:'#7affb0',dark:'#2a9a58'},
{base:'#ff8844',top:'#ffaa77',dark:'#aa5520'},
{base:'#c84aff',top:'#dd88ff',dark:'#7a2a9a'},
{base:'#ff4444',top:'#ff7777',dark:'#9a2a2a'},
{base:'#ffdd44',top:'#ffee88',dark:'#aa8a20'},
{base:'#44ddff',top:'#88eeff',dark:'#2090aa'},
{base:'#ff66aa',top:'#ff99cc',dark:'#aa4070'}
];

var SHAPES=[
{grid:[[1]],size:1},
{grid:[[1,1]],size:2},
{grid:[[1],[1]],size:2},
{grid:[[1,1],[1,1]],size:4},
{grid:[[1,1,1]],size:3},
{grid:[[1],[1],[1]],size:3},
{grid:[[1,1,1,1]],size:4},
{grid:[[1],[1],[1],[1]],size:4},
{grid:[[1,1,1],[0,1,0]],size:4},
{grid:[[0,1,0],[1,1,1]],size:4},
{grid:[[1,0],[1,1]],size:3},
{grid:[[0,1],[1,1]],size:3},
{grid:[[1,1],[1,0]],size:3},
{grid:[[1,1],[0,1]],size:3},
{grid:[[1,1,1,1,1]],size:5},
{grid:[[1],[1],[1],[1],[1]],size:5}
];

var scoreEl=document.getElementById('score');
var linesEl=document.getElementById('lines');
var comboEl=document.getElementById('combo');
var bestEl=document.getElementById('best');
var statusEl=document.getElementById('status');

var board,pieces,selectedPiece,dragPos,score,best,linesCleared,combo,dead;
var clearAnimations=[];
var flashCells=[];
var lastTime=0,raf;
var audioCtx=null,masterGain=null,compressor=null;

best=parseInt(localStorage.getItem('block_best')||'0',10);
bestEl.textContent=best;

function initAudio(){
if(!audioCtx){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();
masterGain.gain.value=0.5;
compressor=audioCtx.createDynamicsCompressor();
compressor.threshold.value=-15;
compressor.knee.value=10;
compressor.ratio.value=4;
compressor.attack.value=0.003;
compressor.release.value=0.2;
masterGain.connect(compressor);
compressor.connect(audioCtx.destination);
}catch(e){audioCtx=null;}
}
if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}

function beep(f1,f2,dur,type,vol,delay){
initAudio();
if(!audioCtx)return;
var t=audioCtx.currentTime+(delay||0);
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type=type||'sine';
osc.frequency.setValueAtTime(f1,t);
if(f2&&f2!==f1)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
g.gain.setValueAtTime(0.0001,t);
g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.006);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
osc.connect(g);g.connect(masterGain);
osc.start(t);osc.stop(t+dur+0.02);
}

function noiseBurst(dur,vol,hp){
initAudio();
if(!audioCtx)return;
var len=Math.floor(audioCtx.sampleRate*dur);
var buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
var d=buf.getChannelData(0);
for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
var src=audioCtx.createBufferSource();
src.buffer=buf;
var f=audioCtx.createBiquadFilter();
f.type='highpass';f.frequency.value=hp||800;
var g=audioCtx.createGain();
g.gain.value=vol||0.3;
src.connect(f);f.connect(g);g.connect(masterGain);
src.start();
}

function sndPlace(){beep(180,80,0.08,'sine',0.35);noiseBurst(0.05,0.15,1500);}
function sndPick(){beep(1200,1200,0.02,'square',0.15);}
function sndInvalid(){beep(150,120,0.08,'square',0.2);}
function sndClear(n){
var notes=[523,659,784,1046,1318];
for(var i=0;i<Math.min(n,4);i++){
beep(notes[i],notes[i],0.12,'sine',0.35,i*0.08);
}
}
function sndCombo(level){
beep(660+level*80,660+level*80,0.15,'triangle',0.35);
}
function sndGameOver(){
beep(523,523,0.15,'triangle',0.3,0);
beep(392,392,0.18,'triangle',0.3,0.15);
beep(261,261,0.30,'triangle',0.3,0.33);
}
function sndBest(){
beep(523,523,0.12,'sine',0.4,0);
beep(659,659,0.12,'sine',0.4,0.12);
beep(784,784,0.24,'sine',0.4,0.24);
}

function reset(){
board=[];
for(var r=0;r<ROWS;r++){
var row=[];
for(var c=0;c<COLS;c++)row.push(null);
board.push(row);
}
pieces=[];
for(var i=0;i<3;i++)pieces.push(newPiece());
selectedPiece=-1;
dragPos=null;
score=0;
linesCleared=0;
combo=0;
dead=false;
clearAnimations=[];
flashCells=[];
scoreEl.textContent='0';
linesEl.textContent='0';
comboEl.textContent='0';
statusEl.textContent='Drag a piece to place it';
draw();
}

function newPiece(){
var s=SHAPES[Math.floor(Math.random()*SHAPES.length)];
return{
grid:s.grid,
size:s.size,
color:Math.floor(Math.random()*COLORS.length),
used:false
};
}

function canPlace(shape,r0,c0){
for(var r=0;r<shape.length;r++){
for(var c=0;c<shape[r].length;c++){
if(!shape[r][c])continue;
var rr=r0+r,cc=c0+c;
if(rr<0||rr>=ROWS||cc<0||cc>=COLS)return false;
if(board[rr][cc])return false;
}
}
return true;
}

function place(shape,colorIdx,r0,c0){
for(var r=0;r<shape.length;r++){
for(var c=0;c<shape[r].length;c++){
if(shape[r][c])board[r0+r][c0+c]=colorIdx;
}
}
}

function checkClear(){
var rowsFull=[],colsFull=[];
for(var r=0;r<ROWS;r++){
var full=true;
for(var c=0;c<COLS;c++)if(board[r][c]===null){full=false;break;}
if(full)rowsFull.push(r);
}
for(var c2=0;c2<COLS;c2++){
var full2=true;
for(var r2=0;r2<ROWS;r2++)if(board[r2][c2]===null){full2=false;break;}
if(full2)colsFull.push(c2);
}
return{rows:rowsFull,cols:colsFull};
}

function performClear(rows,cols){
var totalCells=rows.length*COLS+cols.length*ROWS-rows.length*cols.length;
for(var i=0;i<rows.length;i++){
for(var c=0;c<COLS;c++){
flashCells.push({r:rows[i],c:c,t:Date.now(),delay:i*30});
}
}
for(var j=0;j<cols.length;j++){
for(var r=0;r<ROWS;r++){
if(rows.indexOf(r)>=0)continue;
flashCells.push({r:r,c:cols[j],t:Date.now(),delay:j*30});
}
}
var totalLines=rows.length+cols.length;
setTimeout(function(){
for(var i=0;i<rows.length;i++)for(var c=0;c<COLS;c++)board[rows[i]][c]=null;
for(var j=0;j<cols.length;j++)for(var r=0;r<ROWS;r++)board[r][cols[j]]=null;
var points=totalLines*100+(totalLines-1)*50;
score+=points;
linesCleared+=totalLines;
if(totalLines>=2){combo++;sndCombo(combo);}else{combo=0;}
scoreEl.textContent=score;
linesEl.textContent=linesCleared;
comboEl.textContent=combo;
sndClear(totalLines);
if(score>best){best=score;localStorage.setItem('block_best',best);bestEl.textContent=best;}
draw();
},totalCells*20+100);
}

function afterPlacement(){
if(pieces.every(function(p){return p.used;})){
pieces=[newPiece(),newPiece(),newPiece()];
}
var anyMove=false;
for(var i=0;i<pieces.length;i++){
if(pieces[i].used)continue;
for(var r=0;r<ROWS&&!anyMove;r++){
for(var c=0;c<COLS&&!anyMove;c++){
if(canPlace(pieces[i].grid,r,c))anyMove=true;
}
}
if(anyMove)break;
}
if(!anyMove){
dead=true;
statusEl.textContent='No moves left! Final score: '+score;
sndGameOver();
if(score>best){best=score;localStorage.setItem('block_best',best);bestEl.textContent=best;sndBest();}
draw();
return;
}
}

function dropPiece(){
if(selectedPiece<0||!dragPos)return;
var p=pieces[selectedPiece];
var cellX=Math.floor((dragPos.x-BOARD_X)/CELL);
var cellY=Math.floor((dragPos.y-BOARD_Y)/CELL);
var shapeW=p.grid[0].length;
var shapeH=p.grid.length;
cellX=Math.max(0,Math.min(COLS-shapeW,cellX));
cellY=Math.max(0,Math.min(ROWS-shapeH,cellY));
if(canPlace(p.grid,cellY,cellX)){
place(p.grid,p.color,cellY,cellX);
p.used=true;
selectedPiece=-1;
dragPos=null;
var cellCount=0;
for(var r=0;r<p.grid.length;r++)for(var c=0;c<p.grid[r].length;c++)if(p.grid[r][c])cellCount++;
score+=cellCount*5;
scoreEl.textContent=score;
sndPlace();
var cl=checkClear();
if(cl.rows.length>0||cl.cols.length>0){
performClear(cl.rows,cl.cols);
}else{
combo=0;
comboEl.textContent='0';
}
afterPlacement();
draw();
}else{
sndInvalid();
selectedPiece=-1;
dragPos=null;
draw();
}
}

function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function drawBlock(x,y,size,colorIdx,alpha,glow){
var col=COLORS[colorIdx];
ctx.globalAlpha=alpha||1;
if(glow){
ctx.shadowColor=col.top;
ctx.shadowBlur=12;
}
ctx.fillStyle=col.base;
roundRect(x+1,y+1,size-2,size-2,6);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle=col.top;
roundRect(x+1,y+1,size-2,(size-2)*0.4,6);
ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.2)';
roundRect(x+3,y+3,size-6,3,2);
ctx.fill();
ctx.globalAlpha=1;
}

function drawBoard(){
for(var r=0;r<ROWS;r++){
for(var c=0;c<COLS;c++){
var x=BOARD_X+c*CELL;
var y=BOARD_Y+r*CELL;
if(board[r][c]!==null){
drawBlock(x,y,CELL,board[r][c]);
}else{
ctx.fillStyle='#1a1a2e';
roundRect(x+1,y+1,CELL-2,CELL-2,6);
ctx.fill();
ctx.strokeStyle='#2a2a4a';
ctx.lineWidth=1;
roundRect(x+1.5,y+1.5,CELL-3,CELL-3,6);
ctx.stroke();
}
}
}
}

function drawFlashCells(){
var now=Date.now();
for(var i=flashCells.length-1;i>=0;i--){
var f=flashCells[i];
var age=now-f.t-f.delay;
if(age<0)continue;
if(age>400){flashCells.splice(i,1);continue;}
var x=BOARD_X+f.c*CELL;
var y=BOARD_Y+f.r*CELL;
var alpha=1-age/400;
ctx.fillStyle='rgba(255,255,255,'+alpha+')';
roundRect(x+1,y+1,CELL-2,CELL-2,6);
ctx.fill();
}
}

function drawTray(){
var slotW=(COLS*CELL)/3;
for(var i=0;i<pieces.length;i++){
var p=pieces[i];
if(p.used)continue;
var cx=BOARD_X+i*slotW+slotW/2;
var cy=TRAY_Y+TRAY_H/2;
if(selectedPiece===i&&dragPos)continue;
var shapeW=p.grid[0].length*24;
var shapeH=p.grid.length*24;
var ox=cx-shapeW/2;
var oy=cy-shapeH/2;
for(var r=0;r<p.grid.length;r++){
for(var c=0;c<p.grid[r].length;c++){
if(!p.grid[r][c])continue;
drawBlock(ox+c*24,oy+r*24,24,p.color);
}
}
}
}

function drawGhost(){
if(selectedPiece<0||!dragPos)return;
var p=pieces[selectedPiece];
var cellX=Math.floor((dragPos.x-BOARD_X)/CELL);
var cellY=Math.floor((dragPos.y-BOARD_Y)/CELL);
var shapeW=p.grid[0].length;
var shapeH=p.grid.length;
cellX=Math.max(0,Math.min(COLS-shapeW,cellX));
cellY=Math.max(0,Math.min(ROWS-shapeH,cellY));
var valid=canPlace(p.grid,cellY,cellX);
for(var r=0;r<p.grid.length;r++){
for(var c=0;c<p.grid[r].length;c++){
if(!p.grid[r][c])continue;
var x=BOARD_X+(cellX+c)*CELL;
var y=BOARD_Y+(cellY+r)*CELL;
if(valid){
ctx.fillStyle='rgba(255,255,255,0.35)';
}else{
ctx.fillStyle='rgba(255,68,68,0.35)';
}
roundRect(x+2,y+2,CELL-4,CELL-4,6);
ctx.fill();
}
}
}

function drawDragPiece(){
if(selectedPiece<0||!dragPos)return;
var p=pieces[selectedPiece];
var shapeW=p.grid[0].length*CELL;
var shapeH=p.grid.length*CELL;
var ox=dragPos.x-shapeW/2;
var oy=dragPos.y-shapeH/2-30;
ctx.globalAlpha=0.9;
for(var r=0;r<p.grid.length;r++){
for(var c=0;c<p.grid[r].length;c++){
if(!p.grid[r][c])continue;
drawBlock(ox+c*CELL,oy+r*CELL,CELL,p.color,1,true);
}
}
ctx.globalAlpha=1;
}

function draw(){
ctx.fillStyle='#0a0a18';
ctx.fillRect(0,0,W,H);

drawBoard();
drawFlashCells();
drawGhost();
drawTray();
drawDragPiece();
}

function getPos(t){
var rect=cv.getBoundingClientRect();
var sx=cv.width/rect.width,sy=cv.height/rect.height;
return{x:(t.clientX-rect.left)*sx,y:(t.clientY-rect.top)*sy};
}

function tapDown(x,y){
if(dead)return;
var slotW=(COLS*CELL)/3;
if(y>=TRAY_Y-5){
for(var i=0;i<pieces.length;i++){
if(pieces[i].used)continue;
var sx=BOARD_X+i*slotW;
if(x>=sx&&x<sx+slotW){
selectedPiece=i;
dragPos={x:x,y:y};
sndPick();
draw();
return;
}
}
}
}

function tapMove(x,y){
if(selectedPiece<0)return;
dragPos={x:x,y:y};
draw();
}

function tapUp(){
if(selectedPiece<0)return;
dropPiece();
}

cv.addEventListener('touchstart',function(e){
e.preventDefault();
var p=getPos(e.changedTouches[0]);
tapDown(p.x,p.y);
},{passive:false});
cv.addEventListener('touchmove',function(e){
e.preventDefault();
var p=getPos(e.touches[0]);
tapMove(p.x,p.y);
},{passive:false});
cv.addEventListener('touchend',function(e){
e.preventDefault();
tapUp();
},{passive:false});
cv.addEventListener('touchcancel',function(e){
e.preventDefault();
selectedPiece=-1;dragPos=null;draw();
},{passive:false});

var mouseDown=false;
cv.addEventListener('mousedown',function(e){
var p=getPos(e);
mouseDown=true;
tapDown(p.x,p.y);
});
cv.addEventListener('mousemove',function(e){
if(!mouseDown)return;
var p=getPos(e);
tapMove(p.x,p.y);
});
cv.addEventListener('mouseup',function(e){
if(!mouseDown)return;
mouseDown=false;
tapUp();
});
cv.addEventListener('mouseleave',function(e){
if(mouseDown){selectedPiece=-1;dragPos=null;draw();}
mouseDown=false;
});

reset();
})();
</script>
</body>
</html>

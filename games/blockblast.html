<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Blast</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .gameover { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .gameover h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .gameover p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .gameover .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .gameover button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 12px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🧩 Block Blast</div>
    <div class="best">🏆 BEST <span id="best">0000</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Score <span id="score">0000</span></span>
      <span>Lines <span id="lines">0</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="240"></canvas>
      <div class="gameover" id="overlay">
        <h2>Game Over</h2>
        <p id="overlayMsg">Your score: 0000.</p>
        <div class="sect"><button id="restart">Play Again</button></div>
      </div>
    </div>
  </div>
  <div class="hint">Tap a piece, then tap the grid to place it</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var COLS = 7;
  var ROWS = 7;
  var CELL = 26;
  var BOARD_X = Math.floor((W - COLS * CELL) / 2);
  var BOARD_Y = 6;
  var TRAY_Y = BOARD_Y + ROWS * CELL + 14;
  var TRAY_H = 40;

  var PIECES = [
    { c: '#1e3a1a', s: [[1]] },
    { c: '#2a4a1a', s: [[1,1]] },
    { c: '#1e3a1a', s: [[1],[1]] },
    { c: '#3a5a2a', s: [[1,1],[1,1]] },
    { c: '#2a4a1a', s: [[1,1,1]] },
    { c: '#2a4a1a', s: [[1],[1],[1]] },
    { c: '#3a5a2a', s: [[1,0],[1,1]] },
    { c: '#3a5a2a', s: [[0,1],[1,1]] },
    { c: '#4a6a3a', s: [[1,1,1],[0,1,0]] }
  ];

  var board, score, lines, pieces, selected, dead;
  var best = parseInt(localStorage.getItem('block_best') || '0', 10);
  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayMsg = document.getElementById('overlayMsg');

  bestEl.textContent = pad(best);

  function pad(n){ n = String(n); while (n.length < 4) n = '0' + n; return n; }

  function newPiece() {
    var p = PIECES[Math.floor(Math.random() * PIECES.length)];
    return { c: p.c, s: p.s, used: false };
  }

  function reset() {
    board = [];
    for (var r = 0; r < ROWS; r++) {
      var row = [];
      for (var c = 0; c < COLS; c++) row.push(null);
      board.push(row);
    }
    score = 0;
    lines = 0;
    selected = null;
    dead = false;
    pieces = [newPiece(), newPiece(), newPiece()];
    scoreEl.textContent = pad(0);
    linesEl.textContent = '0';
    overlay.style.display = 'none';
    draw();
  }

  function canPlace(shape, r0, c0) {
    for (var r = 0; r < shape.length; r++) {
      for (var c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        var rr = r0 + r, cc = c0 + c;
        if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return false;
        if (board[rr][cc]) return false;
      }
    }
    return true;
  }

  function place(shape, color, r0, c0) {
    for (var r = 0; r < shape.length; r++) {
      for (var c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) board[r0 + r][c0 + c] = color;
      }
    }
  }

  function clearLines() {
    var cleared = 0;
    for (var r = 0; r < ROWS; r++) {
      var full = true;
      for (var c = 0; c < COLS; c++) if (!board[r][c]) { full = false; break; }
      if (full) {
        for (var c2 = 0; c2 < COLS; c2++) board[r][c2] = null;
        cleared++;
      }
    }
    for (var c3 = 0; c3 < COLS; c3++) {
      var full2 = true;
      for (var r2 = 0; r2 < ROWS; r2++) if (!board[r2][c3]) { full2 = false; break; }
      if (full2) {
        for (var r3 = 0; r3 < ROWS; r3++) board[r3][c3] = null;
        cleared++;
      }
    }
    if (cleared > 0) {
      score += cleared * 100 + (cleared - 1) * 50;
      lines += cleared;
      scoreEl.textContent = pad(score);
      linesEl.textContent = lines;
    }
  }

  function anyMoveAvailable() {
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.used) continue;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          if (canPlace(p.s, r, c)) return true;
        }
      }
    }
    return false;
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    // Board background
    ctx.fillStyle = '#a8b478';
    ctx.fillRect(BOARD_X - 2, BOARD_Y - 2, COLS * CELL + 4, ROWS * CELL + 4);

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var x = BOARD_X + c * CELL;
        var y = BOARD_Y + r * CELL;
        ctx.fillStyle = board[r][c] || '#c4cd9d';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.strokeStyle = '#b8c490';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
      }
    }

    // Tray
    var slotW = (COLS * CELL) / 3;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.used) continue;
      var cx = BOARD_X + i * slotW + slotW / 2;
      var cy = TRAY_Y + TRAY_H / 2;
      var shW = p.s[0].length * 14;
      var shH = p.s.length * 14;
      var ox = cx - shW / 2;
      var oy = cy - shH / 2;
      for (var rr = 0; rr < p.s.length; rr++) {
        for (var cc = 0; cc < p.s[rr].length; cc++) {
          if (!p.s[rr][cc]) continue;
          ctx.fillStyle = p.c;
          ctx.fillRect(ox + cc * 14 + 1, oy + rr * 14 + 1, 12, 12);
        }
      }
      if (selected === i) {
        ctx.strokeStyle = '#3a5a2a';
        ctx.lineWidth = 2;
        ctx.strokeRect(BOARD_X + i * slotW + 6, TRAY_Y, slotW - 12, TRAY_H);
      }
    }
  }

  function tryPlace(x, y) {
    if (selected === null) return;
    var p = pieces[selected];
    if (!p || p.used) return;
    var col = Math.floor((x - BOARD_X) / CELL);
    var row = Math.floor((y - BOARD_Y) / CELL);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    var sc = Math.max(0, Math.min(COLS - p.s[0].length, col));
    var sr = Math.max(0, Math.min(ROWS - p.s.length, row));
    if (!canPlace(p.s, sr, sc)) return;
    place(p.s, p.c, sr, sc);
    var cells = 0;
    for (var r = 0; r < p.s.length; r++) for (var c = 0; c < p.s[r].length; c++) if (p.s[r][c]) cells++;
    score += cells * 5;
    scoreEl.textContent = pad(score);
    p.used = true;
    clearLines();
    if (pieces.every(function(pp){ return pp.used; })) {
      pieces = [newPiece(), newPiece(), newPiece()];
    }
    selected = null;
    draw();
    if (!anyMoveAvailable()) {
      dead = true;
      if (score > best) {
        best = score;
        localStorage.setItem('block_best', best);
        bestEl.textContent = pad(best);
      }
      overlayMsg.textContent = 'Your score: ' + pad(score) + '.';
      overlay.style.display = 'block';
    }
  }

  function getPos(e) {
    var rect = cv.getBoundingClientRect();
    var sx = cv.width / rect.width;
    var sy = cv.height / rect.height;
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
  }

  function handleTap(x, y) {
    if (dead) return;
    if (y > TRAY_Y - 6) {
      var slotW = (COLS * CELL) / 3;
      for (var i = 0; i < pieces.length; i++) {
        var sx = BOARD_X + i * slotW;
        if (x >= sx && x < sx + slotW && !pieces[i].used) { selected = i; draw(); return; }
      }
      selected = null;
      draw();
    } else {
      tryPlace(x, y);
    }
  }

  cv.addEventListener('touchstart', function(e){ e.preventDefault(); var p = getPos(e); handleTap(p.x, p.y); }, { passive: false });
  cv.addEventListener('click', function(e){ var p = getPos(e); handleTap(p.x, p.y); });
  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .gameover { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .gameover h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.5px; }
  .gameover p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .gameover .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .gameover button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; letter-spacing: 0.5px; font-family: inherit; }
  .dpad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 50px); gap: 8px; justify-content: center; margin-top: 17px; }
  .dpad button { background: transparent; border: 1px solid #a9b8be; border-radius: 12px; color: #a9b8be; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .dpad button:active { background: rgba(180,190,140,0.35); color: #4a5a5a; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  .hint { text-align: center; color: #7a8a90; font-size: 11px; letter-spacing: 0.5px; margin-top: 12px; padding-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🐍 Snake</div>
    <div class="best">🏆 BEST <span id="best">0000</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Score <span id="score">0000</span></span>
      <span>LV <span id="level">1</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="240"></canvas>
      <div class="gameover" id="overlay">
        <h2>Game Over</h2>
        <p id="overlayMsg">Your score: 0000. Tap any direction to play again.</p>
        <div class="sect"><button id="restart">Play Again</button></div>
      </div>
    </div>
  </div>
  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <div class="hint">Tap direction to move — don't crash!</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var CELL = 12;
  var COLS = cv.width / CELL;
  var ROWS = cv.height / CELL;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var overlayMsg = document.getElementById('overlayMsg');
  var snake, dir, nextDir, food, score, level, best, dead, speed, timer;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = pad(best);

  function pad(n){ n = String(n); while (n.length < 4) n = '0' + n; return n; }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      var hit = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === f.x && snake[i].y === f.y) { hit = true; break; }
      }
      if (!hit) { food = f; return; }
    }
  }

  function reset() {
    snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    level = 1;
    speed = 180;
    dead = false;
    scoreEl.textContent = pad(0);
    levelEl.textContent = '1';
    overlay.style.display = 'none';
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, speed);
    draw();
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = pad(score);
      placeFood();
      var newLevel = Math.floor(score / 50) + 1;
      if (newLevel > level) {
        level = newLevel;
        levelEl.textContent = level;
        speed = Math.max(80, 180 - (level - 1) * 15);
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function die() {
    dead = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = pad(best);
    }
    overlayMsg.textContent = 'Your score: ' + pad(score) + '. Tap any direction to play again.';
    overlay.style.display = 'block';
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, cv.width, cv.height);

    ctx.fillStyle = '#1e3a1a';
    ctx.fillRect(food.x * CELL + Math.round(CELL * 0.3), food.y * CELL + Math.round(CELL * 0.3), Math.round(CELL * 0.5), Math.round(CELL * 0.5));

    for (var j = 0; j < snake.length; j++) {
      var s = snake[j];
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  function setDir(d) {
    var m = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    var n = m[d];
    if (!n) return;
    if (n.x === -dir.x && n.y === -dir.y) return;
    nextDir = n;
    if (dead) reset();
  }

  var buttons = document.querySelectorAll('.dpad button');
  for (var k = 0; k < buttons.length; k++) {
    (function(b){
      b.addEventListener('click', function(){ setDir(b.dataset.dir); });
    })(buttons[k]);
  }

  var touchStart = null;
  cv.addEventListener('touchstart', function(e){
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  cv.addEventListener('touchend', function(e){
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  document.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w') setDir('up');
    else if (k === 'ArrowDown' || k === 's') setDir('down');
    else if (k === 'ArrowLeft' || k === 'a') setDir('left');
    else if (k === 'ArrowRight' || k === 'd') setDir('right');
  });

  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

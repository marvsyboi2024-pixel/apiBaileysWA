<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nox Guitar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:6px;color:#fff;touch-action:none}
.shell{--a:#ff2fd0;--bg:#0a0618;background:var(--bg);border:2px solid var(--a);border-radius:14px;padding:10px;max-width:520px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font:900 15px Impact,Arial Black,sans-serif;letter-spacing:1px;color:var(--a)}
.stat{font:bold 11px monospace;color:var(--a);opacity:.8}
.fb{position:relative;height:156px;background:linear-gradient(90deg,#150a2a,#240f3d);border-radius:6px;overflow:hidden;touch-action:none}
.fl{position:absolute;top:0;bottom:0;width:2px;background:#bbb;opacity:.6}
.mk{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);transform:translate(-50%,-50%)}
.st{position:absolute;left:0;right:0;background:linear-gradient(#eee,#888);transform:translateY(-50%);pointer-events:none}
.st.v{animation:vib .55s ease-out}
@keyframes vib{0%{transform:translateY(-50%) scaleY(4)}25%{transform:translateY(-50%) scaleY(-3)}50%{transform:translateY(-50%) scaleY(2)}100%{transform:translateY(-50%) scaleY(1)}}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--a);transform:translate(-50%,-50%);pointer-events:none}
.dot.ch{width:14px;height:14px;opacity:.4}
.sp{position:relative;height:96px;margin-top:8px;border-radius:6px;background:rgba(255,255,255,.06);border:1px dashed var(--a);touch-action:none}
.sp i{position:absolute;right:8px;top:4px;font:bold 10px Arial;color:var(--a);font-style:normal;opacity:.7;pointer-events:none}
.chs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chs button{flex:1 0 22%;padding:7px 0;background:transparent;border:1px solid var(--a);color:var(--a);border-radius:7px;font:bold 11px Arial}
.chs button.on{background:var(--a);color:#000}
.row{display:flex;gap:8px;align-items:center;margin-top:9px;font:bold 11px monospace;color:var(--a)}
.row input{flex:1;accent-color:var(--a)}
.btn{flex:1;padding:10px 0;background:transparent;border:1.5px solid var(--a);color:var(--a);border-radius:8px;font:bold 12px Arial}
.btn.on{background:var(--a);color:#000}
</style>
</head>
<body>
<div class="shell">
<div class="hd"><div class="title">NOX GUITAR</div><div class="stat" id="stat"></div></div>
<div class="chs" id="chs"></div>
<div class="fb" id="fb"></div>
<div class="sp" id="sp"><i>STRUM HERE (swipe)</i></div>
<div class="row"><button class="btn" id="sd">STRUM DOWN</button><button class="btn" id="su">STRUM UP</button></div>
<div class="row"><span>DRIVE</span><input type="range" id="drv" min="1" max="20" value="8"><button class="btn" id="mute" style="flex:0 0 38%">PALM MUTE</button></div>
<div class="row"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="90"><span id="vp">90%</span></div>
</div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var AC,bus,master,comp,NB,VOL=.9,plucks=0;
function ir(sec,dk){var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dk)}return b}
function aud(){
 if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C({latencyHint:'interactive'});
  comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;
  master=AC.createGain();master.gain.value=VOL;bus=AC.createGain();
  var rv=AC.createConvolver();rv.buffer=ir(1.8,2.6);var rg=AC.createGain();rg.gain.value=.16;
  bus.connect(master);bus.connect(rv);rv.connect(rg);rg.connect(master);master.connect(comp);comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 if(AC.state!=='running')AC.resume();
 return AC}
function F(type,f,q){var b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1])}
function stat(){$('stat').textContent='PLUCKS '+plucks}
var TUN=[40,45,50,55,59,64],KBUF={},SS=[],AG,NX,PRE,DRV=8,MUTE=0,
CH={Em:[0,2,2,0,0,0],Am:[-1,0,2,2,1,0],C:[-1,3,2,0,1,0],G:[3,2,0,0,0,3],D:[-1,-1,0,2,3,2],E:[0,2,2,1,0,0],A:[-1,0,2,2,2,0],Dm:[-1,-1,0,2,3,1]},
CUR='Em';
function ksBuf(m){var key='nox'+m,h=KBUF[key];if(h)return h;if(Object.keys(KBUF).length>48)KBUF={};
 var sr=AC.sampleRate,f=440*Math.pow(2,(m-69)/12),N0=Math.max(2,Math.floor(sr/f-.5)),len=Math.floor(sr*4),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),r=new Float32Array(N0),i,p=0,lv=0;
 for(i=0;i<N0;i++){lv+=(Math.random()*2-1-lv)*.85;r[i]=lv}
 var pp=Math.max(1,Math.floor(N0*.13)),r2=new Float32Array(N0);for(i=0;i<N0;i++)r2[i]=r[i]-r[(i+pp)%N0];r=r2;
 var dc=.9985;
 for(i=0;i<len;i++){var a=r[p],c=r[(p+1)%N0],y=dc*.5*(a+c);r[p]=y;d[i]=a;p=(p+1)%N0}
 var mx=0;for(i=0;i<N0*2&&i<len;i++)mx=Math.max(mx,Math.abs(d[i]));var s=.9/(mx||1);for(i=0;i<len;i++)d[i]*=s;
 return KBUF[key]={b:b,pr:f*(N0+.5)/sr}}
function buildG(){if(NX)return;
 AG=AC.createGain();var b1=F('peaking',110,1.2);b1.gain.value=5;var b2=F('peaking',250,1);b2.gain.value=3;var hs=F('highshelf',4500,0);hs.gain.value=-4;chain(AG,b1,b2,hs,bus);
 NX=AC.createGain();var hp=F('highpass',110),sh=AC.createWaveShaper(),cv=new Float32Array(2048);PRE=AC.createGain();PRE.gain.value=DRV;
 for(var i=0;i<2048;i++)cv[i]=Math.tanh((i/1024-1)*3);sh.curve=cv;sh.oversample='4x';
 var lp=F('lowpass',4200,.7),pkf=F('peaking',2300,1),og=AC.createGain();pkf.gain.value=4;og.gain.value=.5;chain(NX,hp,PRE,sh,lp,pkf,og,bus);
 var dl=AC.createDelay(1),fb=AC.createGain(),dg=AC.createGain();dl.delayTime.value=.3;fb.gain.value=.3;dg.gain.value=.22;og.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(bus)}
var STR={fb:[],sp:[]};
function wig(s){['fb','sp'].forEach(function(k){var e=STR[k][s];if(e){e.classList.remove('v');void e.offsetWidth;e.classList.add('v')}})}
function pluck(s,fr,v){if(!aud())return;buildG();var h=ksBuf(TUN[s]+fr),t=AC.currentTime,old=SS[s];
 if(old){try{old.g.gain.cancelScheduledValues(t);old.g.gain.setTargetAtTime(0,t,.015);old.s.stop(t+.12)}catch(_){}}
 var src=AC.createBufferSource(),g=AC.createGain();src.buffer=h.b;src.playbackRate.value=h.pr;g.gain.setValueAtTime(.85*v,t);
 if(MUTE){g.gain.setTargetAtTime(0,t+.05,.04);src.stop(t+.3)}
 chain(src,g,NX);src.start(t);SS[s]={s:src,g:g};plucks++;wig(s);stat()}
function mk(box,cls,css){var d=document.createElement('div');d.className=cls;d.style.cssText=css;box.appendChild(d);return d}
var fb=$('fb'),sp=$('sp');
for(var i=1;i<7;i++)mk(fb,'fl','left:'+(i*100/7)+'%');
[3,5].forEach(function(f){mk(fb,'mk','left:'+((f+.5)*100/7)+'%;top:50%')});
for(var s=0;s<6;s++){STR.fb[s]=mk(fb,'st','top:'+((s+.5)*100/6)+'%;height:'+(1+(5-s)*.45)+'px');STR.sp[s]=mk(sp,'st','top:'+((s+.5)*100/6)+'%;height:'+(1+(5-s)*.45)+'px')}
function swipe(el,cb){var P={};
 function pos(e){var r=el.getBoundingClientRect();return{r:Math.max(0,Math.min(5,Math.floor((e.clientY-r.top)/r.height*6))),c:Math.max(0,Math.min(6,Math.floor((e.clientX-r.left)/r.width*7)))}}
 el.addEventListener('pointerdown',function(e){e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}var p=pos(e);P[e.pointerId]=p;cb(p.r,p.c,1,e.pointerId)});
 el.addEventListener('pointermove',function(e){var o=P[e.pointerId];if(!o)return;var p=pos(e);if(p.r!==o.r)cb(p.r,p.c,1,e.pointerId);else if(p.c!==o.c)cb(p.r,p.c,.5,e.pointerId);else return;P[e.pointerId]=p});
 function up(e){if(P[e.pointerId]){delete P[e.pointerId];cb(-1,0,0,e.pointerId)}}
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
var DOT={};
swipe(fb,function(r,c,v,id){if(r<0){if(DOT[id]){DOT[id].remove();delete DOT[id]}return}
 if(!DOT[id])DOT[id]=mk(fb,'dot','');DOT[id].style.left=((c+.5)*100/7)+'%';DOT[id].style.top=((r+.5)*100/6)+'%';pluck(r,c,v)});
swipe(sp,function(r,c,v,id){if(r<0)return;var f=CH[CUR][r];if(f>=0)pluck(r,f,1)});
function strum(dir){var ch=CH[CUR],o=dir?[5,4,3,2,1,0]:[0,1,2,3,4,5],n=0;o.forEach(function(s){if(ch[s]<0)return;setTimeout(function(){pluck(s,ch[s],.95)},n++*22)})}
$('sd').addEventListener('pointerdown',function(e){e.preventDefault();strum(0)});
$('su').addEventListener('pointerdown',function(e){e.preventDefault();strum(1)});
function drawCh(){[].forEach.call(fb.querySelectorAll('.dot.ch'),function(d){d.remove()});
 CH[CUR].forEach(function(f,s){if(f>0)mk(fb,'dot ch','left:'+((f+.5)*100/7)+'%;top:'+((s+.5)*100/6)+'%')});
 [].forEach.call($('chs').children,function(b){b.classList.toggle('on',b.textContent===CUR)})}
Object.keys(CH).forEach(function(n){var b=document.createElement('button');b.textContent=n;b.addEventListener('pointerdown',function(e){e.preventDefault();CUR=n;drawCh()});$('chs').appendChild(b)});drawCh();
$('drv').oninput=function(){DRV=+this.value;if(PRE)PRE.gain.value=DRV};
$('mute').onclick=function(){MUTE=!MUTE;this.classList.toggle('on',MUTE)};
document.addEventListener('keydown',function(e){if(e.repeat)return;var k=e.key.toLowerCase();var s='asdfgh'.indexOf(k);if(s>=0)pluck(s,0,1)});
document.addEventListener('pointerdown',function(){aud()});
document.addEventListener('visibilitychange',function(){if(AC){if(document.hidden)AC.suspend();else AC.resume()}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
$('vol').oninput=function(){VOL=this.value/100;$('vp').textContent=this.value+'%';if(master)master.gain.setTargetAtTime(VOL,AC.currentTime,.02)};
stat();
})();
</script>
</body>
</html>

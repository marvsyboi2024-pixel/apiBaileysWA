<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NOX Guitar — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #050008; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
  h1 { color: #aa44ff; font-size: 20px; letter-spacing: 4px; margin-bottom: 8px; font-weight: bold; text-shadow: 0 0 12px #aa44ff; }
  #display { font-size: 15px; color: #cc88ff; letter-spacing: 2px; margin-bottom: 12px; min-height: 20px; font-weight: bold; text-align: center; text-shadow: 0 0 6px #aa44ff; }
  #chords { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 460px; margin-bottom: 12px; }
  .chord { padding: 10px 4px; background: linear-gradient(to bottom, #1a0033 0%, #0a0018 100%); border: 1px solid #440066; border-radius: 8px; text-align: center; cursor: pointer; box-shadow: inset 0 0 8px #330055; }
  .chord.active { background: linear-gradient(to bottom, #4400aa 0%, #220055 100%); border-color: #aa44ff; box-shadow: 0 0 14px #aa44ff; }
  .chord .cn { font-size: 14px; color: #cc88ff; font-weight: bold; letter-spacing: 1px; }
  .chord .cd { font-size: 9px; color: #775599; margin-top: 2px; letter-spacing: 1px; }
  #fretboard { width: 100%; max-width: 460px; background: linear-gradient(to bottom, #100020 0%, #050010 100%); border-radius: 8px; padding: 12px 0; position: relative; border: 2px solid #440066; box-shadow: inset 0 0 20px #220044; }
  .string { height: 14px; margin: 2px 12px; position: relative; cursor: pointer; }
  .string .wire { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: linear-gradient(to right, #664488 0%, #cc99ff 50%, #664488 100%); transform: translateY(-50%); }
  .string.s1 .wire { height: 2px; }
  .string.s2 .wire { height: 2px; }
  .string.s3 .wire { height: 1.5px; }
  .string.s4 .wire { height: 1.5px; }
  .string.s5 .wire { height: 1.8px; }
  .string.s6 .wire { height: 2.2px; }
  .string .label { position: absolute; left: -6px; top: 50%; transform: translateY(-50%); font-size: 9px; color: #775599; }
  .string:active .wire, .string.active .wire { background: #ffddff; box-shadow: 0 0 10px #aa44ff; }
  #strum { margin-top: 14px; padding: 14px 40px; background: linear-gradient(to bottom, #6600cc 0%, #330066 100%); color: #fff; border: 1px solid #aa44ff; border-radius: 8px; font-size: 14px; font-weight: bold; letter-spacing: 3px; cursor: pointer; box-shadow: 0 0 16px #6600cc; text-shadow: 0 0 8px #ffddff; }
  #strum:active { background: linear-gradient(to bottom, #8800ff 0%, #5500aa 100%); }
  #hint { margin-top: 8px; font-size: 10px; color: #664488; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>N̸O̸X̸ G̸U̸I̸T̸A̸R̸</h1>
<div id="display">Tap a chord or pluck a string</div>
<div id="chords"></div>
<div id="fretboard">
  <div class="string s6" data-note="E2"><div class="wire"></div><div class="label">E</div></div>
  <div class="string s5" data-note="A2"><div class="wire"></div><div class="label">A</div></div>
  <div class="string s4" data-note="D3"><div class="wire"></div><div class="label">D</div></div>
  <div class="string s3" data-note="G3"><div class="wire"></div><div class="label">G</div></div>
  <div class="string s2" data-note="B3"><div class="wire"></div><div class="label">B</div></div>
  <div class="string s1" data-note="E4"><div class="wire"></div><div class="label">E</div></div>
</div>
<button id="strum">⚡ DARK STRUM</button>
<div id="hint">Distorted. Heavy. Yours.</div>
<script>
(() => {
  const chordsEl = document.getElementById('chords');
  const display = document.getElementById('display');
  const strumBtn = document.getElementById('strum');
  const strings = document.querySelectorAll('.string');

  const CHORDS = [
    { name: 'Am',  notes: ['A2', 'E3', 'A3', 'C4', 'E4'] },
    { name: 'C',   notes: ['C3', 'E3', 'G3', 'C4', 'E4'] },
    { name: 'G',   notes: ['G2', 'B2', 'D3', 'G3', 'B3'] },
    { name: 'F',   notes: ['F2', 'A2', 'C3', 'F3', 'A3'] },
    { name: 'Dm',  notes: ['D3', 'A3', 'D4', 'F4'] },
    { name: 'Em',  notes: ['E2', 'B2', 'E3', 'G3', 'B3'] },
    { name: 'D',   notes: ['D3', 'A3', 'D4', 'F#4'] },
    { name: 'A',   notes: ['A2', 'E3', 'A3', 'C#4', 'E4'] }
  ];

  const NOTE_FREQ = {
    'E2': 82.41, 'F2': 87.31, 'G2': 98.00,
    'A2': 110.00, 'B2': 123.47,
    'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'A4': 440.00, 'C#4': 277.18
  };

  let ctx = null;

  function initAudio() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { display.textContent = 'Audio unsupported'; }
    }
  }

  // NOX = distorted. Add waveshaper + 3x oscillators.
  function makeDistortionCurve(amount) {
    const k = amount || 40;
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function pluck(note, delay) {
    initAudio();
    if (!ctx) return;
    const f = NOTE_FREQ[note];
    if (!f) return;
    const t = ctx.currentTime + (delay || 0);

    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const osc3 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc2.type = 'square';
    osc3.type = 'triangle';
    osc1.frequency.value = f;
    osc2.frequency.value = f;
    osc3.frequency.value = f * 0.5;

    const shaper = ctx.createWaveShaper();
    shaper.curve = makeDistortionCurve(60);
    shaper.oversample = '4x';

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3500, t);
    filter.frequency.exponentialRampToValueAtTime(600, t + 1.0);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);

    const mix1 = ctx.createGain(); mix1.gain.value = 0.5;
    const mix2 = ctx.createGain(); mix2.gain.value = 0.3;
    const mix3 = ctx.createGain(); mix3.gain.value = 0.4;

    osc1.connect(mix1);
    osc2.connect(mix2);
    osc3.connect(mix3);
    mix1.connect(shaper);
    mix2.connect(shaper);
    mix3.connect(shaper);
    shaper.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    osc1.start(t);
    osc2.start(t);
    osc3.start(t);
    osc1.stop(t + 1.7);
    osc2.stop(t + 1.7);
    osc3.stop(t + 1.7);
  }

  function buildChords() {
    CHORDS.forEach(c => {
      const d = document.createElement('div');
      d.className = 'chord';
      d.innerHTML = '<div class="cn">' + c.name + '</div><div class="cd">' + c.notes.length + ' strings</div>';
      d.addEventListener('pointerdown', e => {
        e.preventDefault();
        d.classList.add('active');
        setTimeout(() => d.classList.remove('active'), 250);
        c.notes.forEach((n, i) => pluck(n, i * 0.035));
        display.textContent = '🌑 ' + c.name;
      });
      chordsEl.appendChild(d);
    });
  }

  strings.forEach(s => {
    s.addEventListener('pointerdown', e => {
      e.preventDefault();
      s.classList.add('active');
      pluck(s.dataset.note, 0);
      display.textContent = '🌑 ' + s.dataset.note;
    });
    s.addEventListener('pointerup', () => s.classList.remove('active'));
    s.addEventListener('pointerleave', () => s.classList.remove('active'));
  });

  strumBtn.addEventListener('click', () => {
    const all = ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'];
    all.forEach((n, i) => pluck(n, i * 0.05));
    display.textContent = '⚡ DARK STRUM';
  });

  buildChords();
})();
</script>
</body>
</html>

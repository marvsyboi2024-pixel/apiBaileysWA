<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drums</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; touch-action: none; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 10px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🥁 Drums</div>
    <div class="best">🎵 <span id="lastHit">—</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Hits <span id="hits">0</span></span>
      <span>Mode <span id="modeLabel">FREE</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="240"></canvas>
    </div>
  </div>
  <div class="hint">Tap each pad to play</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var PADS = [
    { name: 'KICK',  x: 0,   y: 0, w: 1/3, h: 1/2, color: '#1e3a1a' },
    { name: 'SNARE', x: 1/3, y: 0, w: 1/3, h: 1/2, color: '#2a4a1a' },
    { name: 'HI-HAT',x: 2/3, y: 0, w: 1/3, h: 1/2, color: '#1e3a1a' },
    { name: 'TOM',   x: 0,   y: 1/2, w: 1/3, h: 1/2, color: '#3a5a2a' },
    { name: 'CLAP',  x: 1/3, y: 1/2, w: 1/3, h: 1/2, color: '#2a4a1a' },
    { name: 'CRASH', x: 2/3, y: 1/2, w: 1/3, h: 1/2, color: '#3a5a2a' }
  ];

  var hitsEl = document.getElementById('hits');
  var lastEl = document.getElementById('lastHit');
  var modeEl = document.getElementById('modeLabel');

  var audioCtx = null;
  var hits = 0;
  var activePads = {};
  var padTimers = {};
  var lastHitTime = 0;

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function noise(duration, filterFreq, gainLevel) {
    var bufferSize = Math.floor(audioCtx.sampleRate * duration);
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = filterFreq;
    var gain = audioCtx.createGain();
    var t = audioCtx.currentTime;
    gain.gain.setValueAtTime(gainLevel, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(t);
    src.stop(t + duration);
  }

  function tone(startF, endF, duration, type, gainLevel) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var t = audioCtx.currentTime;
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(startF, t);
    if (endF !== startF) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, endF), t + duration);
    }
    gain.gain.setValueAtTime(gainLevel, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  function playSound(name) {
    initAudio();
    if (!audioCtx) return;
    if (name === 'KICK') {
      tone(140, 35, 0.35, 'sine', 0.75);
    } else if (name === 'SNARE') {
      noise(0.18, 900, 0.45);
      tone(200, 150, 0.1, 'triangle', 0.3);
    } else if (name === 'HI-HAT') {
      noise(0.05, 7000, 0.35);
    } else if (name === 'TOM') {
      tone(200, 90, 0.35, 'triangle', 0.55);
    } else if (name === 'CLAP') {
      noise(0.11, 1800, 0.4);
      setTimeout(function(){ noise(0.07, 2200, 0.3); }, 55);
    } else if (name === 'CRASH') {
      noise(0.9, 4500, 0.45);
    }
  }

  function padRect(p) {
    return {
      x: p.x * W,
      y: p.y * H,
      w: p.w * W,
      h: p.h * H
    };
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < PADS.length; i++) {
      var p = PADS[i];
      var r = padRect(p);
      var inset = 4;
      var x = r.x + inset;
      var y = r.y + inset;
      var w = r.w - inset * 2;
      var h = r.h - inset * 2;

      var isActive = activePads[i];

      ctx.fillStyle = isActive ? '#5a7a3a' : p.color;
      roundRect(x, y, w, h, 10);
      ctx.fill();

      var grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, 'rgba(255,255,255,0.08)');
      grad.addColorStop(1, 'rgba(0,0,0,0.15)');
      ctx.fillStyle = grad;
      roundRect(x, y, w, h, 10);
      ctx.fill();

      ctx.fillStyle = isActive ? '#f0f0e0' : '#a8b878';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.name, x + w / 2, y + h / 2);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function hitTest(x, y) {
    for (var i = 0; i < PADS.length; i++) {
      var r = padRect(PADS[i]);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  function getPos(e) {
    var rect = cv.getBoundingClientRect();
    var sx = cv.width / rect.width;
    var sy = cv.height / rect.height;
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
  }

  function trigger(idx) {
    if (idx < 0) return;
    playSound(PADS[idx].name);
    hits++;
    hitsEl.textContent = hits;
    lastEl.textContent = PADS[idx].name;
    activePads[idx] = true;
    clearTimeout(padTimers[idx]);
    padTimers[idx] = setTimeout(function(){ activePads[idx] = false; draw(); }, 130);
    draw();
  }

  cv.addEventListener('touchstart', function(e){ e.preventDefault(); var p = getPos(e); trigger(hitTest(p.x, p.y)); }, { passive: false });
  cv.addEventListener('click', function(e){ var p = getPos(e); trigger(hitTest(p.x, p.y)); });

  document.addEventListener('keydown', function(e){
    var map = { a: 0, s: 1, d: 2, f: 3, g: 4, h: 5 };
    if (map[e.key] !== undefined) trigger(map[e.key]);
  });

  draw();
})();
</script>
</body>
</html>

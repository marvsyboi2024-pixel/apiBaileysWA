<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drum Hero — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0000; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
  h1 { color: #ff2222; font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; font-weight: bold; }
  #display { font-size: 15px; color: #ffaa88; letter-spacing: 2px; margin-bottom: 12px; min-height: 20px; font-weight: bold; }
  #pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; }
  .pad { aspect-ratio: 1 / 1; background: linear-gradient(to bottom, #330000 0%, #1a0000 100%); border: 2px solid #660000; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s; touch-action: manipulation; }
  .pad:active, .pad.active { background: linear-gradient(to bottom, #660000 0%, #330000 100%); border-color: #ff2222; transform: scale(0.95); }
  .pad .emoji { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  .pad .name { font-size: 11px; color: #ff8888; letter-spacing: 2px; font-weight: bold; }
  #recRow { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  #recRow button { padding: 10px 20px; background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; letter-spacing: 1px; }
  #recRow button.active { background: #aa0000; color: #fff; border-color: #ff2222; }
  #recRow button:disabled { opacity: 0.4; }
  #hint { margin-top: 10px; font-size: 11px; color: #884444; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>SUKUNA DRUMS</h1>
<div id="display">Tap a pad to play</div>
<div id="pads">
  <div class="pad" data-s="kick">
    <div class="emoji">🥁</div>
    <div class="name">KICK</div>
  </div>
  <div class="pad" data-s="snare">
    <div class="emoji">🎯</div>
    <div class="name">SNARE</div>
  </div>
  <div class="pad" data-s="hihat">
    <div class="emoji">🎩</div>
    <div class="name">HI-HAT</div>
  </div>
  <div class="pad" data-s="tom">
    <div class="emoji">🪘</div>
    <div class="name">TOM</div>
  </div>
  <div class="pad" data-s="clap">
    <div class="emoji">👏</div>
    <div class="name">CLAP</div>
  </div>
  <div class="pad" data-s="crash">
    <div class="emoji">💥</div>
    <div class="name">CRASH</div>
  </div>
</div>
<div id="recRow">
  <button id="rec">● REC</button>
  <button id="play" disabled>▶ PLAY</button>
  <button id="clear">✕ CLEAR</button>
</div>
<div id="hint">Record a beat, then play it back</div>
<script>
(() => {
  const display = document.getElementById('display');
  const pads = document.querySelectorAll('.pad');
  const recBtn = document.getElementById('rec');
  const playBtn = document.getElementById('play');
  const clearBtn = document.getElementById('clear');

  let ctx = null;
  let rec = false;
  let recStart = 0;
  let recEvents = [];
  let playTimeouts = [];

  function initAudio() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { display.textContent = 'Audio unsupported'; }
    }
  }

  function noise(duration, filterFreq, gainLevel) {
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = filterFreq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(gainLevel, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + duration);
  }

  function tone(freqStart, freqEnd, duration, type, gainLevel) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    if (freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), ctx.currentTime + duration);
    }
    gain.gain.setValueAtTime(gainLevel, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function playSound(name) {
    initAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    if (name === 'kick') {
      tone(150, 40, 0.35, 'sine', 0.7);
    } else if (name === 'snare') {
      noise(0.18, 1200, 0.4);
      tone(220, 160, 0.1, 'triangle', 0.3);
    } else if (name === 'hihat') {
      noise(0.06, 7000, 0.3);
    } else if (name === 'tom') {
      tone(220, 100, 0.35, 'triangle', 0.5);
    } else if (name === 'clap') {
      noise(0.12, 2000, 0.35);
      setTimeout(() => noise(0.08, 2500, 0.25), 60);
    } else if (name === 'crash') {
      noise(0.9, 5000, 0.4);
    }
  }

  function flash(pad) {
    pad.classList.add('active');
    setTimeout(() => pad.classList.remove('active'), 120);
  }

  pads.forEach(pad => {
    pad.addEventListener('pointerdown', e => {
      e.preventDefault();
      const s = pad.dataset.s;
      playSound(s);
      flash(pad);
      display.textContent = '▶ ' + s.toUpperCase();
      if (rec) {
        recEvents.push({ s, t: Date.now() - recStart });
      }
    });
  });

  recBtn.addEventListener('click', () => {
    if (rec) {
      rec = false;
      recBtn.classList.remove('active');
      recBtn.textContent = '● REC';
      playBtn.disabled = recEvents.length === 0;
      display.textContent = 'Stopped. ' + recEvents.length + ' hits';
    } else {
      initAudio();
      rec = true;
      recStart = Date.now();
      recEvents = [];
      recBtn.classList.add('active');
      recBtn.textContent = '■ STOP';
      playBtn.disabled = true;
      display.textContent = 'Recording...';
    }
  });

  playBtn.addEventListener('click', () => {
    initAudio();
    if (!ctx || recEvents.length === 0) return;
    playTimeouts.forEach(t => clearTimeout(t));
    playTimeouts = [];
    display.textContent = 'Playing back...';
    recEvents.forEach(ev => {
      const t = setTimeout(() => {
        playSound(ev.s);
        pads.forEach(p => { if (p.dataset.s === ev.s) flash(p); });
      }, ev.t);
      playTimeouts.push(t);
    });
    const endT = recEvents[recEvents.length - 1].t + 400;
    playTimeouts.push(setTimeout(() => display.textContent = 'Done', endT));
  });

  clearBtn.addEventListener('click', () => {
    recEvents = [];
    rec = false;
    recBtn.classList.remove('active');
    recBtn.textContent = '● REC';
    playBtn.disabled = true;
    display.textContent = 'Cleared';
  });

  document.addEventListener('keydown', e => {
    const map = { a: 'kick', s: 'snare', d: 'hihat', f: 'tom', g: 'clap', h: 'crash' };
    if (map[e.key]) {
      playSound(map[e.key]);
      pads.forEach(p => { if (p.dataset.s === map[e.key]) flash(p); });
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drum Hero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:6px;color:#fff;touch-action:none}
.shell{--a:#ffcf4a;--bg:#150b26;background:var(--bg);border:2px solid var(--a);border-radius:14px;padding:10px;max-width:520px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font:900 15px Impact,Arial Black,sans-serif;letter-spacing:1px;color:var(--a)}
.stat{font:bold 11px monospace;color:var(--a);opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pad{height:62px;border-radius:10px;border:0;color:#fff;font:bold 12px Arial;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);touch-action:none}
.pad.hit{transform:scale(.94);filter:brightness(1.7)}
.row{display:flex;gap:8px;align-items:center;margin-top:9px;font:bold 11px monospace;color:var(--a)}
.row input{flex:1;accent-color:var(--a)}
.btn{flex:1;padding:10px 0;background:transparent;border:1.5px solid var(--a);color:var(--a);border-radius:8px;font:bold 12px Arial}
.btn.on{background:var(--a);color:#000}
</style>
</head>
<body>
<div class="shell">
<div class="hd"><div class="title">DRUM HERO</div><div class="stat" id="stat"></div></div>
<div class="grid" id="pads"></div>
<div class="row"><button class="btn" id="rec">REC</button><button class="btn" id="play">PLAY</button></div>
<div class="row"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="90"><span id="vp">90%</span></div>
</div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var AC,bus,master,comp,NB,VOL=.9,hits=0;
function ir(sec,dk){var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dk)}return b}
function aud(){
 if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C({latencyHint:'interactive'});
  comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;
  master=AC.createGain();master.gain.value=VOL;bus=AC.createGain();
  var rv=AC.createConvolver();rv.buffer=ir(1.8,2.6);var rg=AC.createGain();rg.gain.value=.16;
  bus.connect(master);bus.connect(rv);rv.connect(rg);rg.connect(master);master.connect(comp);comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 if(AC.state!=='running')AC.resume();
 return AC}
function G(v,t){var g=AC.createGain();g.gain.setValueAtTime(v,t);return g}
function dec(g,t,v0,dur){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(v0,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function O(type,f,t,dur){var o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur+.05);return o}
function N(t,dur){var s=AC.createBufferSource();s.buffer=NB;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return s}
function F(type,f,q){var b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1])}
function stat(){$('stat').textContent='HITS '+hits+'  EVENTS '+ev.length}
function kick(t,v){var o=O('sine',150,t,.5),g=G(1,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);dec(g,t,v*1.1,.45);chain(o,g,bus);
 var n=N(t,.02),ng=G(1,t),hp=F('highpass',1500);dec(ng,t,v*.25,.015);chain(n,hp,ng,bus)}
function snare(t,v){var n=N(t,.25),f=F('highpass',900),b=F('peaking',3000),g=G(1,t);b.gain.value=6;dec(g,t,v*.8,.2);chain(n,f,b,g,bus);
 var o=O('triangle',190,t,.12),og=G(1,t);o.frequency.exponentialRampToValueAtTime(130,t+.08);dec(og,t,v*.6,.1);chain(o,og,bus)}
function metal(t,dur,v,hp,bp,q){var g=G(1,t),h=F('highpass',hp),b=F('bandpass',bp,q);dec(g,t,v,dur);
 [205.3,304.4,369.6,522.7,540,800].forEach(function(f){chain(O('square',f,t,dur),h)});chain(h,b,g,bus)}
function hat(t,v,open){metal(t,open?.4:.06,.16*v,7000,10000,.8)}
function tom(t,v,f){var o=O('sine',f*1.6,t,.45),g=G(1,t);o.frequency.exponentialRampToValueAtTime(f,t+.09);dec(g,t,v*.9,.4);chain(o,g,bus);
 var n=N(t,.02),ng=G(1,t),b=F('bandpass',2500);dec(ng,t,v*.2,.015);chain(n,b,ng,bus)}
function clap(t,v){for(var k=0;k<3;k++){var n=N(t+k*.011,.03),b=F('bandpass',1300,1.2),g=G(1,t+k*.011);dec(g,t+k*.011,v*.6,.02);chain(n,b,g,bus)}
 var n2=N(t+.033,.2),b2=F('bandpass',1300,1.2),g2=G(1,t);dec(g2,t+.033,v*.55,.16);chain(n2,b2,g2,bus)}
function rim(t,v){var o=O('triangle',1750,t,.05),o2=O('square',450,t,.05),g=G(1,t),f=F('highpass',400);dec(g,t,v*.35,.04);chain(o,f);chain(o2,f);chain(f,g,bus)}
function shaker(t,v){var n=N(t,.12),b=F('bandpass',6500,1.5),g=G(.0001,t);g.gain.linearRampToValueAtTime(v*.5,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.1);chain(n,b,g,bus)}
function crash(t,v){metal(t,1.5,.14*v,4500,8000,.3);var n=N(t,1.4),h=F('highpass',4000),g=G(1,t);dec(g,t,v*.3,1.3);chain(n,h,g,bus)}
function ride(t,v){metal(t,.9,.1*v,5000,7500,.7);var o=O('sine',3300,t,.5),g=G(1,t);dec(g,t,v*.08,.45);chain(o,g,bus)}
function cow(t,v){var a=O('square',562,t,.35),b=O('square',845,t,.35),f=F('bandpass',800,.8),g=G(1,t);dec(g,t,v*.35,.3);chain(a,f);chain(b,f);chain(f,g,bus)}
var KIT=[['KICK','#7b3fa8',kick],['SNARE','#a83a52',snare],['HI-HAT','#2f6aa8',function(t,v){hat(t,v,0)}],['OPN HAT','#2b7fb0',function(t,v){hat(t,v,1)}],['TOM HI','#a8662f',function(t,v){tom(t,v,200)}],['TOM LO','#8a4f22',function(t,v){tom(t,v,120)}],['CLAP','#2f9a6a',clap],['RIM','#3f8a68',rim],['SHAKER','#6b8a2f',shaker],['CRASH','#b8a62f',crash],['RIDE','#8a8a4a',ride],['COWBELL','#8a5a35',cow]];
var DK=['1','2','3','q','w','e','a','s','d','z','x','c'],pads=[],rec=0,ev=[],t0=0,playing=0,tm=[];
KIT.forEach(function(k,i){var b=document.createElement('button');b.className='pad';b.textContent=k[0];b.style.setProperty('--c',k[1]);
 b.addEventListener('pointerdown',function(e){e.preventDefault();hit(i)});$('pads').appendChild(b);pads.push(b)});
function hit(i,silent){if(!aud())return;KIT[i][2](AC.currentTime+.001,.9);hits++;
 var p=pads[i];p.classList.add('hit');setTimeout(function(){p.classList.remove('hit')},90);
 if(rec&&!silent)ev.push([i,Math.round(performance.now()-t0)]);stat()}
function stopPlay(){playing=0;tm.forEach(clearTimeout);tm=[];$('play').classList.remove('on')}
$('rec').onclick=function(){rec=!rec;this.classList.toggle('on',rec);if(rec){ev=[];t0=performance.now();stopPlay()}stat()};
$('play').onclick=function(){if(playing){stopPlay();return}if(!ev.length)return;rec=0;$('rec').classList.remove('on');playing=1;this.classList.add('on');
 ev.forEach(function(x){tm.push(setTimeout(function(){hit(x[0],1)},x[1]))});tm.push(setTimeout(stopPlay,ev[ev.length-1][1]+600))};
document.addEventListener('keydown',function(e){if(e.repeat)return;var k=e.key.toLowerCase();var i=DK.indexOf(k);if(i>=0)hit(i)});
document.addEventListener('pointerdown',function(){aud()});
document.addEventListener('visibilitychange',function(){if(AC){if(document.hidden)AC.suspend();else AC.resume()}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
$('vol').oninput=function(){VOL=this.value/100;$('vp').textContent=this.value+'%';if(master)master.gain.setTargetAtTime(VOL,AC.currentTime,.02)};
stat();
})();
</script>
</body>
</html>

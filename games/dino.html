<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:8px}
.shell{background:#f4efdc;border-radius:14px;padding:10px 10px 9px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:0 2px 7px;border-bottom:1px solid rgba(58,74,42,.4);margin-bottom:8px}
.title{font-size:14px;font-weight:bold;color:#2a3a1a}
.best{background:rgba(180,190,140,.45);color:#3a3a2a;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;letter-spacing:1px;border:1px solid rgba(120,130,80,.6)}
.card{background:#1a1f17;border-radius:10px;padding:7px 8px 8px}
.sb{display:flex;justify-content:space-between;font:11px monospace;color:#c8d400;letter-spacing:1.5px;padding:0 2px 6px;text-transform:uppercase}
.pf{position:relative}
canvas{display:block;width:100%;height:auto;border-radius:4px;touch-action:manipulation;background:#c4cd9d}
.ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;background:#283641;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.4);text-align:center;padding:14px 10px 0}
.ov h2{color:#fff;font-size:17px;margin-bottom:5px}
.ov p{color:#c4ccd4;font-size:12px;margin-bottom:10px}
.ov .s{border-top:1px solid rgba(255,255,255,.15)}
.ov button{background:none;border:0;color:#d4e000;font:bold 15px Arial;padding:11px 0;width:100%}
.jump{display:block;width:100%;height:60px;margin-top:9px;background:transparent;border:1.5px solid #6b7a5a;border-radius:12px;color:#2a3a1a;font:bold 17px Arial;letter-spacing:3px;touch-action:manipulation}
.jump:active{background:rgba(160,175,100,.5)}
.hint{text-align:center;color:#4a5a3a;font-size:12px;font-weight:bold;margin-top:7px}
</style>
</head>
<body>
<div class="shell">
<div class="hd"><div class="title">🦖 Dino</div><div class="best">🏆 BEST <span id="best">0000</span></div></div>
<div class="card">
<div class="sb"><span>Score <span id="score">0000</span></span><span>Speed <span id="spd">1</span></span></div>
<div class="pf">
<canvas id="c" width="336" height="200"></canvas>
<div class="ov" id="ov"><h2 id="ovT">Ready?</h2><p id="ovM">Tap JUMP to run. Tap twice to double-jump.</p><div class="s"><button id="go">Play</button></div></div>
</div>
</div>
<button class="jump" id="jump">JUMP</button>
<div class="hint">Tap JUMP once to jump, twice to double-jump!</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
var $=function(i){return document.getElementById(i)};
var scoreEl=$('score'),spdEl=$('spd'),bestEl=$('best'),ov=$('ov'),ovT=$('ovT'),ovM=$('ovM');
var BG='#c4cd9d',INK='#1e3a1a',SOFT='#b3bd8a';
var GY=H-30,DH=40,DW=26,DX=46;
var JH=1.8*DH,AIR=0.5,V0=4*JH/AIR,GR=8*JH/(AIR*AIR);
var mem=0;
function getBest(){try{return parseInt(localStorage.getItem('dino_best')||'0',10)||0}catch(e){return mem}}
function setBest(v){mem=v;try{localStorage.setItem('dino_best',String(v))}catch(e){}}
function pad(n){n=String(n);while(n.length<4)n='0'+n;return n}
var S,best=getBest(),raf,last=0,lastTick=Date.now();
bestEl.textContent=pad(best);
function init(){S={run:false,dead:false,deadAt:0,y:0,vy:0,jumps:0,spd:200,dist:0,next:260,obs:[],cl:[{x:70,y:28},{x:210,y:50},{x:310,y:22}]}}
function score(){return Math.floor(S.dist/10)}
function begin(){init();S.run=true;ov.style.display='none'}
function jump(){
  if(S.dead){if(Date.now()-S.deadAt>500)begin();return}
  if(!S.run)begin();
  if(S.jumps<2){S.vy=S.jumps===0?V0:V0*0.8;S.jumps++}
}
function die(){
  S.dead=true;S.run=false;S.deadAt=Date.now();
  var sc=score();if(sc>best){best=sc;setBest(best);bestEl.textContent=pad(best)}
  ovT.textContent='Game Over';ovM.textContent='Your score: '+pad(sc)+'.';$('go').textContent='Play Again';ov.style.display='block';
}
function step(dt){
  var i,o;
  if(S.jumps>0||S.y>0){
    S.vy-=GR*dt;S.y+=S.vy*dt;
    if(S.y<=0){S.y=0;S.vy=0;S.jumps=0}
  }
  if(!S.run)return;
  S.spd=Math.min(420,200+S.dist*0.02);
  S.dist+=S.spd*dt;
  for(i=0;i<S.cl.length;i++){S.cl[i].x-=S.spd*dt*0.15;if(S.cl[i].x<-30){S.cl[i].x=W+20;S.cl[i].y=18+Math.random()*40}}
  if(S.dist>=S.next){
    var hs=[0.6,0.8,1.0],h=Math.round(DH*hs[Math.floor(Math.random()*3)]);
    S.obs.push({x:W+20,w:14+Math.floor(Math.random()*8),h:h});
    S.next=S.dist+S.spd*0.55+180+Math.random()*160;
  }
  var bx=DX+4,bw=DW-8,bb=GY-S.y,bt=bb-DH+4;
  for(i=S.obs.length-1;i>=0;i--){
    o=S.obs[i];o.x-=S.spd*dt;
    if(o.x+o.w<-10){S.obs.splice(i,1);continue}
    if(bx<o.x+o.w-2&&bx+bw>o.x+2&&bb>GY-o.h+2&&bt<GY){die();return}
  }
}
function draw(){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  g.fillStyle=SOFT;var i,c;
  for(i=0;i<S.cl.length;i++){c=S.cl[i];g.fillRect(c.x,c.y,26,6);g.fillRect(c.x+6,c.y-5,14,6)}
  g.fillStyle=INK;g.fillRect(0,GY,W,2);
  var off=Math.floor(S.dist)%40;
  for(i=-1;i<10;i++){g.fillRect(i*40-off+8,GY+8,14,2);g.fillRect(i*40-off+26,GY+16,6,2)}
  for(i=0;i<S.obs.length;i++){
    var o=S.obs[i],x=Math.round(o.x),t=GY-o.h,sw=Math.max(5,Math.round(o.w*0.4));
    g.fillRect(x+Math.round((o.w-sw)/2),t,sw,o.h);
    if(o.h>=Math.round(DH*0.8)){g.fillRect(x,t+Math.round(o.h*0.35),sw,4);g.fillRect(x,t+Math.round(o.h*0.35)-5,4,9);g.fillRect(x+o.w-sw,t+Math.round(o.h*0.2),sw,4);g.fillRect(x+o.w-4,t+Math.round(o.h*0.2)-5,4,9)}
  }
  var top=Math.round(GY-S.y-DH),leg=Math.floor(S.dist/14)%2===0&&S.y===0;
  g.fillRect(DX+8,top,18,14);
  g.fillStyle=BG;g.fillRect(DX+19,top+3,3,3);g.fillStyle=INK;
  g.fillRect(DX+13,top+14,9,6);g.fillRect(DX,top+18,22,14);g.fillRect(DX-6,top+20,8,6);g.fillRect(DX+20,top+22,4,3);
  g.fillRect(DX+4,top+32,5,leg?6:8);g.fillRect(DX+14,top+32,5,leg?8:6);
}
function hud(){scoreEl.textContent=pad(score());spdEl.textContent=Math.floor((S.spd-200)/40)+1}
function tick(now){
  lastTick=Date.now();
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  step(dt);draw();hud();
  raf=requestAnimationFrame(tick);
}
$('jump').addEventListener('click',jump);
cv.addEventListener('click',jump);
$('go').addEventListener('click',function(){if(S.dead&&Date.now()-S.deadAt<300)return;if(S.dead||!S.run){begin();jump()}});
document.addEventListener('keydown',function(e){if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump()}});
setInterval(function(){if(Date.now()-lastTick>800){last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}},500);
init();last=performance.now();raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Runner — SUKUNA REALM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0000; color: #eee; font-family: -apple-system, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  h1 { color: #ff2222; font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; font-weight: bold; }
  #scorebar { display: flex; gap: 24px; margin-bottom: 12px; font-size: 14px; color: #ff6666; letter-spacing: 1px; }
  #scorebar span b { color: #fff; }
  #wrap { position: relative; width: 100%; max-width: 480px; }
  canvas { width: 100%; background: #150000; border: 2px solid #440000; border-radius: 10px; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(10,0,0,0.88); border-radius: 10px; text-align: center; padding: 20px; }
  #overlay.show { display: flex; }
  #overlay h2 { color: #ff2222; font-size: 22px; margin-bottom: 8px; letter-spacing: 3px; }
  #overlay p { color: #ccc; font-size: 14px; margin-bottom: 16px; }
  #overlay button { padding: 10px 24px; background: #aa0000; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; }
  #overlay button:active { background: #dd0000; }
  #jump { margin-top: 14px; padding: 14px 40px; background: #220000; border: 1px solid #440000; color: #ff6666; font-size: 16px; border-radius: 8px; cursor: pointer; letter-spacing: 2px; font-weight: bold; }
  #jump:active { background: #440000; color: #fff; }
</style>
<meta property="og:title" content="Dino Runner — SUKUNA REALM">
<meta property="og:description" content="Jump over cacti. Survive as long as you can.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUKUNA REALM">
<meta name="twitter:card" content="summary">
</head>
<body>
<h1>SUKUNA RUNNER</h1>
<div id="scorebar">
  <span>SCORE <b id="score">0</b></span>
  <span>BEST <b id="best">0</b></span>
</div>
<div id="wrap">
  <canvas id="c" width="480" height="200"></canvas>
  <div id="overlay">
    <h2 id="ovtitle">GAME OVER</h2>
    <p id="ovtext">Score: 0</p>
    <button id="restart">RESTART</button>
  </div>
</div>
<button id="jump">JUMP</button>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovtitle');
  const ovText = document.getElementById('ovtext');
  const restartBtn = document.getElementById('restart');
  const jumpBtn = document.getElementById('jump');

  const W = canvas.width;
  const H = canvas.height;
  const GROUND_Y = H - 40;

  let dino, cacti, clouds, groundOffset, score, best, speed, dead, spawned, timer, lastTime, raf;

  best = parseInt(localStorage.getItem('dino_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    dino = { x: 60, y: GROUND_Y - 40, w: 30, h: 40, vy: 0, jumping: false };
    cacti = [];
    clouds = [
      { x: 200, y: 40, w: 40, h: 12 },
      { x: 400, y: 70, w: 50, h: 12 }
    ];
    groundOffset = 0;
    score = 0;
    speed = 4;
    dead = false;
    spawned = 0;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    lastTime = performance.now();
    cancelAnimationFrame(raf);
    loop();
  }

  function spawnCactus() {
    const h = 25 + Math.floor(Math.random() * 25);
    const w = 15 + Math.floor(Math.random() * 10);
    cacti.push({ x: W + 10, y: GROUND_Y - h, w, h });
  }

  function loop(now) {
    if (dead) return;
    if (!now) now = performance.now();
    const dt = Math.min(32, now - lastTime);
    lastTime = now;

    groundOffset = (groundOffset + speed) % 40;
    speed += 0.0015;

    dino.vy += 1.2;
    dino.y += dino.vy;
    if (dino.y >= GROUND_Y - dino.h) {
      dino.y = GROUND_Y - dino.h;
      dino.vy = 0;
      dino.jumping = false;
    }

    spawned += dt;
    if (spawned > 1400 - Math.min(600, speed * 40)) {
      spawned = 0;
      spawnCactus();
    }

    for (let i = cacti.length - 1; i >= 0; i--) {
      cacti[i].x -= speed;
      if (cacti[i].x + cacti[i].w < -10) cacti.splice(i, 1);
    }

    for (const cl of clouds) {
      cl.x -= speed * 0.3;
      if (cl.x + cl.w < -10) {
        cl.x = W + 20;
        cl.y = 30 + Math.random() * 60;
      }
    }

    for (const c of cacti) {
      if (dino.x < c.x + c.w && dino.x + dino.w > c.x && dino.y < c.y + c.h && dino.y + dino.h > c.y) {
        return die();
      }
    }

    score = Math.floor(groundOffset * 0.5 + speed * 5);
    scoreEl.textContent = score;

    draw();
    raf = requestAnimationFrame(loop);
  }

  function die() {
    dead = true;
    cancelAnimationFrame(raf);
    if (score > best) {
      best = score;
      localStorage.setItem('dino_best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'GAME OVER';
    ovText.textContent = 'Score: ' + score;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#150000';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#1f0000';
    for (const cl of clouds) {
      ctx.beginPath();
      ctx.arc(cl.x + cl.w / 2, cl.y, 8, 0, Math.PI * 2);
      ctx.arc(cl.x + cl.w / 4, cl.y + 3, 6, 0, Math.PI * 2);
      ctx.arc(cl.x + cl.w * 0.75, cl.y + 3, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = '#440000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 2);
    ctx.lineTo(W, GROUND_Y + 2);
    ctx.stroke();

    ctx.strokeStyle = '#2a0000';
    ctx.lineWidth = 1;
    for (let x = -groundOffset; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 2);
      ctx.lineTo(x + 20, GROUND_Y + 2);
      ctx.stroke();
    }

    for (const c of cacti) {
      ctx.fillStyle = '#cc0000';
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.fillStyle = '#991111';
      ctx.fillRect(c.x + 2, c.y + 4, 3, c.h - 8);
      ctx.fillRect(c.x + c.w - 5, c.y + 6, 3, c.h - 10);
    }

    ctx.fillStyle = '#ff2222';
    ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
    ctx.fillStyle = '#150000';
    ctx.fillRect(dino.x + dino.w - 8, dino.y + 8, 4, 4);
    ctx.fillStyle = '#ff6666';
    ctx.fillRect(dino.x, dino.y + dino.h - 6, dino.w - 8, 4);
  }

  function jump() {
    if (dead) return;
    if (!dino.jumping) {
      dino.vy = -13;
      dino.jumping = true;
    }
  }

  jumpBtn.addEventListener('click', jump);
  canvas.addEventListener('click', jump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
  });
  restartBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .gameover { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .gameover h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .gameover p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .gameover .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .gameover button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
  .jump { display: flex; justify-content: center; margin-top: 12px; width: 100%; }
  .jump button { background: rgba(90,100,60,0.15); border: 1px solid #7a8a5a; border-radius: 12px; color: #3a4a1a; font-size: 15px; font-weight: bold; letter-spacing: 3px; padding: 0; height: 52px; width: 100%; cursor: pointer; font-family: inherit; }
  .jump button:active { background: rgba(90,100,60,0.35); color: #1a2a0a; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 8px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🦖 Dino</div>
    <div class="best">🏆 BEST <span id="best">0000</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Score <span id="score">0000</span></span>
      <span>SPD <span id="speed">1</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="200"></canvas>
      <div class="gameover" id="overlay">
        <h2>Game Over</h2>
        <p id="overlayMsg">Your score: 0000.</p>
        <div class="sect"><button id="restart">Play Again</button></div>
      </div>
    </div>
  </div>
  <div class="jump">
    <button id="jumpBtn">JUMP</button>
  </div>
  <div class="hint">Tap JUMP once to jump, twice to double-jump!</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var GROUND = H - 30;

  var DINO_H = 26;
  var H_PEAK = 40;
  var T_AIR = 0.6;
  var V0 = 4 * H_PEAK / T_AIR;
  var GRAV = 8 * H_PEAK / (T_AIR * T_AIR);
  var V0_DOUBLE = V0 * 1.15;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var speedEl = document.getElementById('speed');
  var overlay = document.getElementById('overlay');
  var overlayMsg = document.getElementById('overlayMsg');

  var dino, cacti, clouds, groundOffset, score, distance, best, speed, dead;
  var jumpsLeft, framesSinceSpawn, framesUntilSpawn, lastTime, raf;

  best = parseInt(localStorage.getItem('dino_best') || '0', 10);
  bestEl.textContent = pad(best);

  function pad(n){ n = String(n); while (n.length < 4) n = '0' + n; return n; }

  function reset() {
    dino = { x: 40, y: GROUND - DINO_H, w: 22, h: DINO_H, vy: 0, onGround: true };
    cacti = [];
    clouds = [{x:150,y:30,w:35},{x:290,y:55,w:40}];
    groundOffset = 0;
    score = 0;
    distance = 0;
    speed = 1.5;
    dead = false;
    jumpsLeft = 2;
    framesSinceSpawn = 0;
    framesUntilSpawn = 50;
    scoreEl.textContent = pad(0);
    speedEl.textContent = '1';
    overlay.style.display = 'none';
    lastTime = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function spawnGroup() {
    var r = Math.random();
    var count = 1;
    if (score > 200 && r < 0.35) count = 2;
    if (score > 500 && r < 0.15) count = 3;

    var baseH = 14 + Math.floor(Math.random() * 12);
    if (baseH > DINO_H) baseH = DINO_H;

    var w = 10;
    var gapInside = 3;
    var startX = W + 10;

    for (var i = 0; i < count; i++) {
      var h = baseH;
      if (Math.random() < 0.3) h = Math.min(DINO_H, h + 5);
      cacti.push({ x: startX + i * (w + gapInside), y: GROUND - h, w: w, h: h });
    }
  }

  function tick(now) {
    if (dead) return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    groundOffset = (groundOffset + speed) % 40;
    speed += 0.0015;
    if (speed > 6) speed = 6;

    // SCORE: based on distance traveled. ~10 pts per second at start.
    distance += speed * dt * 10;
    score = Math.floor(distance);

    dino.vy += GRAV * dt;
    dino.y += dino.vy * dt;
    if (dino.y >= GROUND - DINO_H) {
      dino.y = GROUND - DINO_H;
      dino.vy = 0;
      dino.onGround = true;
      jumpsLeft = 2;
    } else {
      dino.onGround = false;
    }

    framesSinceSpawn++;
    if (framesSinceSpawn >= framesUntilSpawn) {
      spawnGroup();
      framesSinceSpawn = 0;
      var gapTime = 0.9 + Math.random() * 0.7;
      framesUntilSpawn = Math.floor(gapTime * 42);
      var minPx = 130;
      if (framesUntilSpawn * speed < minPx) {
        framesUntilSpawn = Math.ceil(minPx / speed);
      }
    }

    for (var i = cacti.length - 1; i >= 0; i--) {
      cacti[i].x -= speed;
      if (cacti[i].x + cacti[i].w < -10) cacti.splice(i, 1);
    }

    for (var j = 0; j < clouds.length; j++) {
      clouds[j].x -= speed * 0.3;
      if (clouds[j].x + clouds[j].w < -10) {
        clouds[j].x = W + 20;
        clouds[j].y = 20 + Math.random() * 50;
      }
    }

    for (var k = 0; k < cacti.length; k++) {
      var c = cacti[k];
      var padX = 2, padY = 2;
      if (dino.x + padX < c.x + c.w - padX &&
          dino.x + dino.w - padX > c.x + padX &&
          dino.y + padY < c.y + c.h - padY &&
          dino.y + dino.h - padY > c.y + padY) {
        return die();
      }
    }

    scoreEl.textContent = pad(score);
    var lv = Math.floor(score / 100) + 1;
    speedEl.textContent = lv;

    draw();
    raf = requestAnimationFrame(tick);
  }

  function die() {
    dead = true;
    cancelAnimationFrame(raf);
    if (score > best) {
      best = score;
      localStorage.setItem('dino_best', best);
      bestEl.textContent = pad(best);
    }
    overlayMsg.textContent = 'Your score: ' + pad(score) + '.';
    overlay.style.display = 'block';
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#b8c08e';
    for (var cl = 0; cl < clouds.length; cl++) {
      ctx.beginPath();
      ctx.arc(clouds[cl].x + clouds[cl].w / 2, clouds[cl].y, 7, 0, Math.PI * 2);
      ctx.arc(clouds[cl].x + clouds[cl].w / 4, clouds[cl].y + 2, 5, 0, Math.PI * 2);
      ctx.arc(clouds[cl].x + clouds[cl].w * 0.75, clouds[cl].y + 2, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#1e3a1a';
    ctx.fillRect(0, GROUND, W, 2);

    ctx.fillStyle = '#8a9468';
    for (var x = -groundOffset; x < W; x += 40) {
      ctx.fillRect(x, GROUND + 6, 20, 2);
    }

    ctx.fillStyle = '#1e3a1a';
    for (var i = 0; i < cacti.length; i++) {
      var c = cacti[i];
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.fillRect(c.x + 2, c.y + 4, 2, c.h - 8);
      ctx.fillRect(c.x + c.w - 4, c.y + 6, 2, c.h - 10);
    }

    ctx.fillStyle = '#1e3a1a';
    ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(dino.x + dino.w - 8, dino.y + 6, 3, 3);
    ctx.fillRect(dino.x, dino.y + dino.h - 4, dino.w - 6, 2);
  }

  function jump() {
    if (dead) { reset(); return; }
    if (jumpsLeft === 2) {
      dino.vy = -V0;
      jumpsLeft = 1;
    } else if (jumpsLeft === 1) {
      dino.vy = -V0_DOUBLE;
      jumpsLeft = 0;
    }
  }

  document.getElementById('jumpBtn').addEventListener('click', jump);
  cv.addEventListener('click', jump);
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); jump(); }, { passive: false });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
  });
  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>

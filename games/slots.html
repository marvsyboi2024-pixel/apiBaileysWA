<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slots</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent; font-family: Arial, sans-serif; padding: 18px 22px; color: #333; }
  .app { display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 2px; }
  .title { font-size: 13px; font-weight: bold; color: #2a3a1a; letter-spacing: 0.5px; }
  .best { background: rgba(180,190,140,0.35); color: #4a4a3a; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(140,150,100,0.5); }
  .divider { height: 1px; background: #3a4a2a; opacity: 0.4; margin-bottom: 8px; }
  .card { background: #1a1f17; border-radius: 10px; padding: 8px 9px 10px 9px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .scorebar { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; color: #a8b400; letter-spacing: 1.5px; padding: 0 2px 6px 2px; text-transform: uppercase; }
  .playfield { position: relative; border-radius: 4px; overflow: hidden; }
  canvas { display: block; background: #c4cd9d; border-radius: 4px; width: 100%; height: auto; }
  .overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96%; background: #283641; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center; padding: 18px 12px 0 12px; display: none; }
  .overlay h2 { color: #ffffff; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .overlay p { color: #b8c0c8; font-size: 11px; margin-bottom: 14px; }
  .overlay .sect { border-top: 1px solid rgba(255,255,255,0.15); }
  .overlay button { background: transparent; border: none; color: #a8b400; font-size: 14px; font-weight: bold; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
  .jump { display: flex; justify-content: center; margin-top: 12px; width: 100%; }
  .jump button { background: rgba(90,100,60,0.15); border: 1px solid #7a8a5a; border-radius: 12px; color: #3a4a1a; font-size: 15px; font-weight: bold; letter-spacing: 3px; padding: 0; height: 52px; width: 100%; cursor: pointer; font-family: inherit; }
  .jump button:active { background: rgba(90,100,60,0.35); color: #1a2a0a; }
  .jump button:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { text-align: center; color: #4a5a5a; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; margin-top: 8px; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🎰 Slots</div>
    <div class="best">🏆 BEST <span id="best">1000</span></div>
  </div>
  <div class="divider"></div>
  <div class="card">
    <div class="scorebar">
      <span>Coins <span id="coins">1000</span></span>
      <span>Bet <span id="bet">10</span></span>
    </div>
    <div class="playfield">
      <canvas id="c" width="336" height="200"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Result</h2>
        <p id="ovMsg">+0 coins</p>
        <div class="sect"><button id="closeOv">Continue</button></div>
      </div>
    </div>
  </div>
  <div class="jump">
    <button id="spinBtn">SPIN</button>
  </div>
  <div class="hint">Tap SPIN to play · win 3 in a row!</div>
</div>

<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var SYMS = [
    { c: '#1e3a1a', v: 5,  s: '🍒' },
    { c: '#2a5a2a', v: 8,  s: '🍋' },
    { c: '#8a6a1a', v: 12, s: '⭐' },
    { c: '#5a4a1a', v: 20, s: '🔔' },
    { c: '#8a1a1a', v: 50, s: '7️⃣' },
    { c: '#3a1a5a', v: 100, s: '💎' }
  ];

  var coins = parseInt(localStorage.getItem('slot_coins') || '1000', 10);
  var bet = 10;
  var spinBtn = document.getElementById('spinBtn');
  var coinsEl = document.getElementById('coins');
  var betEl = document.getElementById('bet');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovMsg = document.getElementById('ovMsg');
  var closeOv = document.getElementById('closeOv');

  var current = [0, 0, 0];
  var spinning = false;
  var spinTimer = null;

  var best = parseInt(localStorage.getItem('slot_best') || '1000', 10);
  bestEl.textContent = best;

  updateUI();

  function updateUI() {
    coinsEl.textContent = coins;
    betEl.textContent = bet;
    spinBtn.disabled = coins < bet;
  }

  function saveAll() {
    localStorage.setItem('slot_coins', coins);
    if (coins > best) {
      best = coins;
      localStorage.setItem('slot_best', best);
      bestEl.textContent = best;
    }
  }

  function randomSym() {
    return Math.floor(Math.random() * SYMS.length);
  }

  function spin() {
    if (spinning || coins < bet) return;
    spinning = true;
    coins -= bet;
    updateUI();
    spinBtn.textContent = 'SPINNING';
    var spinCount = 0;
    var maxSpins = 18;
    spinTimer = setInterval(function(){
      current = [randomSym(), randomSym(), randomSym()];
      draw();
      spinCount++;
      if (spinCount >= maxSpins) {
        clearInterval(spinTimer);
        finalize();
      }
    }, 70);
  }

  function finalize() {
    spinning = false;
    spinBtn.textContent = 'SPIN';
    spinBtn.disabled = false;
    var a = current[0], b = current[1], c = current[2];
    var win = 0;
    var msg = '';

    if (a === b && b === c) {
      win = SYMS[a].v * bet;
      msg = 'JACKPOT! ' + SYMS[a].s + SYMS[a].s + SYMS[a].s + ' ×' + SYMS[a].v;
    } else if (a === b || b === c || a === c) {
      win = bet * 2;
      msg = 'Two match! +' + win;
    } else {
      msg = 'No match. Try again.';
    }

    if (win > 0) {
      coins += win;
      updateUI();
      saveAll();
    }

    ovTitle.textContent = win > 0 ? 'You Win!' : 'No Win';
    ovMsg.textContent = msg;
    overlay.style.display = 'block';
    draw();
    if (coins < bet) {
      spinBtn.disabled = true;
    }
  }

  function draw() {
    ctx.fillStyle = '#c4cd9d';
    ctx.fillRect(0, 0, W, H);

    var reelW = 70;
    var reelH = 110;
    var gap = 14;
    var totalW = reelW * 3 + gap * 2;
    var startX = (W - totalW) / 2;
    var startY = (H - reelH) / 2;

    for (var i = 0; i < 3; i++) {
      var x = startX + i * (reelW + gap);
      var y = startY;

      ctx.fillStyle = '#1a1f17';
      ctx.fillRect(x - 3, y - 3, reelW + 6, reelH + 6);

      ctx.fillStyle = '#f0f0e0';
      ctx.fillRect(x, y, reelW, reelH);

      var sym = SYMS[current[i]];
      ctx.font = 'bold 42px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sym.s, x + reelW / 2, y + reelH / 2);
    }

    ctx.fillStyle = '#3a4a2a';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('TAP SPIN', W / 2, H - 16);
  }

  spinBtn.addEventListener('click', spin);
  closeOv.addEventListener('click', function(){ overlay.style.display = 'none'; });

  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); spin(); }
  });

  draw();
})();
</script>
</body>
</html>

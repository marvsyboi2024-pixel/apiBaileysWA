<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grand Piano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:6px;color:#fff;touch-action:none}
.shell{--a:#d9d2c0;--bg:#0e131d;background:var(--bg);border:2px solid var(--a);border-radius:14px;padding:10px;max-width:520px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font:900 15px Impact,Arial Black,sans-serif;letter-spacing:1px;color:var(--a)}
.stat{font:bold 11px monospace;color:var(--a);opacity:.8}
.kb{position:relative;height:170px;display:flex;border-radius:6px;overflow:hidden;background:#000;touch-action:none}
.w{flex:1;background:linear-gradient(#fafafa,#d4d4d4);border-right:1px solid #333;display:flex;align-items:flex-end;justify-content:center;font:bold 8px Arial;color:#555;padding-bottom:4px}
.w.on{background:linear-gradient(#ffe9a0,#e0b84a)}
.b{position:absolute;top:0;width:4.4%;height:62%;background:linear-gradient(#3a3a3a,#000);border-radius:0 0 4px 4px;z-index:2}
.b.on{background:linear-gradient(#e0b84a,#8a6a14)}
.row{display:flex;gap:8px;align-items:center;margin-top:9px;font:bold 11px monospace;color:var(--a)}
.row input{flex:1;accent-color:var(--a)}
.btn{flex:1;padding:10px 0;background:transparent;border:1.5px solid var(--a);color:var(--a);border-radius:8px;font:bold 12px Arial}
.btn.on{background:var(--a);color:#000}
</style>
</head>
<body>
<div class="shell">
<div class="hd"><div class="title">GRAND PIANO</div><div class="stat" id="stat"></div></div>
<div class="kb" id="kb"></div>
<div class="row"><button class="btn" id="oct-">OCT -</button><button class="btn" id="oct+">OCT +</button><button class="btn" id="sus">SUSTAIN</button></div>
<div class="row"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="90"><span id="vp">90%</span></div>
</div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var AC,bus,master,comp,NB,VOL=.9,notes=0;
function ir(sec,dk){var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dk)}return b}
function aud(){
 if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C({latencyHint:'interactive'});
  comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;
  master=AC.createGain();master.gain.value=VOL;bus=AC.createGain();
  var rv=AC.createConvolver();rv.buffer=ir(1.8,2.6);var rg=AC.createGain();rg.gain.value=.16;
  bus.connect(master);bus.connect(rv);rv.connect(rg);rg.connect(master);master.connect(comp);comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 if(AC.state!=='running')AC.resume();
 return AC}
function G(v,t){var g=AC.createGain();g.gain.setValueAtTime(v,t);return g}
function dec(g,t,v0,dur){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(v0,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function O(type,f,t,dur){var o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur+.05);return o}
function N(t,dur){var s=AC.createBufferSource();s.buffer=NB;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return s}
function F(type,f,q){var b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1])}
function stat(){$('stat').textContent='NOTES '+notes}
var kb=$('kb'),WI=[0,2,4,5,7,9,11],BASE=60,SUS=0,PV=[];
(function(){for(var o=0;o<2;o++)WI.forEach(function(s,idx){var k=document.createElement('div');k.className='k w';k.dataset.o=o*12+s;kb.appendChild(k);
 if(s!==4&&s!==11){var b=document.createElement('div');b.className='k b';b.dataset.o=o*12+s+1;b.style.left=((o*7+idx+1)*100/14-2.2)+'%';kb.appendChild(b)}})})();
function lab(){[].forEach.call(kb.querySelectorAll('.w'),function(k){var m=BASE+ +k.dataset.o;k.textContent=m%12===0?'C'+(Math.floor(m/12)-1):''})}lab();
function pnote(m,v){var t=AC.currentTime,f=440*Math.pow(2,(m-69)/12),out=G(.0001,t),lp=F('lowpass',Math.min(14000,800+v*v*6500+f*2.5),.4),base=Math.max(.8,4.2-(m-36)*.065),n,d,o,g;
 out.gain.exponentialRampToValueAtTime(.2+.5*v,t+.004);
 var nz=N(t,.08),nf=F('bandpass',Math.min(f*3,4500),1.2),ng=G(1,t);dec(ng,t,.22*v,.05);chain(nz,nf,ng,out);
 for(n=1;n<=6;n++){var pf=f*n*Math.sqrt(1+.0004*n*n);if(pf>15000)break;var amp=.55/Math.pow(n,1.1)*(n>2?.5+.5*v:1);
  for(d=0;d<(n<3?2:1);d++){o=O('sine',pf,t,base*2);o.detune.value=(d?1:-1)*(n<3?1.2:0);g=G(1,t);dec(g,t,amp/(n<3?2:1)*1.6,base*2/(1+(n-1)*.5));chain(o,g,out)}}
 chain(out,lp,bus);var h={out:out};PV.push(h);if(PV.length>14)prel(PV[0]);return h}
function prel(h){var i=PV.indexOf(h);if(i>=0)PV.splice(i,1);var t=AC.currentTime;h.out.gain.cancelScheduledValues(t);h.out.gain.setTargetAtTime(0,t,.09)}
function pstart(m,v,el){if(!aud())return null;var h=pnote(m,v);h.el=el;if(el)el.classList.add('on');notes++;stat();return h}
function pstop(h){if(!h)return;if(h.el)h.el.classList.remove('on');if(SUS)h.sus=1;else prel(h)}
var PP={};
function pk(e){var el=document.elementFromPoint(e.clientX,e.clientY);el=el&&el.closest&&el.closest('.k');return el&&kb.contains(el)?el:null}
function pbegin(e,el){var r=el.getBoundingClientRect(),v=.35+.65*Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));PP[e.pointerId]={el:el,h:pstart(BASE+ +el.dataset.o,v,el)}}
kb.addEventListener('pointerdown',function(e){e.preventDefault();try{kb.setPointerCapture(e.pointerId)}catch(_){}var el=pk(e);if(el)pbegin(e,el)});
kb.addEventListener('pointermove',function(e){var c=PP[e.pointerId];if(!c)return;var el=pk(e);if(el&&el!==c.el){pstop(c.h);pbegin(e,el)}});
function pup(e){var c=PP[e.pointerId];if(c){pstop(c.h);delete PP[e.pointerId]}}
kb.addEventListener('pointerup',pup);kb.addEventListener('pointercancel',pup);
$('oct-').onclick=function(){BASE=Math.max(36,BASE-12);lab()};
$('oct+').onclick=function(){BASE=Math.min(72,BASE+12);lab()};
$('sus').onclick=function(){SUS=!SUS;this.classList.toggle('on',SUS);if(!SUS)PV.slice().forEach(function(h){if(h.sus)prel(h)})};
var PK={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16},HK={};
document.addEventListener('keydown',function(e){if(e.repeat)return;var k=e.key.toLowerCase();
 if(k in PK&&!HK[k])HK[k]=pstart(BASE+PK[k],.75,kb.querySelector('[data-o="'+PK[k]+'"]'))});
document.addEventListener('keyup',function(e){var k=e.key.toLowerCase();if(HK[k]){pstop(HK[k]);HK[k]=null}});
document.addEventListener('pointerdown',function(){aud()});
document.addEventListener('visibilitychange',function(){if(AC){if(document.hidden)AC.suspend();else AC.resume()}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
$('vol').oninput=function(){VOL=this.value/100;$('vp').textContent=this.value+'%';if(master)master.gain.setTargetAtTime(VOL,AC.currentTime,.02)};
stat();
})();
</script>
</body>
</html>

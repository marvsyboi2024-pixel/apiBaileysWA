<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Piano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:Arial,sans-serif;padding:18px 22px}
.app{display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px 2px}
.title{font-size:13px;font-weight:bold;color:#d4af37;letter-spacing:1px}
.best{background:rgba(212,175,55,0.15);color:#d4af37;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;border:1px solid rgba(212,175,55,0.4)}
.divider{height:1px;background:#d4af37;opacity:0.35;margin-bottom:8px}
.card{background:linear-gradient(180deg,#2a1040 0%,#1a0828 100%);border:2px solid #d4af37;border-radius:12px;padding:8px}
.scorebar{display:flex;justify-content:space-between;font-family:monospace;font-size:11px;color:#d4af37;letter-spacing:1.5px;padding:2px 4px 6px 4px;text-transform:uppercase}
.octctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.octctl button{background:transparent;border:1px solid #d4af37;color:#d4af37;border-radius:8px;padding:8px;font-family:inherit;font-weight:bold;font-size:11px;letter-spacing:1px;cursor:pointer}
.octctl button:active{background:rgba(212,175,55,0.2)}
.playfield{position:relative;border-radius:6px;overflow:hidden}
canvas{display:block;background:transparent;border-radius:6px;width:100%;height:auto;touch-action:none}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.toggles button{background:transparent;border:1px solid #d4af37;color:#d4af37;border-radius:8px;padding:10px;font-family:inherit;font-weight:bold;font-size:11px;letter-spacing:1px;cursor:pointer}
.toggles button.on{background:rgba(212,175,55,0.25);color:#ffdd44}
.toggles button:active{background:rgba(212,175,55,0.3)}
.volctl{margin-top:8px;padding:8px 10px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.3);border-radius:8px}


.volctl .row{display:flex;align-items:center;gap:10px}
.volctl .lbl{color:#d4af37;font-family:monospace;font-size:11px;font-weight:bold;letter-spacing:1px;min-width:40px}
.volctl .pct{color:#ffdd44;font-family:monospace;font-size:13px;font-weight:bold;letter-spacing:1px;min-width:44px;text-align:right}
.volctl input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;background:linear-gradient(90deg,#ffdd44 0%,#ffdd44 var(--pct,55%),#3a2050 var(--pct,55%),#3a2050 100%);border-radius:4px;outline:none;cursor:pointer}
.volctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffdd44,#a87810);border:2px solid #d4af37;box-shadow:0 2px 6px rgba(0,0,0,0.5);cursor:grab}
.volctl input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
.volctl input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#ffdd44;border:2px solid #d4af37;cursor:grab}
.volctl input[type=range]::-moz-range-track{height:8px;background:#3a2050;border-radius:4px}
.hint{text-align:center;color:#8866aa;font-size:11px;font-weight:bold;margin-top:10px;padding-bottom:2px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="title">🎹 PIANO</div><div class="best">🎵 <span id="lastNote">—</span></div></div>
<div class="divider"></div>
<div class="card">
<div class="scorebar"><span>Octave <span id="oct">4</span></span><span>Notes <span id="count">0</span></span></div>
<div class="octctl">
<button id="octDown">◀ OCT</button>
<button id="octReset">RESET</button>
<button id="octUp">OCT ▶</button>
</div>
<div class="playfield"><canvas id="c" width="336" height="200"></canvas></div>
<div class="toggles">
<button id="sustainBtn">SUSTAIN: OFF</button>
<button id="labelsBtn" class="on">LABELS: ON</button>
</div>
</div>
<div class="volctl">
<div class="row">
<span class="lbl">VOL</span>
<input type="range" id="volSlider" min="0" max="100" value="55" step="1">
<span class="pct" id="volPct">55%</span>
</div>
</div>
<div class="hint">Tap or slide to play · multi-touch for chords</div>
</div>
<script>
(function(){
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
var WHITE_NAMES=['C','D','E','F','G','A','B','C'];
var WHITE_OCT_OFFSET=[0,0,0,0,0,0,0,1];
var BLACK_AFTER=[0,1,3,4,5];
var NUM_WHITE=8;
var WHITE_W=W/NUM_WHITE;
var WHITE_H=H;
var BLACK_W=WHITE_W*0.58;
var BLACK_H=H*0.62;

var octave=4;
var volumeLevel=55;
var sustain=false;
var showLabels=true;
var audioCtx=null,masterGain=null,compressor=null;
var noteCount=0;
var activeKeys={};
var activeVoices=0;
var MAX_VOICES=8;

var lastNoteEl=document.getElementById('lastNote');
var octEl=document.getElementById('oct');
var countEl=document.getElementById('count');
var sustainBtn=document.getElementById('sustainBtn');
var labelsBtn=document.getElementById('labelsBtn');

function initAudio(){
if(!audioCtx){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();
masterGain.gain.value=volumeLevel/100;
compressor=audioCtx.createDynamicsCompressor();
compressor.threshold.value=-24;
compressor.knee.value=20;
compressor.ratio.value=10;
compressor.attack.value=0.002;
compressor.release.value=0.18;
masterGain.connect(compressor);
compressor.connect(audioCtx.destination);
}catch(e){audioCtx=null;}
}
if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}

function noteFreq(note,oct){
var idx={'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11}[note];
var midi=(oct+1)*12+idx;
return 440*Math.pow(2,(midi-69)/12);
}

function playNote(note,oct){
initAudio();
if(!audioCtx)return;
if(activeVoices>=MAX_VOICES)return;
activeVoices++;
var f=noteFreq(note,oct);
var t=audioCtx.currentTime;
var rel=sustain?3.2:1.8;
var noteGain=audioCtx.createGain();
noteGain.gain.setValueAtTime(0.0001,t);
noteGain.gain.exponentialRampToValueAtTime(0.4,t+0.008);
noteGain.gain.exponentialRampToValueAtTime(0.2,t+0.12);
noteGain.gain.exponentialRampToValueAtTime(0.08,t+0.8);
noteGain.gain.exponentialRampToValueAtTime(0.0001,t+rel);

var filter=audioCtx.createBiquadFilter();
filter.type='lowpass';
filter.frequency.setValueAtTime(Math.min(6000,f*7),t);
filter.frequency.exponentialRampToValueAtTime(Math.max(400,f*2),t+rel*0.9);
filter.Q.value=0.5;
filter.connect(noteGain);
noteGain.connect(masterGain);

var partials=[
{freq:f,type:'triangle',level:0.55},
{freq:f*2,type:'sine',level:0.22},
{freq:f*3,type:'sine',level:0.09}
];

var oscillators=[];
partials.forEach(function(p){
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type=p.type;
osc.frequency.value=p.freq;
g.gain.value=p.level;
osc.connect(g);
g.connect(filter);
osc.start(t);
osc.stop(t+rel+0.05);
oscillators.push(osc);
});

oscillators[0].onended=function(){activeVoices=Math.max(0,activeVoices-1);};

lastNoteEl.textContent=note+oct;
noteCount++;
countEl.textContent=noteCount;
}

function drawKey(x,y,w,h,isBlack,pressed,label){
if(isBlack){
ctx.fillStyle=pressed?'#3a2a1a':'#1a0f08';
ctx.fillRect(x,y,w,h);
ctx.fillStyle=pressed?'#6a4a2a':'#3a2010';
ctx.fillRect(x+1,y+1,w-2,4);
ctx.strokeStyle='#0a0500';
ctx.lineWidth=1;
ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}else{
ctx.fillStyle=pressed?'#ffe8a0':'#f8f4e8';
ctx.fillRect(x,y,w,h);
ctx.fillStyle=pressed?'#c8a84a':'#c4a840';
ctx.fillRect(x,y+h-5,w,5);
ctx.strokeStyle='#a08830';
ctx.lineWidth=1;
ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
if(showLabels&&label){
ctx.fillStyle=pressed?'#5a3a00':'#8a6a20';
ctx.font='bold 13px Arial';
ctx.textAlign='center';
ctx.textBaseline='bottom';
ctx.fillText(label,x+w/2,y+h-12);
}
}
}

function draw(){
ctx.fillStyle='#0a0410';
ctx.fillRect(0,0,W,H);
var i;
for(i=0;i<NUM_WHITE;i++){
drawKey(i*WHITE_W,0,WHITE_W,WHITE_H,false,activeKeys['w'+i],WHITE_NAMES[i]);
}
for(i=0;i<NUM_WHITE-1;i++){
if(BLACK_AFTER.indexOf(i)>=0){
var bx=(i+1)*WHITE_W-BLACK_W/2;
drawKey(bx,0,BLACK_W,BLACK_H,true,activeKeys['b'+i],'');
}
}
}

function blackNoteFor(wi){
if(BLACK_AFTER.indexOf(wi)<0)return null;
var prevName=WHITE_NAMES[wi];
var map={'C':'C#','D':'D#','F':'F#','G':'G#','A':'A#'};
return map[prevName]||null;
}

function hitTest(x,y){
var i;
for(i=0;i<NUM_WHITE-1;i++){
if(BLACK_AFTER.indexOf(i)>=0){
var bx=(i+1)*WHITE_W-BLACK_W/2;
if(x>=bx&&x<=bx+BLACK_W&&y>=0&&y<=BLACK_H){
var n=blackNoteFor(i);
if(n)return{type:'black',idx:i,note:n,oct:octave};
}
}
}
var wi=Math.floor(x/WHITE_W);
if(wi>=0&&wi<NUM_WHITE){
var nameIdx=wi;
return{type:'white',idx:wi,note:WHITE_NAMES[nameIdx],oct:octave+WHITE_OCT_OFFSET[nameIdx]};
}
return null;
}

function getPos(touch){
var rect=cv.getBoundingClientRect();
var sx=cv.width/rect.width,sy=cv.height/rect.height;
return{x:(touch.clientX-rect.left)*sx,y:(touch.clientY-rect.top)*sy};
}

function press(x,y){
var hit=hitTest(x,y);
if(!hit)return;
var key=(hit.type==='black'?'b':'w')+hit.idx;
if(activeKeys[key])return;
activeKeys[key]=true;
playNote(hit.note,hit.oct);
draw();
}

function release(){activeKeys={};draw();}

var activeTouches={};
cv.addEventListener('touchstart',function(e){
e.preventDefault();
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i];
var p=getPos(t);
activeTouches[t.identifier]=true;
press(p.x,p.y);
}
},{passive:false});
cv.addEventListener('touchmove',function(e){
e.preventDefault();
for(var i=0;i<e.touches.length;i++){
var p=getPos(e.touches[i]);
press(p.x,p.y);
}
},{passive:false});
cv.addEventListener('touchend',function(e){
e.preventDefault();
for(var i=0;i<e.changedTouches.length;i++){
delete activeTouches[e.changedTouches[i].identifier];
}
if(Object.keys(activeTouches).length===0)release();
},{passive:false});
cv.addEventListener('touchcancel',function(e){e.preventDefault();release();},{passive:false});

var mouseDown=false;
cv.addEventListener('mousedown',function(e){mouseDown=true;var p=getPos(e);press(p.x,p.y);});
cv.addEventListener('mousemove',function(e){if(!mouseDown)return;var p=getPos(e);press(p.x,p.y);});
cv.addEventListener('mouseup',function(){mouseDown=false;release();});
cv.addEventListener('mouseleave',function(){mouseDown=false;release();});

function updateUI(){
octEl.textContent=octave;
sustainBtn.textContent='SUSTAIN: '+(sustain?'ON':'OFF');
sustainBtn.classList.toggle('on',sustain);
labelsBtn.textContent='LABELS: '+(showLabels?'ON':'OFF');
labelsBtn.classList.toggle('on',showLabels);
}

document.getElementById('octDown').addEventListener('click',function(){if(octave>2){octave--;updateUI();draw();}});
document.getElementById('octUp').addEventListener('click',function(){if(octave<6){octave++;updateUI();draw();}});
document.getElementById('octReset').addEventListener('click',function(){octave=4;updateUI();draw();});
sustainBtn.addEventListener('click',function(){sustain=!sustain;updateUI();});
labelsBtn.addEventListener('click',function(){showLabels=!showLabels;updateUI();draw();});
function setVolume(v){volumeLevel=Math.max(0,Math.min(100,v));if(masterGain)masterGain.gain.value=volumeLevel/100;var el=document.getElementById('volPct');if(el)el.textContent=volumeLevel+'%';var sl=document.getElementById('volSlider');if(sl){sl.value=volumeLevel;sl.style.setProperty('--pct',volumeLevel+'%');}}
var volSlider=document.getElementById('volSlider');
if(volSlider){
volSlider.addEventListener('input',function(){setVolume(parseInt(this.value,10));});
volSlider.style.setProperty('--pct',volumeLevel+'%');
}
setVolume(volumeLevel);

updateUI();
draw();
})();
</script>
</body>
</html>
